<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bill Ledger</title>
<meta name="description" content="A private monthly bill checklist that keeps its history. All data stays on your device.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F2F1EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E0F12" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bill Ledger">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.png">
<style>*{margin:0}</style>
</head>
<body>
<style>
/* ── tokens ─────────────────────────────────────────────────────── */
:root{
  --paper:#F2F1EE; --surface:#FFFFFF; --surface-2:#F6F5F2; --sheet:#FFFFFF;
  --ink:#16181D; --ink-2:#3D424C; --muted:#7A7F89;
  --line:#E2E0DA; --line-soft:#ECEAE6;
  --accent:#2C59D8; --accent-soft:#E7ECFB; --accent-ink:#FFFFFF;
  --ok:#1C8556;   --ok-soft:#E2F2E9;
  --warn:#A86400; --warn-soft:#FBEFDB;
  --bad:#CC3B27;  --bad-soft:#FBE7E3;
  --card-sh:0 1px 1px rgba(22,24,29,.04), 0 2px 10px rgba(22,24,29,.05);
  --shadow:0 2px 6px rgba(22,24,29,.08), 0 18px 44px rgba(22,24,29,.16);
  --scrim:rgba(22,24,29,.38);
  --dock:rgba(255,255,255,.82);

  --f-display:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-ui:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --f-num:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;

  --r-sm:10px; --r-md:14px; --r-lg:20px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
  --paper:#0E0F12; --surface:#191A1E; --surface-2:#212227; --sheet:#191A1E;
  --ink:#F1F2F4; --ink-2:#C8CAD0; --muted:#8C8F98;
  --line:#2B2D33; --line-soft:#232429;
  --accent:#7C9BFF; --accent-soft:#1D2440; --accent-ink:#0B0E18;
  --ok:#4CC38A;   --ok-soft:#13281E;
  --warn:#E3A33B; --warn-soft:#2C2213;
  --bad:#F07D69;  --bad-soft:#341B17;
  --card-sh:0 0 0 1px rgba(255,255,255,.04);
  --shadow:0 2px 6px rgba(0,0,0,.5), 0 18px 44px rgba(0,0,0,.55);
  --scrim:rgba(0,0,0,.55);
  --dock:rgba(25,26,30,.82);
  }
}
:root[data-theme="dark"]{
  --paper:#0E0F12; --surface:#191A1E; --surface-2:#212227; --sheet:#191A1E;
  --ink:#F1F2F4; --ink-2:#C8CAD0; --muted:#8C8F98;
  --line:#2B2D33; --line-soft:#232429;
  --accent:#7C9BFF; --accent-soft:#1D2440; --accent-ink:#0B0E18;
  --ok:#4CC38A;   --ok-soft:#13281E;
  --warn:#E3A33B; --warn-soft:#2C2213;
  --bad:#F07D69;  --bad-soft:#341B17;
  --card-sh:0 0 0 1px rgba(255,255,255,.04);
  --shadow:0 2px 6px rgba(0,0,0,.5), 0 18px 44px rgba(0,0,0,.55);
  --scrim:rgba(0,0,0,.55);
  --dock:rgba(25,26,30,.82);
}
:root[data-theme="light"]{
  --paper:#F2F1EE; --surface:#FFFFFF; --surface-2:#F6F5F2; --sheet:#FFFFFF;
  --ink:#16181D; --ink-2:#3D424C; --muted:#7A7F89;
  --line:#E2E0DA; --line-soft:#ECEAE6;
  --accent:#2C59D8; --accent-soft:#E7ECFB; --accent-ink:#FFFFFF;
  --ok:#1C8556;   --ok-soft:#E2F2E9;
  --warn:#A86400; --warn-soft:#FBEFDB;
  --bad:#CC3B27;  --bad-soft:#FBE7E3;
  --card-sh:0 1px 1px rgba(22,24,29,.04), 0 2px 10px rgba(22,24,29,.05);
  --shadow:0 2px 6px rgba(22,24,29,.08), 0 18px 44px rgba(22,24,29,.16);
  --scrim:rgba(22,24,29,.38);
  --dock:rgba(255,255,255,.82);
}

/* ── base ───────────────────────────────────────────────────────── */
*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--f-ui); font-size:15px; line-height:1.45;
  -webkit-text-size-adjust:100%; -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
button,input,select,textarea{font:inherit; color:inherit}
button{background:none; border:0; cursor:pointer; -webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px}
.num{font-family:var(--f-num); font-variant-numeric:tabular-nums; letter-spacing:-.01em}
.eyebrow{
  font-size:11px; font-weight:650; letter-spacing:.09em; text-transform:uppercase;
  color:var(--muted);
}
.shell{max-width:560px; margin:0 auto; padding:0 0 108px}

/* ── app bar ────────────────────────────────────────────────────── */
.bar{
  position:sticky; top:0; z-index:30; background:var(--surface);
  border-bottom:1px solid var(--line);
  padding:max(10px,env(safe-area-inset-top)) 16px 0;
}
.bar-top{display:flex; align-items:center; gap:10px; min-height:38px}
.brand{
  margin:0; font-family:var(--f-display); font-size:19px; font-weight:600;
  letter-spacing:-.015em; margin-right:auto;
}
.icon-btn{
  position:relative; width:44px; height:44px; display:grid; place-items:center;
  border-radius:10px; color:var(--ink-2);
}
.icon-btn.unsaved::after{
  content:""; position:absolute; top:6px; right:6px; width:8px; height:8px;
  border-radius:99px; background:var(--warn); border:2px solid var(--surface);
}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn svg{width:19px; height:19px; fill:none; stroke:currentColor; stroke-width:1.7;
  stroke-linecap:round; stroke-linejoin:round}

.month-nav{display:flex; align-items:center; gap:6px; padding:2px 0 10px}
.month-nav .icon-btn{width:44px; height:44px}
.month-label{
  flex:1; text-align:center; font-family:var(--f-display);
  font-size:20px; font-weight:600; letter-spacing:-.01em;
}
.month-label small{
  display:block; font-family:var(--f-ui); font-size:11px; font-weight:650;
  letter-spacing:.09em; text-transform:uppercase; color:var(--muted); margin-top:1px;
}
.today-btn{
  font-size:12px; font-weight:600; color:var(--accent);
  padding:6px 10px; border-radius:8px; background:var(--accent-soft);
}

.tabs{display:flex; gap:2px; border-top:1px solid var(--line-soft)}
.tab{
  flex:1; padding:12px 4px 11px; font-size:13.5px; font-weight:600;
  color:var(--muted); border-bottom:2px solid transparent; margin-bottom:-1px;
}
.tab[aria-selected="true"]{color:var(--ink); border-bottom-color:var(--accent)}

/* ── summary ────────────────────────────────────────────────────── */
.summary{
  background:var(--surface); border-bottom:1px solid var(--line);
  padding:11px 16px 10px; display:flex; flex-direction:column; gap:10px;
}
.tot-row{display:flex; flex-direction:column; gap:5px}
.tot-head{display:flex; align-items:baseline; gap:8px}
.tot-cur{
  font-size:11px; font-weight:650; letter-spacing:.09em; text-transform:uppercase;
  color:var(--muted);
}
.tot-amt{font-size:25px; font-weight:600; letter-spacing:-.025em; margin-left:auto;
  line-height:1.05}
.tot-sub{font-size:11.5px; color:var(--muted)}
.srcfold{border-top:1px solid var(--line-soft); padding-top:8px}
.srcfold summary{
  display:flex; align-items:center; gap:8px; cursor:pointer; list-style:none;
  font-size:11.5px; color:var(--muted); padding:3px 0; min-height:44px;
}
.srcfold summary::-webkit-details-marker{display:none}
.srcfold .by-src{margin-top:9px}
.meter{height:5px; border-radius:99px; background:var(--line-soft); overflow:hidden; display:flex}
.meter i{display:block; height:100%; background:var(--ok); transition:width .3s ease}
.meter i.skip{background:var(--muted); opacity:.5}
.by-src{display:flex; flex-wrap:wrap; gap:6px}
.src-tot{
  display:inline-flex; align-items:center; gap:6px; padding:4px 9px 4px 7px;
  border:1px solid var(--line); border-radius:99px; font-size:12px; background:var(--surface-2);
}
.src-tot b{font-weight:600; font-family:var(--f-num); font-variant-numeric:tabular-nums}
.dot{width:8px; height:8px; border-radius:99px; flex:none}
.all-clear{
  display:flex; align-items:center; gap:8px; color:var(--ok);
  font-size:13.5px; font-weight:600;
}

/* ── view toggle ────────────────────────────────────────────────── */
.controls{display:flex; align-items:center; gap:8px; padding:9px 16px 9px 0}
.controls .active-filter{flex:none; margin-left:16px; background:var(--ink);
  border-color:var(--ink); color:var(--paper); gap:5px}
.active-filter .fx{width:12px; height:12px; fill:none; stroke:currentColor; stroke-width:2;
  stroke-linejoin:round; flex:none}
.active-filter .fx.x{opacity:.75}
.controls .active-filter + .filters{padding-left:8px}
.icon-btn.on{background:var(--accent-soft); color:var(--accent)}
.controls .filters{flex:1; min-width:0; padding:0 0 0 16px}
.vtog{display:flex; gap:2px; padding:2px; background:var(--surface-2);
  border:1px solid var(--line); border-radius:9px}
/* Keep these visually compact but give the thumb a full 44px to land on. */
.vtog button{position:relative; padding:9px 10px; border-radius:7px; color:var(--muted);
  display:grid; place-items:center}
.vtog button::after{content:""; position:absolute; inset:-5px -4px}
.sheet-done{position:relative}
.sheet-done::after{content:""; position:absolute; inset:-10px -6px}
.vtog button[aria-pressed="true"]{background:var(--surface); color:var(--ink);
  box-shadow:0 1px 2px rgba(0,0,0,.09)}
.vtog svg{width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.8;
  stroke-linecap:round; stroke-linejoin:round}

/* ── tiles ──────────────────────────────────────────────────────── */
.tiles{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:9px; padding:0 16px 18px}
.tile{
  position:relative; display:flex; flex-direction:column; align-items:stretch;
  gap:0; text-align:left; padding:11px 11px 11px 14px; min-height:104px;
  background:var(--surface); border:1px solid var(--line); border-radius:13px;
  overflow:hidden;
}
.tile::before{
  content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--line);
}
.tile[data-state="today"]::before,
.tile[data-state="soon"]::before{background:var(--warn)}
.tile[data-state="missed"]::before{background:var(--bad)}
.tile[data-state="paid"]::before{background:var(--ok)}
.tile[data-state="partial"]::before{background:var(--accent)}
.tile[data-state="skipped"]::before{background:var(--muted); opacity:.6}
.tile-top{display:flex; align-items:center; gap:5px; font-size:11px; color:var(--muted);
  min-width:0; margin-bottom:5px}
.tile-src{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.tile-name{
  font-size:13.5px; font-weight:600; line-height:1.3; letter-spacing:-.005em;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
}
.tile[data-state="paid"] .tile-name,
.tile[data-state="skipped"] .tile-name{color:var(--muted)}
.tile-amt{margin-top:auto; padding-top:7px; font-size:16px; font-weight:600; letter-spacing:-.015em}
.tile[data-state="skipped"] .tile-amt{color:var(--muted); text-decoration:line-through}
.tile-stat{font-size:10.5px; font-weight:600; margin-top:2px}
.tile-check{
  position:absolute; top:6px; right:6px; width:32px; height:32px; display:grid; place-items:center;
}
.tile-check span{
  width:21px; height:21px; border-radius:99px; border:1.5px solid var(--line);
  display:grid; place-items:center;
}
.tile-check svg{width:12px; height:12px; fill:none; stroke:var(--surface); stroke-width:2.6;
  stroke-linecap:round; stroke-linejoin:round; opacity:0}
.tile[data-state="paid"] .tile-check span{background:var(--ok); border-color:var(--ok)}
.tile[data-state="paid"] .tile-check svg{opacity:1}
.tile[data-state="skipped"] .tile-check span{background:var(--muted); border-color:var(--muted); opacity:.65}
.tile[data-state="skipped"] .tile-check svg{opacity:1}
@media (max-width:340px){ .tiles{grid-template-columns:1fr} }

/* ── filters ────────────────────────────────────────────────────── */
.filters{
  display:flex; gap:6px; padding:12px 16px; overflow-x:auto; scrollbar-width:none;
}
.filters::-webkit-scrollbar{display:none}
.chip{
  flex:none; display:inline-flex; align-items:center; gap:6px;
  padding:12px 13px; border-radius:99px; border:1px solid var(--line);
  background:var(--surface); font-size:13px; font-weight:550; color:var(--ink-2);
  white-space:nowrap;
}
.chip[aria-pressed="true"]{
  background:var(--ink); border-color:var(--ink); color:var(--paper);
}

/* ── ledger rows ────────────────────────────────────────────────── */
.group{margin:0 0 18px}
.group-head{
  display:flex; align-items:center; gap:10px; padding:0 16px 7px;
}
.group-head .eyebrow{white-space:nowrap}
.group-head .rule{flex:1; height:1px; background:var(--line)}
.group-head .cnt{font-size:11px; color:var(--muted); font-family:var(--f-num)}
.group-head .eyebrow em{
  font-style:normal; margin-left:7px; padding:2px 6px; border-radius:4px;
  font-size:10px; letter-spacing:.06em;
}
.group[data-gstate="missed"] .eyebrow em{background:var(--bad-soft); color:var(--bad)}
.group[data-gstate="today"]  .eyebrow em{background:var(--warn-soft); color:var(--warn)}
.group[data-gstate="soon"]   .eyebrow em{background:var(--warn-soft); color:var(--warn)}
/* a quiet edge marks each overdue row without shouting the word 13 times */
.group[data-gstate="missed"] .row{box-shadow:inset 3px 0 0 var(--bad)}
.group[data-gstate="today"]  .row{box-shadow:inset 3px 0 0 var(--warn)}
.rows{background:var(--surface); border-block:1px solid var(--line)}

.row{display:flex; align-items:stretch; gap:0; position:relative}
.row + .row::before{
  content:""; position:absolute; left:56px; right:0; top:0; height:1px; background:var(--line-soft);
}
.tick{
  flex:none; width:56px; display:grid; place-items:center; align-self:stretch;
}
.tick span{
  width:24px; height:24px; border-radius:99px; border:1.5px solid var(--line);
  display:grid; place-items:center; transition:background .15s, border-color .15s;
}
.tick svg{width:14px; height:14px; fill:none; stroke:var(--surface); stroke-width:2.4;
  stroke-linecap:round; stroke-linejoin:round; opacity:0}
.row[data-state="paid"] .tick span{background:var(--ok); border-color:var(--ok)}
.row[data-state="paid"] .tick svg{opacity:1; stroke:var(--surface)}
.row[data-state="skipped"] .tick span{background:var(--muted); border-color:var(--muted); opacity:.65}
.row[data-state="skipped"] .tick svg{opacity:1}
.row[data-state="missed"] .tick span{border-color:var(--bad)}

.body{
  flex:1; min-width:0; display:flex; align-items:center; gap:12px;
  padding:12px 16px 12px 0; text-align:left;
}
.info{min-width:0; flex:1; display:block}
.name{
  display:block; font-size:15px; font-weight:550; letter-spacing:-.005em;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.row[data-state="paid"] .name,
.row[data-state="skipped"] .name{color:var(--muted)}
.meta{
  display:flex; align-items:center; gap:6px; margin-top:3px;
  font-size:12px; color:var(--muted);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.meta .sep{opacity:.45}
.freq-tag{color:var(--accent); font-weight:600}
.amt-col{text-align:right; flex:none; display:block}
.amt{display:block; font-size:15px; font-weight:600; letter-spacing:-.01em}
.row[data-state="skipped"] .amt{color:var(--muted); text-decoration:line-through;
  text-decoration-thickness:1px}
.stat{display:block; font-size:11.5px; margin-top:3px; font-weight:600}
.stat.paid{color:var(--ok)}
.stat.missed{color:var(--bad)}
.stat.soon{color:var(--warn)}
.stat.today{color:var(--warn); font-weight:700}
.stat.scheduled{color:var(--accent); font-weight:600}
.group[data-gstate="scheduled"] .eyebrow em{background:var(--accent-soft); color:var(--accent)}
.group[data-gstate="scheduled"] .row{box-shadow:inset 3px 0 0 var(--accent)}
.row[data-state="scheduled"]{box-shadow:inset 3px 0 0 var(--accent)}
.tile[data-state="scheduled"]::before{background:var(--accent)}
.stat.partial{color:var(--accent); font-weight:600}
.amt-col em{font-style:normal; font-size:9.5px; font-weight:600; color:var(--muted);
  display:block; letter-spacing:.05em; text-transform:uppercase; margin-top:1px}
.pbar{display:block; height:3px; border-radius:99px; background:var(--line-soft);
  overflow:hidden; margin-top:6px; max-width:150px}
.pbar i{display:block; height:100%; background:var(--accent)}
.pbar.big{max-width:none; height:5px; margin:9px 0 0}
/* Outranks the group-level stripe below: "you have started paying this" is more
   useful on the row than repeating what the group header already says. */
.group[data-gstate] .row[data-state="partial"],
.row[data-state="partial"]{box-shadow:inset 3px 0 0 var(--accent)}

.paystate{border:1px solid var(--line); border-radius:11px; padding:11px 12px;
  background:var(--surface-2); margin-bottom:11px}
.paystate-top{display:flex; align-items:baseline; gap:10px; font-size:12px; color:var(--muted)}
.paystate-top b{margin-left:auto; font-size:20px; font-weight:600; color:var(--ink);
  letter-spacing:-.02em}
.paystate.done .paystate-top b{color:var(--ok)}
.paystate.part .paystate-top b{color:var(--accent)}
.paystate-sub{font-size:11.5px; color:var(--muted); margin-top:7px}

.paylist{display:flex; flex-direction:column; gap:7px; margin-bottom:11px}
.payrow{display:flex; align-items:center; gap:8px}
.payn{flex:none; width:18px; font-size:11px; color:var(--muted); text-align:center}
.payfields{flex:1; min-width:0; display:grid; grid-template-columns:1.15fr .85fr .9fr; gap:6px}
.payfields.three{grid-template-columns:1.05fr .8fr .9fr}
.schednote.calm{color:var(--muted); font-weight:500}
.schednote.warn{color:var(--warn); font-weight:600}
.payfields input,.payfields select{
  width:100%; min-width:0; padding:9px 8px; border-radius:9px; background:var(--surface);
  border:1px solid var(--line); font-size:13.5px; -webkit-appearance:none; appearance:none;
  min-height:44px;
}
.paydel{flex:none; width:32px; height:44px; display:grid; place-items:center; color:var(--muted)}
.paydel svg{width:15px; height:15px; fill:none; stroke:currentColor; stroke-width:1.9;
  stroke-linecap:round}
.payacts{display:flex; flex-direction:column; gap:8px}
.payacts .ghost{margin-top:0}
@media (max-width:360px){ .payfields{grid-template-columns:1fr 1fr} }
.row[data-state="today"] .tick span{border-color:var(--warn); border-width:2px}
.stat.plain{color:var(--muted); font-weight:500}
.stat.skipped{color:var(--muted); font-weight:500}

/* ── cards ──────────────────────────────────────────────────────── */
.nag{
  display:flex; align-items:center; gap:12px; margin:12px 16px 0; padding:12px 13px;
  border-radius:11px; background:var(--warn-soft); border:1px solid var(--warn);
  color:var(--warn);
}
.nag b{display:block; font-size:13px; font-weight:650}
.nag span{display:block; font-size:11.5px; opacity:.85; margin-top:2px}
.nag button{
  flex:none; margin-left:auto; padding:9px 14px; border-radius:8px; min-height:40px;
  background:var(--warn); color:var(--surface); font-size:13px; font-weight:650;
}
.cardlist{display:flex; flex-direction:column; gap:8px; padding:12px 16px 4px}
.cardrow{
  display:block; width:100%; text-align:left; padding:13px 14px 11px;
  background:var(--surface); border:1px solid var(--line); border-radius:13px;
  position:relative; overflow:hidden;
}
.cardrow::before{content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--line)}
.cardrow[data-level="safe"]::before{background:var(--ok)}
.cardrow[data-level="watch"]::before{background:var(--accent)}
.cardrow[data-level="tight"]::before{background:var(--warn)}
.cardrow[data-level="maxed"]::before{background:var(--bad)}
.cardrow[data-shaky="1"]{border-style:dashed}
.cardrow[data-over="1"]{border-color:var(--bad); background:var(--bad-soft)}
.cardrow[data-over="1"] .cardavail{color:var(--bad)}
.cardrow[data-over="1"] .cardavail em{color:var(--bad); opacity:.9}
.cardrow-top{display:flex; align-items:baseline; gap:10px}
.cardname{
  font-size:15px; font-weight:600; letter-spacing:-.005em; min-width:0;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.cardavail{margin-left:auto; flex:none; font-size:19px; font-weight:600; letter-spacing:-.02em}
.cardrow[data-level="maxed"] .cardavail{color:var(--bad)}
.cardrow[data-level="tight"] .cardavail{color:var(--warn)}
.cardrow[data-level="safe"]  .cardavail{color:var(--ok)}
.cardavail em{
  font-style:normal; display:block; text-align:right; font-size:9.5px; font-weight:600;
  letter-spacing:.05em; text-transform:uppercase; color:var(--muted); margin-top:1px;
}
.cardbar{display:block; height:5px; border-radius:99px; background:var(--line-soft);
  overflow:hidden; margin:9px 0 7px}
.cardbar i{display:block; height:100%; background:var(--muted)}
.cardrow[data-level="safe"]  .cardbar i{background:var(--ok)}
.cardrow[data-level="watch"] .cardbar i{background:var(--accent)}
.cardrow[data-level="tight"] .cardbar i{background:var(--warn)}
.cardrow[data-level="maxed"] .cardbar i{background:var(--bad)}
/* owed against held */
.owedbar{background:var(--surface); border-bottom:1px solid var(--line); padding:12px 16px;
  display:flex; flex-direction:column; gap:10px}
.owedrow{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.owedcell{border:1px solid var(--line); border-radius:11px; padding:9px 11px; background:var(--surface-2)}
.owedcell span{display:block; font-size:10px; font-weight:650; letter-spacing:.07em;
  text-transform:uppercase; color:var(--muted)}
.owedcell b{display:block; font-size:19px; font-weight:600; letter-spacing:-.02em; margin-top:2px}
.owedcell.owe b{color:var(--bad)}
.owedcell.have b{color:var(--ok)}

/* collapsible month summary */
.summaryfold{background:var(--surface); border-bottom:1px solid var(--line)}
.summaryfold > summary{display:flex; align-items:center; gap:10px; padding:12px 16px;
  cursor:pointer; list-style:none; min-height:46px}
.summaryfold > summary::-webkit-details-marker{display:none}
.sfsum{font-size:15px; font-weight:600; letter-spacing:-.01em;
  font-variant-numeric:tabular-nums}
.summaryfold[open] > summary{border-bottom:1px solid var(--line-soft)}
.summaryfold .summary{border-bottom:0}

/* collapsible card settings inside the sheet */
.setfold{padding:0; border-bottom:1px solid var(--line-soft)}
.setfold > summary{display:flex; align-items:center; gap:10px; padding:15px 0;
  cursor:pointer; list-style:none; min-height:46px}
.setfold > summary::-webkit-details-marker{display:none}
.setfold .fields{padding-bottom:16px}

/* compact card tiles */
.cardtiles{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:9px; padding:12px 16px 4px}
.cardtiles .cardrow{padding:11px 11px 10px 13px}
.cardtiles .cardname{font-size:13px; display:block; margin-bottom:5px}
.cardtiles .cardavail{margin-left:0; display:block; font-size:17px; text-align:left}
.cardtiles .roomlabel{text-align:left; font-size:9px; margin-top:0}
.cardtiles .cardbar{margin:8px 0 6px}
.cardtiles .cardrow-bot{font-size:10.5px}
.cardtiles .duetag{margin-left:4px; font-size:9px}
@media (max-width:340px){ .cardtiles{grid-template-columns:1fr} }

.roomlabel{display:block; font-size:10px; font-weight:650; letter-spacing:.07em;
  text-transform:uppercase; color:var(--muted); text-align:right; margin-top:-1px}
.cardrow[data-over="1"] .roomlabel{color:var(--bad)}
.cardrow-bot{display:flex; align-items:center; gap:10px; font-size:11.5px; color:var(--muted)}
.chip-level{font-weight:600}
.cardnote{margin-left:auto; text-align:right; white-space:nowrap;
  overflow:hidden; text-overflow:ellipsis}
.cardrow[data-shaky="1"] .cardnote{color:var(--warn); font-weight:600}
.cardacts{display:flex; flex-direction:column; gap:8px; padding:14px 16px 4px}
.planbody{padding:4px 16px 16px; display:flex; flex-direction:column; gap:14px}
.planblock{border:1px solid var(--line); border-radius:12px; padding:12px 13px; background:var(--surface)}
.planhead{display:flex; align-items:baseline; gap:10px; font-size:12px; color:var(--muted);
  margin-bottom:9px}
.planhead b{margin-left:auto; font-size:19px; font-weight:600; color:var(--ink); letter-spacing:-.02em}
.planhead b em, .mini-row .a em{font-style:normal; font-size:10px; font-weight:600; color:var(--muted);
  margin-left:2px}
.utilshift{display:flex; align-items:baseline; gap:8px; margin-bottom:10px;
  padding:9px 11px; border-radius:9px; background:var(--surface-2); border:1px solid var(--line)}
.us-from{font-size:17px; font-weight:600; color:var(--muted); text-decoration:line-through;
  text-decoration-thickness:1px}
.us-arrow{color:var(--muted); font-size:13px}
.us-to{font-size:21px; font-weight:600; color:var(--accent); letter-spacing:-.02em}
.us-to.good{color:var(--ok)}
.us-label{margin-left:auto; font-size:10.5px; color:var(--muted); text-align:right; max-width:96px; line-height:1.25}
.planblock .mini-row .d{color:var(--muted); font-size:11.5px}
.planblock .paydel{height:34px; width:28px}
.kindtag{font-style:normal; font-size:9.5px; font-weight:650; letter-spacing:.05em;
  text-transform:uppercase; color:var(--muted); background:var(--surface-2);
  border:1px solid var(--line); border-radius:4px; padding:1px 4px; margin-left:6px}
.kindtag.warn{color:var(--warn); border-color:var(--warn); background:var(--warn-soft)}
.movelist{margin-top:11px; border-top:1px solid var(--line-soft); padding-top:9px}
.movelist .eyebrow{display:block; margin-bottom:6px}
.moverow{display:flex; align-items:center; gap:9px; padding:7px 0; font-size:13px;
  border-top:1px solid var(--line-soft)}
.moverow:first-of-type{border-top:0}
.moverow .d{flex:none; width:52px; color:var(--muted); font-size:12px}
.mnote{min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--ink-2)}
.moverow .a{margin-left:auto; flex:none; font-weight:600; color:var(--bad)}
.moverow .a.in{color:var(--ok)}
.rowtoggle{display:flex; align-items:center; gap:12px; margin-top:11px; padding:11px 12px;
  border:1px solid var(--line); border-radius:11px; background:var(--surface-2);
  font-size:13.5px; min-height:44px; cursor:pointer}
.rowtoggle span{flex:1}
.rowtoggle input{width:20px; height:20px; accent-color:var(--accent); flex:none}
.linkbtn{color:var(--accent); font-weight:600; font-size:inherit; padding:2px 0;
  text-decoration:underline; text-underline-offset:2px}
.dates{display:grid; grid-template-columns:1fr 1fr; gap:9px}
.datebox{border:1px solid var(--line); border-radius:11px; padding:10px 11px; background:var(--surface-2)}
.datebox span{display:block; font-size:10.5px; font-weight:650; letter-spacing:.07em;
  text-transform:uppercase; color:var(--muted)}
.datebox b{display:block; font-family:var(--f-display); font-size:19px; font-weight:600;
  letter-spacing:-.01em; margin-top:3px}
.datebox i{display:block; font-style:normal; font-size:11.5px; color:var(--muted); margin-top:1px}
.duetag{font-style:normal; font-size:10px; font-weight:650; letter-spacing:.04em;
  padding:1px 5px; border-radius:4px; margin-left:6px; background:var(--surface-2);
  border:1px solid var(--line); color:var(--muted)}
.duetag.soon{background:var(--warn-soft); border-color:var(--warn); color:var(--warn)}
.duetag.ok{background:var(--ok-soft); border-color:var(--ok); color:var(--ok)}
.duetag.sched{background:var(--accent-soft); border-color:var(--accent); color:var(--accent)}
.schednote{font-size:11.5px; color:var(--accent); font-weight:600; margin:-2px 0 4px 26px}
.cardacts .ghost{margin-top:0}

/* ── settled collapser ──────────────────────────────────────────── */
.fold{border-top:1px solid var(--line); margin-top:4px}
.fold summary{
  display:flex; align-items:center; gap:10px; padding:14px 16px;
  cursor:pointer; list-style:none; min-height:48px; background:var(--surface);
  border-bottom:1px solid transparent;
}
.fold summary::-webkit-details-marker{display:none}
.fold[open] summary{border-bottom-color:var(--line)}
.fold summary:hover{background:var(--surface-2)}
.foldsum{margin-left:auto; font-size:12.5px; color:var(--muted);
  font-variant-numeric:tabular-nums}
.chev{
  width:9px; height:9px; flex:none; border-right:1.6px solid var(--muted);
  border-bottom:1.6px solid var(--muted); transform:rotate(45deg) translate(-2px,-2px);
  transition:transform .18s ease;
}
.fold[open] .chev{transform:rotate(-135deg) translate(-2px,-2px)}
.fold .rows{border-top:0}
.fold .tiles{padding-top:12px}
.fold .row{opacity:.72}

.allclear{
  display:flex; flex-direction:column; align-items:center; gap:4px;
  padding:34px 24px 30px; text-align:center;
}
.allclear svg{width:26px; height:26px; fill:none; stroke:var(--ok); stroke-width:2;
  stroke-linecap:round; stroke-linejoin:round; margin-bottom:4px}
.allclear b{font-family:var(--f-display); font-size:16.5px; font-weight:600; color:var(--ink)}
.allclear span{font-size:13px; color:var(--muted)}

.empty{
  text-align:center; padding:52px 28px; color:var(--muted); font-size:14px;
}
.empty b{display:block; color:var(--ink); font-family:var(--f-display);
  font-size:17px; font-weight:600; margin-bottom:5px}
.welcome{display:flex; flex-direction:column; gap:8px; max-width:270px;
  margin:20px auto 0}

/* ── history ────────────────────────────────────────────────────── */
.hist-month{
  display:flex; align-items:baseline; gap:10px; padding:16px 16px 7px;
}
.hist-month h3{
  margin:0; font-family:var(--f-display); font-size:16px; font-weight:600;
  letter-spacing:-.01em;
}
.hist-month .tot{margin-left:auto; font-size:12.5px; color:var(--muted)}
.hrow{
  display:flex; width:100%; align-items:center; gap:12px; text-align:left;
  padding:11px 16px; position:relative;
}
.hrow + .hrow::before{
  content:""; position:absolute; left:16px; right:0; top:0; height:1px; background:var(--line-soft);
}
.hdate{
  flex:none; width:52px; font-size:12px; color:var(--muted); line-height:1.25;
}
.hdate b{display:block; font-size:16px; font-weight:600; color:var(--ink)}
.trend{padding:14px 16px 6px}
.trend .eyebrow{display:block; margin-bottom:8px}
.trendbars{display:flex; align-items:flex-end; gap:4px; height:52px}
.trendbars i{flex:1; min-width:4px; background:var(--accent-soft); border-top:2px solid var(--accent);
  border-radius:2px 2px 0 0; opacity:.6}
.trendbars i:last-child{opacity:1}

.actgroup{margin-bottom:18px}
.acthead{display:flex; align-items:baseline; gap:10px; padding:14px 16px 8px}
.acthead h3{margin:0; font-family:var(--f-display); font-size:17px; font-weight:600; letter-spacing:-.01em}
.acthead .cnt{margin-left:auto; font-size:11px; color:var(--muted); font-family:var(--f-num)}
.acttotals{padding:0 16px 10px; display:flex; flex-direction:column; gap:10px}
.acttotwrap{display:flex; flex-direction:column; gap:5px}
.curtag{font-size:10px; font-weight:650; letter-spacing:.07em; text-transform:uppercase;
  color:var(--muted)}
.acttot{display:flex; gap:8px}
.acttot > div{flex:1; border:1px solid var(--line); border-radius:10px; padding:8px 10px;
  background:var(--surface-2); min-width:0}
.acttot span{display:block; font-size:9.5px; font-weight:650; letter-spacing:.06em;
  text-transform:uppercase; color:var(--muted); white-space:nowrap; overflow:hidden;
  text-overflow:ellipsis}
.acttot b{display:block; font-size:15px; font-weight:600; letter-spacing:-.015em; margin-top:2px}
.acttot b.card{color:var(--accent)}
.acttot b.in{color:var(--ok)}

.hrow.act .a.oncard{color:var(--accent)}
.ktag{font-style:normal; font-size:9px; font-weight:700; letter-spacing:.05em; text-transform:uppercase;
  padding:1px 4px; border-radius:3px; margin-right:6px; border:1px solid var(--line); color:var(--muted)}
.ktag.bill{border-color:var(--muted)}
.ktag.card{border-color:var(--accent); color:var(--accent)}
.ktag.cash{border-color:var(--ok); color:var(--ok)}

.hrow .a{margin-left:auto; flex:none; font-size:14.5px; font-weight:600}
.hrow .a.sk{color:var(--muted); font-weight:500}

/* ── fab ────────────────────────────────────────────────────────── */
.fab{
  position:fixed; z-index:35; right:max(16px,calc(50vw - 264px));
  bottom:calc(20px + env(safe-area-inset-bottom));
  height:50px; padding:0 20px 0 16px; border-radius:99px;
  background:var(--accent); color:var(--accent-ink);
  display:flex; align-items:center; gap:8px; font-size:14.5px; font-weight:600;
  box-shadow:var(--shadow);
}
.fab svg{width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:2.2;
  stroke-linecap:round}

/* ── sheet ──────────────────────────────────────────────────────── */
.scrim{
  position:fixed; inset:0; z-index:40; background:var(--scrim);
  opacity:0; pointer-events:none; transition:opacity .22s ease;
  -webkit-backdrop-filter:blur(2px); backdrop-filter:blur(2px);
}
.scrim.on{opacity:1; pointer-events:auto}
.sheet{
  position:fixed; z-index:41; left:0; right:0; bottom:0; margin:0 auto;
  max-width:560px; max-height:92vh; background:var(--sheet);
  border-radius:18px 18px 0 0; box-shadow:var(--shadow);
  display:flex; flex-direction:column;
  transform:translateY(102%); transition:transform .26s cubic-bezier(.32,.72,0,1);
}
.sheet.on{transform:translateY(0)}
.sheet-head{
  flex:none; padding:8px 12px 12px; border-bottom:1px solid var(--line);
  display:flex; align-items:center; gap:8px;
}
.grab{
  position:absolute; top:7px; left:50%; transform:translateX(-50%);
  width:34px; height:4px; border-radius:99px; background:var(--line);
}
.sheet-title{
  flex:1; min-width:0; font-family:var(--f-display); font-size:17px; font-weight:600;
  padding-top:8px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.sheet-done{
  padding-top:8px; font-size:14.5px; font-weight:650; color:var(--accent);
  padding-inline:8px;
}
.sheet-body{
  overflow-y:auto; -webkit-overflow-scrolling:touch;
  padding:4px 16px calc(26px + env(safe-area-inset-bottom));
}
.sec{padding:16px 0; border-bottom:1px solid var(--line-soft)}
.sec:last-child{border-bottom:0}
.sec > .eyebrow{display:block; margin-bottom:11px}

.seg{
  display:flex; gap:3px; padding:3px; background:var(--surface-2);
  border:1px solid var(--line); border-radius:11px;
}
.seg button{
  flex:1; padding:9px 6px; border-radius:8px; font-size:13.5px; font-weight:600;
  color:var(--muted); display:flex; align-items:center; justify-content:center; gap:6px;
}
.seg button[aria-pressed="true"]{background:var(--surface); color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.09)}
.seg button[aria-pressed="true"][data-v="paid"]{color:var(--ok)}
.seg button[aria-pressed="true"][data-v="skipped"]{color:var(--muted)}
.seg svg{width:15px; height:15px; fill:none; stroke:currentColor; stroke-width:2.2;
  stroke-linecap:round; stroke-linejoin:round}

.fields{display:flex; flex-direction:column; gap:11px; margin-top:12px}
.field{display:flex; flex-direction:column; gap:5px}
.field label{font-size:12px; font-weight:600; color:var(--muted)}
.field input,.field select,.field textarea{
  width:100%; padding:11px 12px; border-radius:10px; background:var(--surface);
  border:1px solid var(--line); font-size:15.5px; -webkit-appearance:none; appearance:none;
}
.field input[type="date"],.field input[type="month"]{min-height:44px}
.field select{
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),
                   linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 17px) 50%, calc(100% - 12px) 50%;
  background-size:5px 5px, 5px 5px; background-repeat:no-repeat; padding-right:34px;
}
.field textarea{resize:vertical; min-height:56px; font-size:14.5px}
.two{display:grid; grid-template-columns:1fr 1fr; gap:11px}
.hint{font-size:11.5px; color:var(--muted); margin-top:-1px}

.spark{display:flex; align-items:flex-end; gap:3px; height:44px; margin:2px 0 8px}
.spark i{
  flex:1; min-width:3px; background:var(--accent-soft); border-radius:2px 2px 0 0;
  border-top:2px solid var(--accent); opacity:.55;
}
.spark i:last-child{opacity:1}
.spark-note{font-size:11.5px; color:var(--muted)}

.mini{display:flex; flex-direction:column}
.mini-row{
  display:flex; align-items:center; gap:10px; padding:9px 0; font-size:13.5px;
  border-top:1px solid var(--line-soft);
}
.mini-row:first-child{border-top:0}
.mini-row .d{color:var(--muted); font-size:12.5px; width:74px; flex:none}
.mini-row .a{margin-left:auto; font-weight:600}
.mini-row .a.sk{color:var(--muted); font-weight:500}

.danger{
  width:100%; margin-top:6px; padding:12px; border-radius:10px;
  border:1px solid var(--line); color:var(--bad); font-size:14px; font-weight:600;
}
.ghost{
  width:100%; padding:12px; border-radius:10px; border:1px solid var(--line);
  font-size:14px; font-weight:600; color:var(--ink-2); background:var(--surface);
}
.ghost + .ghost{margin-top:8px}
.primary{
  width:100%; padding:13px; border-radius:10px; border:1px solid var(--accent);
  background:var(--accent); color:var(--accent-ink); font-size:14.5px; font-weight:650;
}
.primary + .ghost{margin-top:8px}
.bstat{
  display:flex; align-items:center; gap:8px; margin-bottom:11px; padding:9px 11px;
  border-radius:9px; font-size:12.5px; font-weight:550; background:var(--surface-2);
  border:1px solid var(--line);
}
.bstat.dirty{background:var(--warn-soft); border-color:var(--warn); color:var(--warn)}
.bstat.clean{color:var(--ok); border-color:var(--ok); background:var(--ok-soft)}
.howto{margin-top:12px; border-top:1px solid var(--line-soft); padding-top:10px}
.howto summary{
  font-size:12.5px; font-weight:600; color:var(--accent); cursor:pointer; list-style:none;
  padding:3px 0;
}
.howto summary::-webkit-details-marker{display:none}
.howto summary::before{content:"▸ "; display:inline-block; transition:transform .15s}
.howto[open] summary::before{content:"▾ "}
.howto ol{margin:9px 0 0; padding-left:19px; font-size:12.5px; color:var(--muted); line-height:1.6}
.howto p{margin:9px 0 0; font-size:12.5px; color:var(--muted); line-height:1.55}
.howto a{color:var(--accent); font-weight:600; overflow-wrap:anywhere}
.howto code{
  font-family:var(--f-num); font-size:11.5px; background:var(--surface-2);
  padding:1px 4px; border-radius:4px; border:1px solid var(--line);
}

.banner{
  margin:12px 16px 0; padding:11px 13px; border-radius:10px; font-size:12.5px;
  background:var(--warn-soft); color:var(--warn); border:1px solid currentColor;
}
.toast{
  position:fixed; z-index:60; left:50%; bottom:calc(84px + env(safe-area-inset-bottom));
  transform:translate(-50%,14px); background:var(--ink); color:var(--paper);
  padding:10px 16px; border-radius:99px; font-size:13px; font-weight:550;
  opacity:0; pointer-events:none; transition:opacity .2s, transform .2s;
  max-width:88vw; text-align:center;
}
.toast.on{opacity:1; transform:translate(-50%,0)}

/* ══ v2 layer: calmer surfaces, inset cards, bottom dock, quick add ══ */
body{font-size:15px; letter-spacing:-.003em}
.num{font-family:var(--f-num); font-variant-numeric:tabular-nums; letter-spacing:-.015em}
.eyebrow{font-size:12px; font-weight:600; letter-spacing:.02em; text-transform:none; color:var(--muted)}
.shell{padding:0 0 calc(112px + env(safe-area-inset-bottom))}

/* header: a large title that gets out of the way */
.bar{background:var(--paper); border-bottom:0; padding:max(12px,env(safe-area-inset-top)) 16px 0}
.bar-top{min-height:48px; gap:6px}
.brand{font-family:var(--f-display); font-size:30px; font-weight:700; letter-spacing:-.025em}
.icon-btn{border-radius:99px; color:var(--ink-2)}
.icon-btn:hover{background:var(--surface)}
.month-nav{padding:0 0 10px; gap:4px}
.month-nav .icon-btn{width:40px; height:40px; background:var(--surface); box-shadow:var(--card-sh)}
.month-label{font-family:var(--f-display); font-size:17px; font-weight:650; letter-spacing:-.01em;
  padding:4px 0; border-radius:12px}
.month-label small{font-family:var(--f-ui); font-size:11px; font-weight:600; letter-spacing:.02em;
  text-transform:none; color:var(--accent)}
.syncpill{font-size:11.5px; font-weight:600; color:var(--muted); padding:5px 10px; border-radius:99px;
  background:var(--surface); box-shadow:var(--card-sh); white-space:nowrap; margin-right:2px}
.syncpill.warn{color:var(--warn); background:var(--warn-soft)}
.syncpill i{display:inline-block; width:6px; height:6px; border-radius:99px; background:var(--ok);
  margin-right:6px; vertical-align:1px}
.syncpill.warn i{background:var(--warn)}
.syncpill.busy i{background:var(--accent); animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}

/* every block of content is an inset card */
.summaryfold,.summary,.owedbar{border-bottom:0}

.summary{margin:8px 16px; padding:14px 16px; border-radius:var(--r-lg); background:var(--surface); box-shadow:var(--card-sh); gap:14px}
.tot-cur{font-size:12px; font-weight:600; letter-spacing:.01em; text-transform:none}

.meter{height:6px}

.controls{padding:8px 16px 8px 0}

.filters{padding:4px 16px}
.vtog{background:var(--line-soft); border:0; border-radius:11px}

.group{margin:4px 0 16px}
.group-head{padding:8px 20px 8px}
.group-head .rule{opacity:.0}
.group-head .eyebrow{font-weight:650; color:var(--ink-2)}
.group-head .eyebrow em{border-radius:99px; padding:2px 8px; font-weight:650; font-size:11px; letter-spacing:.01em}
.rows{margin:0 16px; border:0; border-radius:var(--r-lg); background:var(--surface); box-shadow:var(--card-sh); overflow:hidden}
.row + .row::before{left:58px}
.tick{width:58px}
.tick span{width:26px; height:26px; border-width:2px}
.body{padding:13px 16px 13px 0}
.name{font-weight:590}
.amt{font-family:var(--f-num); font-size:16px; font-weight:650}
.group[data-gstate="missed"] .row,.group[data-gstate="today"] .row,
.group[data-gstate="scheduled"] .row,.row[data-state="scheduled"],
.group[data-gstate] .row[data-state="partial"],.row[data-state="partial"]{box-shadow:none}
.group[data-gstate="missed"] .rows{box-shadow:var(--card-sh), inset 3px 0 0 var(--bad)}
.group[data-gstate="today"] .rows{box-shadow:var(--card-sh), inset 3px 0 0 var(--warn)}

.fold{margin:6px 16px 0; border:0; border-radius:var(--r-lg); background:var(--surface); box-shadow:var(--card-sh); overflow:hidden}
.fold summary{background:transparent; padding:14px 16px}
.fold .rows{margin:0; box-shadow:none; border-radius:0; border-top:1px solid var(--line-soft)}
.fold .tiles{padding:12px}
.fold .planbody{padding:4px 12px 14px}
.addbill{display:flex; align-items:center; justify-content:center; gap:8px; margin:14px 16px 0;
  width:calc(100% - 32px); padding:13px; border-radius:var(--r-md); border:1.5px dashed var(--line);
  color:var(--muted); font-weight:600; font-size:14px}
.addbill svg{width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:2.2; stroke-linecap:round}

.tile,.cardrow,.planblock,.owedcell,.datebox,.paystate,.acttot > div,.rowtoggle,.utilshift{
  border:0; box-shadow:var(--card-sh)}
.tile{border-radius:var(--r-md)}

.cardrow{border-radius:var(--r-lg); padding:15px 16px 13px}
.cardrow::before{display:none}
.cardrow[data-shaky="1"]{border:0; box-shadow:var(--card-sh), inset 0 0 0 1.5px var(--line)}
.cardrow[data-over="1"]{box-shadow:var(--card-sh), inset 0 0 0 1.5px var(--bad)}
.cardavail{font-size:21px; font-weight:700}
.cardbar{height:6px}
.roomlabel{text-transform:none; letter-spacing:.01em; font-weight:600; font-size:11px}
.owedbar{margin:4px 16px 8px; padding:0; background:none}
.owedcell{background:var(--surface); border-radius:var(--r-lg); padding:12px 14px}
.owedcell span{text-transform:none; letter-spacing:.01em; font-size:12px; font-weight:600}

.datebox,.paystate,.rowtoggle,.utilshift{background:var(--surface-2); box-shadow:none}
.datebox span,.owedcell span,.acttot span,.curtag{text-transform:none; letter-spacing:.01em}
.datebox b{font-family:var(--f-display)}
.duetag{border:0; border-radius:99px; padding:2px 7px}
.kindtag{border:0; border-radius:99px; padding:1px 6px}

.acthead h3,.hist-month h3,.allclear b,.empty b,.sheet-title{font-family:var(--f-display); font-weight:700}
.actgroup{margin:0 0 18px}
.actgroup .rows{margin:0 16px}
.acttot > div{background:var(--surface); border-radius:var(--r-md)}

.cattag{font-style:normal; font-size:10.5px; font-weight:650; color:var(--ink-2); background:var(--surface-2);

.catbars{margin:0 16px 10px; padding:12px 14px; border-radius:var(--r-md); background:var(--surface); box-shadow:var(--card-sh);

.catbar span{color:var(--ink-2); font-weight:560; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}

.primary,.ghost,.danger{border-radius:var(--r-md); min-height:48px}

.danger{border:0; background:var(--bad-soft)}

.seg{background:var(--line-soft); border:0; border-radius:12px}
.seg button{border-radius:9px; min-height:38px}
.bstat{border:0}
.toast{bottom:calc(104px + env(safe-area-inset-bottom)); border-radius:14px; padding:11px 16px;
  font-weight:600; box-shadow:var(--shadow)}

/* bottom dock */
.fab{display:none}
.dock{position:fixed; z-index:35; left:50%; transform:translateX(-50%);
  bottom:calc(10px + env(safe-area-inset-bottom)); width:min(528px, calc(100% - 24px));
  display:grid; grid-template-columns:1fr 1fr 76px 1fr 1fr; align-items:center;
  padding:6px; border-radius:26px; background:var(--dock); box-shadow:var(--shadow);
  -webkit-backdrop-filter:saturate(1.6) blur(18px); backdrop-filter:saturate(1.6) blur(18px)}
.dock-tab{position:relative; display:flex; flex-direction:column; align-items:center; gap:2px;

  stroke-linecap:round; stroke-linejoin:round}
.dock-tab[aria-current="page"]{color:var(--accent)}
.dock-tab.unsaved::after{content:""; position:absolute; top:6px; right:calc(50% - 16px); width:8px; height:8px;
  border-radius:99px; background:var(--warn); border:2px solid var(--surface)}
.dock-add{justify-self:center; width:60px; height:60px; margin-top:-22px; border-radius:22px;

/* quick add */

.qa-card{flex:none; scroll-snap-align:start; min-width:132px; max-width:168px; text-align:left;

.qa-card span{font-size:11.5px; color:var(--muted); font-family:var(--f-num)}
.qa-card[aria-pressed="true"]{border-color:var(--accent); background:var(--accent-soft)}
.qa-card[aria-pressed="true"] b{color:var(--accent)}
.qa-wrap{display:flex; flex-wrap:wrap; gap:7px}
.qa-chip{padding:9px 13px; border-radius:99px; background:var(--surface-2); font-size:13.5px; font-weight:580;
  color:var(--ink-2); min-height:38px; border:1.5px solid transparent}
.qa-chip[aria-pressed="true"]{background:var(--ink); color:var(--paper)}
.qa-chip.sm{padding:6px 11px; min-height:32px; font-size:12.5px; font-weight:550}

/* entries waiting for a card */

  background:var(--surface-2); color:var(--ink); font-size:13.5px; font-weight:620; text-align:left}

/* iPhone shortcut setup */

<script>
(() => {
"use strict";

/* ── constants ──────────────────────────────────────────────────── */
const KEY = "billLedger.v1";
const FREQ = {
  monthly:   {label:"Monthly",     step:1},
  quarterly: {label:"Quarterly",   step:3},
  half:      {label:"Half-yearly", step:6},
  yearly:    {label:"Yearly",      step:12},
  once:      {label:"One-time",    step:0}
};
const MONTHS = ["January","February","March","April","May","June",
                "July","August","September","October","November","December"];
const MON3 = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

/* ── seed ───────────────────────────────────────────────────────── */
function seed(){
  const sources = [
    {id:"checking", name:"Checking",    color:"#1D6FA8"},
    {id:"card",     name:"Credit card", color:"#5B54C4"},
    {id:"savings",  name:"Savings",     color:"#0F8A8A"}
  ];
  // [name, amount, currency, source, dueDay, freq, anchorY, anchorM, endYear, note, archived]
  const rows = [];   // the public build ships empty
  const bills = rows.map((r,i) => ({
    id:"b"+(i+1), name:r[0], amount:r[1], currency:r[2], sourceId:r[3],
    dueDay:r[4], freq:r[5], anchorY:r[6], anchorM:r[7], endYear:r[8],
    note:r[9], archived:!!r[10]
  }));
  const d0 = new Date();
  return {
    version:1, sources, bills, payments:[], theme:null, viewMode:"list", lastBackup:null,
    updatedAt: 0,          // a fresh seed must never win a sync race
    pristine: true,
    cards:[], spends:[], statements:[], loans:[], accounts:[],
    sync:{on:false, owner:"", repo:"", path:"bill-ledger.json", sha:null, at:null, err:null},
    // months before this are "not tracked yet", not overdue
    startPeriod: d0.getFullYear() + "-" + String(d0.getMonth()+1).padStart(2,"0")
  };
}

/* ── storage ────────────────────────────────────────────────────── */
let storageOK = true;
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){ storageOK = false; }
  return seed();
}
function saveLocal(){
  if(!storageOK) return;
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }
  catch(e){ storageOK = false; renderWarn(); }
}
/** Local write + a debounced push to GitHub when sync is switched on. */
function save(){
  S.updatedAt = Date.now();
  S.pristine = false;        // this ledger has been used
  saveLocal();
  scheduleSync();
}
/** Nothing has ever been entered here. Such a state must never overwrite a
 *  remote that has data — this is exactly how a cleared browser wiped a
 *  synced ledger. */
function isPristine(){
  return !!S.pristine || !(
    (S.bills || []).length || (S.cards || []).length || (S.payments || []).length ||
    (S.loans || []).length || (S.accounts || []).length || (S.spends || []).length
  );
}

const S = load();
if(!S.sources || !S.bills) Object.assign(S, seed());
if(!S.payments) S.payments = [];
if(!S.viewMode) S.viewMode = "list";
for(const k of ["cards","spends","statements","loans","accounts"])
  if(!Array.isArray(S[k])) S[k] = [];
// a sheet hijacked mid-edit could strand a nameless draft card; sweep them
if(S.cards.some(c => !String(c.name || "").trim()))
  S.cards = S.cards.filter(c => String(c.name || "").trim());

/* ── view state ─────────────────────────────────────────────────── */
const now = new Date();
const UI = {
  view:"ledger",
  y:now.getFullYear(), m:now.getMonth(),
  cur:"all", src:"all",
  billId:null, draft:false
};

/* ── helpers ────────────────────────────────────────────────────── */
const $  = s => document.querySelector(s);
const uid = () => "x" + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const pad = n => String(n).padStart(2,"0");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const periodKey = (y,m) => y + "-" + pad(m+1);
const daysIn    = (y,m) => new Date(y, m+1, 0).getDate();
const dueDate   = (b,y,m) => new Date(y, m, Math.min(b.dueDay, daysIn(y,m)));
const iso       = d => d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate());
const todayISO  = iso(new Date());

const fmtUSD = new Intl.NumberFormat("en-US",{style:"currency",currency:"USD"});
const fmtINR = new Intl.NumberFormat("en-IN",{style:"currency",currency:"INR",maximumFractionDigits:0});
const money  = (n, cur) => (cur === "INR" ? fmtINR : fmtUSD).format(n || 0);

function srcOf(id){ return S.sources.find(s => s.id === id) || {name:"—", color:"var(--muted)"}; }
function billOf(id){ return S.bills.find(b => b.id === id); }

function isDue(b, y, m){
  const f = FREQ[b.freq] || FREQ.monthly;
  if(b.freq === "once") return b.anchorY === y && b.anchorM === m;
  const diff = (y - b.anchorY) * 12 + (m - b.anchorM);
  if(diff < 0) return false;
  if(b.endYear && y > b.endYear) return false;
  return diff % f.step === 0;
}
/** Every payment recorded against one bill in one month, oldest first. */
function paysFor(billId, pk){
  return S.payments
    .filter(p => p.billId === billId && p.period === pk)
    .sort((a,b) => (a.date || "").localeCompare(b.date || ""));
}
function payFor(billId, pk){ return paysFor(billId, pk)[0]; }

/** Where a bill stands this month once part-payments are added up.
 *  `final` marks a payment as closing the month out — a bill can be settled
 *  for less than its usual amount, and a bill with no set amount can only be
 *  closed this way. Records written before part-payments existed have no
 *  `final` field and are treated as closing, so old data reads unchanged. */
/** A payment dated ahead of today is arranged but has not left the account
 *  yet, so it must not reduce any balance — it just stops the bill reading
 *  as overdue. Once the date arrives it counts on its own. */
const isScheduled = p => (p.date || "") > todayISO;

function progressOf(b, pk){
  const pays = paysFor(b.id, pk);
  if(!pays.length) return {none:true, paid:0, scheduled:0, target:b.amount || 0, left:b.amount || 0, n:0};
  if(pays.some(p => p.status === "skipped"))
    return {skipped:true, paid:0, scheduled:0, target:b.amount || 0, left:0, n:pays.length};

  const settled = pays.filter(p => !isScheduled(p));
  const ahead   = pays.filter(isScheduled);
  const paid      = settled.reduce((t,p) => t + (p.amount || 0), 0);
  const scheduled = ahead.reduce((t,p) => t + (p.amount || 0), 0);
  const target = b.amount || 0;
  const closed = settled.some(p => p.final !== false);
  const done   = closed || (target > 0 && paid >= target - 0.005);
  const covered = !done && target > 0 && paid + scheduled >= target - 0.005;
  return {
    paid, scheduled, target, n:pays.length, nAhead:ahead.length, closed, done, covered,
    nextDate: ahead.length ? ahead.map(p => p.date).sort()[0] : null,
    left: done ? 0 : Math.max(0, target - paid),
    partial: !done && paid > 0
  };
}
function billsFor(y, m){
  return S.bills
    .filter(b => !b.archived && isDue(b, y, m))
    .filter(b => UI.cur === "all" || b.currency === UI.cur)
    .filter(b => UI.src === "all" || b.sourceId === UI.src)
    .sort((a,b) => a.dueDay - b.dueDay || a.name.localeCompare(b.name));
}
/** due | soon | today | missed | partial | paid | skipped */
function stateOf(b, y, m){
  const pk = periodKey(y,m);
  const g = progressOf(b, pk);
  if(g.skipped) return "skipped";
  if(g.done)    return "paid";
  if(g.covered) return "scheduled";    // arranged ahead — not overdue
  if(g.partial) return "partial";      // part-paid still counts as outstanding
  if(g.scheduled > 0) return "scheduled";
  if(S.startPeriod && pk < S.startPeriod) return "due";  // before you started tracking
  const d = dueDate(b, y, m);
  const t = new Date(); t.setHours(0,0,0,0);
  const days = Math.round((d - t) / 86400000);
  if(days < 0) return "missed";
  if(days === 0) return "today";
  if(days <= 4) return "soon";
  return "due";
}
function toast(msg, ms){
  const t = $("#toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(toast._h); toast._h = setTimeout(() => t.classList.remove("on"), ms || 2000);
}

/* ── backup freshness ───────────────────────────────────────────── */
function signature(){
  const s = JSON.stringify({b:S.bills, p:S.payments, r:S.sources});
  let h = 5381;
  for(let i = 0; i < s.length; i++) h = ((h * 33) ^ s.charCodeAt(i)) >>> 0;
  return h.toString(36) + "." + s.length.toString(36);
}
function isDirty(){ return !S.lastBackup || S.lastBackup.sig !== signature(); }
function sinceBackup(){
  if(!S.lastBackup) return "never backed up";
  const ms = Date.now() - new Date(S.lastBackup.at).getTime();
  const mins = Math.round(ms / 60000);
  if(mins < 1)  return "backed up just now";
  if(mins < 60) return "backed up " + mins + " min ago";
  const hrs = Math.round(mins / 60);
  if(hrs < 24)  return "backed up " + hrs + " hour" + (hrs===1?"":"s") + " ago";
  const days = Math.round(hrs / 24);
  return "backed up " + days + " day" + (days===1?"":"s") + " ago";
}
let nudged = false;
function maybeNudge(){
  if(nudged || !isDirty()) return;
  const changes = S.payments.length;
  const stale = S.lastBackup
    ? (Date.now() - new Date(S.lastBackup.at).getTime()) > 7 * 864e5
    : changes >= 5;
  if(!stale) return;
  nudged = true;
  toast("Unsaved changes — tap More to back up", 4200);
}

/* ── credit cards ───────────────────────────────────────────────────
   A statement is the most reliable balance and the least current one:
   it reports the closing balance on the cut date, not today's. So a card
   carries two numbers and always labels which is which — a confirmed
   balance with its date, and an estimate for right now built from it.  */
const cardOf = id => S.cards.find(c => c.id === id);
const daysBetween = (a, b) => Math.floor((b - a) / 86400000);

/** Was this payment made after the balance was last confirmed?
 *  Timestamps when we have them, so a payment and a confirmation on the same
 *  day still order correctly; date comparison only as a fallback for records
 *  written before confirmedTs existed. */
function afterConfirm(holder, p){
  if(!holder.confirmedAt) return true;
  if(holder.confirmedTs && p.loggedAt){
    const t = Date.parse(p.loggedAt);
    if(Number.isFinite(t)) return t > holder.confirmedTs;
  }
  return (p.date || "") > holder.confirmedAt;
}
/** Movements logged by hand since the balance was last confirmed. A
 *  confirmation used to delete them, which also wiped them from Activity;
 *  now it marks them settled, so history keeps what you spent and on what. */
const cardSpends = cardId => S.spends.filter(s => s.cardId === cardId && !s.settled);
const acctMoves  = acctId => S.spends.filter(s => s.accountId === acctId && !s.settled);
const settleMoves = pred => S.spends.forEach(x => { if(pred(x)) x.settled = true; });
/** Stamp a confirmation so later movements can be ordered against it. */
function markConfirmed(holder, balance){
  holder.balance = balance;
  holder.confirmedAt = todayISO;
  holder.confirmedTs = Date.now();
}

/** Interest since the balance was confirmed. Simple apr/12 pro-rated by
 *  days — it ignores grace periods and cash-advance rates, so it is only
 *  ever shown as an estimate. */
function accrued(card, days){
  if(!card.apr || days <= 0) return 0;
  return (card.balance || 0) * (card.apr / 100 / 365) * days;
}

/** Everything the UI needs about one card, derived not stored. */
function cardState(c){
  const t = new Date(); t.setHours(0,0,0,0);
  const conf = c.confirmedAt ? new Date(c.confirmedAt + "T00:00:00") : null;
  const age  = conf ? Math.max(0, daysBetween(conf, t)) : null;

  // Spends are wiped when a balance is confirmed, so anything still here was
  // logged afterwards. No date filter: comparing dates dropped a spend made on
  // the same day it was confirmed, which silently did nothing.
  const spent = cardSpends(c.id).reduce((n,s) => n + (s.amount || 0), 0);
  const repaid = c.billId
    ? S.payments.filter(p => p.billId === c.billId && p.status === "paid" &&
                             !isScheduled(p) && afterConfirm(c, p))
                .reduce((n,p) => n + (p.amount || 0), 0)
    : 0;

  const interest = accrued(c, age || 0);
  const estimate = Math.max(0, (c.balance || 0) + interest + spent - repaid);
  const limit    = c.limit || 0;
  const avail    = limit ? limit - estimate : null;
  const util     = limit ? estimate / limit : null;

  // How much the figure can be trusted is a question of how old it is.
  // statementDay is only a hint about *when* refreshing pays off most: the
  // day after a statement cuts, the card app shows a freshly settled figure.
  const fresh = age == null ? "never" : age <= 3 ? "fresh" : age <= 7 ? "aging" : "stale";
  let justCut = false;
  if(c.statementDay && age != null){
    const cut = new Date(t.getFullYear(), t.getMonth(),
                         Math.min(c.statementDay, daysIn(t.getFullYear(), t.getMonth())));
    if(cut <= t){
      const sinceCut = daysBetween(cut, t);
      justCut = sinceCut <= 3 && (conf == null || conf < cut);   // cut, not yet re-read
    }
  }
  const unknown = !c.confirmedAt || !limit;
  const needsUpdate = unknown || fresh === "stale" || justCut;
  const level = util == null ? "none"
              : util >= 1    ? "maxed"
              : util >= 0.8  ? "tight"
              : util >= 0.3  ? "watch" : "safe";
  return {
    limit, estimate, avail, util, level, age, interest, spent, repaid,
    confirmed: c.balance || 0, fresh, justCut, needsUpdate, unknown,
    // stop presenting a figure as solid once it has drifted out of date
    shaky: unknown || fresh === "stale" || fresh === "never",
    moved: spent > 0 || repaid > 0 || interest >= 1
  };
}
/** Give a card its place in the monthly list, creating the bill if needed. */
function ensureCardBill(c){
  const existing = cardBill(c);
  if(existing) return existing;
  if(!c.name.trim()) return null;
  // an archived bill from a previous unlink comes back rather than duplicating
  const prior = c.billId ? S.bills.find(b => b.id === c.billId) : null;
  if(prior){ prior.archived = false; return prior; }
  const dueDay = c.dueDay || c.statementDay || 1;
  const bill = {
    id:uid(), name:c.name, amount:c.minPayment || 0, currency:c.currency,
    sourceId:(S.sources[0] || {}).id || "", dueDay,
    freq:"monthly", anchorY:UI.y, anchorM:UI.m, endYear:null, note:"", archived:false
  };
  S.bills.push(bill); c.billId = bill.id;
  return bill;
}

/** A linked card and bill are one thing to you, so they show one name —
 *  the card's. Existing spellings on the bill are left alone in storage and
 *  only normalised when you actually edit the name. */
function displayName(c){ return (c.name || "").trim() || "Untitled card"; }
function billDisplayName(b){
  const c = S.cards.find(x => x.billId === b.id && !x.archived);
  return c ? displayName(c) : b.name;
}

/** The bill a card is paid through, when there is one. */
const cardBill = c => c.billId ? S.bills.find(b => b.id === c.billId && !b.archived) : null;

/** Next occurrence of a day-of-month, clamped for short months. */
function nextOnDay(day){
  if(!day) return null;
  const t = new Date(); t.setHours(0,0,0,0);
  const mk = (y,m) => new Date(y, m, Math.min(day, daysIn(y, m)));
  let d = mk(t.getFullYear(), t.getMonth());
  if(d < t) d = mk(t.getMonth() === 11 ? t.getFullYear()+1 : t.getFullYear(), (t.getMonth()+1) % 12);
  return d;
}
/** Dates a card runs on: when the statement cuts, when payment is due. */
function cardDates(c){
  const t = new Date(); t.setHours(0,0,0,0);
  const bill = cardBill(c);
  const dueDay = c.dueDay || (bill ? bill.dueDay : 0);
  const stmt = nextOnDay(c.statementDay);
  const due  = nextOnDay(dueDay);
  return {
    dueDay, bill,
    statement: stmt, due,
    statementIn: stmt ? daysBetween(t, stmt) : null,
    dueIn: due ? daysBetween(t, due) : null
  };
}
/** Where a loan's payment for the month being viewed stands. */
function loanMonth(l){
  const bill = l.billId ? S.bills.find(b => b.id === l.billId && !b.archived) : null;
  if(!bill) return null;
  const pk = periodKey(UI.y, UI.m);
  return {bill, pk, state: stateOf(bill, UI.y, UI.m), progress: progressOf(bill, pk)};
}

/** Where the card's payment for the month being viewed stands. */
function cardMonth(c){
  const bill = cardBill(c);
  if(!bill) return null;
  const pk = periodKey(UI.y, UI.m);
  return {bill, pk, state: stateOf(bill, UI.y, UI.m), progress: progressOf(bill, pk)};
}

function activeCards(){ return S.cards.filter(c => !c.archived); }
/** Which card can I actually use — most available credit first.
 *  Only ever compares within a currency: ₹194,352 is not more room than
 *  $8,501, and sorting them against each other would say it was. */
function cardsByAvailable(list){
  return (list || activeCards()).slice().sort((a,b) => {
    const A = cardState(a).avail, B = cardState(b).avail;
    if(A == null && B == null) return a.name.localeCompare(b.name);
    if(A == null) return 1;
    if(B == null) return -1;
    return B - A;
  });
}
/** Cards grouped by currency, each group sorted by available credit. */
function cardGroups(){
  const cards = activeCards();
  return ["USD","INR"]
    .map(cur => [cur, cardsByAvailable(cards.filter(c => c.currency === cur))])
    .filter(([,list]) => list.length);
}

/* ── sanitising the trust boundary ──────────────────────────────────
   Anything arriving from an imported file or the synced repo is treated
   as untrusted: every field is coerced to its expected type and shape
   before it can reach the DOM. Escaping on output is the second layer;
   this is the first.                                                   */
const S_FREQ = Object.keys(FREQ);
// strip control characters only — spaces, hyphens and ₹ must survive
const sStr  = (v, max) => String(v == null ? "" : v)
  .replace(/[\u0000-\u001F\u007F]/g, "").slice(0, max);
const sNum  = (v, d) => { const n = Number(v); return Number.isFinite(n) ? n : d; };
const sInt  = (v, lo, hi, d) => Math.min(hi, Math.max(lo, Math.round(sNum(v, d))));
const sId   = v => String(v == null ? "" : v).replace(/[^A-Za-z0-9_-]/g, "").slice(0, 40);
const sHex  = v => /^#[0-9a-fA-F]{6}$/.test(String(v)) ? String(v) : "#5C6670";
const sDate = v => /^\d{4}-\d{2}-\d{2}$/.test(String(v)) ? String(v) : todayISO;
const sPeriod = v => /^\d{4}-\d{2}$/.test(String(v)) ? String(v)
                   : periodKey(new Date().getFullYear(), new Date().getMonth());

function sanitize(d){
  if(!d || typeof d !== "object") throw new Error("shape");
  let sources = (Array.isArray(d.sources) ? d.sources : []).slice(0, 60)
    .map(s => ({id:sId(s && s.id), name:sStr(s && s.name, 40) || "Account", color:sHex(s && s.color), accountId:sId(s && s.accountId)}))
    .filter(s => s.id);
  if(!sources.length) sources = [{id:"account", name:"Account", color:"#5C6670"}];
  const srcIds = new Set(sources.map(s => s.id));
  const fallbackSrc = sources[0].id;

  const bills = (Array.isArray(d.bills) ? d.bills : []).slice(0, 600).map(b => b && {
    id:       sId(b.id),
    name:     sStr(b.name, 80),
    amount:   Math.max(0, sNum(b.amount, 0)),
    currency: b.currency === "INR" ? "INR" : "USD",
    sourceId: srcIds.has(sId(b.sourceId)) ? sId(b.sourceId) : fallbackSrc,
    dueDay:   sInt(b.dueDay, 1, 31, 1),
    freq:     S_FREQ.includes(b.freq) ? b.freq : "monthly",
    anchorY:  sInt(b.anchorY, 1970, 2999, 2026),
    anchorM:  sInt(b.anchorM, 0, 11, 0),
    endYear:  b.endYear == null || b.endYear === "" ? null : sInt(b.endYear, 1970, 2999, 2999),
    note:     sStr(b.note, 120),
    archived: !!b.archived
  }).filter(b => b && b.id);
  const billIds = new Set(bills.map(b => b.id));

  const payments = (Array.isArray(d.payments) ? d.payments : []).slice(0, 40000)
    .filter(p => p && billIds.has(sId(p.billId)))
    .map(p => ({
      id:       sId(p.id) || uid(),
      billId:   sId(p.billId),
      period:   sPeriod(p.period),
      status:   p.status === "skipped" ? "skipped" : "paid",
      date:     sDate(p.date),
      amount:   Math.max(0, sNum(p.amount, 0)),
      sourceId: srcIds.has(sId(p.sourceId)) ? sId(p.sourceId) : fallbackSrc,
      note:     sStr(p.note, 120),
      final:    p.final !== false,        // absent => closes the month (old data)
      loggedAt: sStr(p.loggedAt, 40),
      updatedAt:sStr(p.updatedAt, 40)
    }));

  const billIdSet = billIds;
  const cards = (Array.isArray(d.cards) ? d.cards : []).slice(0, 200).map(c => c && {
    id:       sId(c.id),
    name:     sStr(c.name, 60),
    issuer:   sStr(c.issuer, 40),
    currency: c.currency === "INR" ? "INR" : "USD",
    billId:   billIdSet.has(sId(c.billId)) ? sId(c.billId) : "",
    limit:    Math.max(0, sNum(c.limit, 0)),
    apr:      Math.min(100, Math.max(0, sNum(c.apr, 0))),
    statementDay: sInt(c.statementDay, 0, 31, 0),
    dueDay:       sInt(c.dueDay, 0, 31, 0),
    balance:  Math.max(0, sNum(c.balance, 0)),
    confirmedAt:   c.confirmedAt ? sDate(c.confirmedAt) : "",
    confirmedTs:   sNum(c.confirmedTs, 0) || 0,
    confirmedFrom: c.confirmedFrom === "statement" ? "statement" : "manual",
    minPayment: Math.max(0, sNum(c.minPayment, 0)),
    dueDate:  c.dueDate ? sDate(c.dueDate) : "",
    archived: !!c.archived
  }).filter(c => c && c.id);
  const cardIds = new Set(cards.map(c => c.id));

  const acctIdsEarly = new Set((Array.isArray(d.accounts) ? d.accounts : [])
    .map(a => sId(a && a.id)).filter(Boolean));
  const spends = (Array.isArray(d.spends) ? d.spends : []).slice(0, 20000)
    .filter(x => x && (cardIds.has(sId(x.cardId)) || acctIdsEarly.has(sId(x.accountId))))
    .map(x => ({id:sId(x.id) || uid(),
                cardId: cardIds.has(sId(x.cardId)) ? sId(x.cardId) : "",
                accountId: acctIdsEarly.has(sId(x.accountId)) ? sId(x.accountId) : "",
                dir: x.dir === "in" ? "in" : "out",
                date:sDate(x.date), loggedAt:sStr(x.loggedAt, 40),
                amount:Math.max(0, sNum(x.amount, 0)), note:sStr(x.note, 120),
                cat:sStr(x.cat, 24), settled:!!x.settled, gap:!!x.gap,
                src:x.src === "applepay" || x.src === "shortcut" ? x.src : ""}));

  const statements = (Array.isArray(d.statements) ? d.statements : []).slice(0, 5000)
    .filter(x => x && cardIds.has(sId(x.cardId)))
    .map(x => ({
      id:sId(x.id) || uid(), cardId:sId(x.cardId), period:sPeriod(x.period),
      statementDate: x.statementDate ? sDate(x.statementDate) : "",
      closingBalance:Math.max(0, sNum(x.closingBalance, 0)),
      limit:Math.max(0, sNum(x.limit, 0)),
      available:sNum(x.available, 0),
      minPayment:Math.max(0, sNum(x.minPayment, 0)),
      dueDate: x.dueDate ? sDate(x.dueDate) : "",
      apr:Math.min(100, Math.max(0, sNum(x.apr, 0))),
      importedAt:sStr(x.importedAt, 40),
      source:x.source === "pdf" ? "pdf" : "manual"
    }));

  const loans = (Array.isArray(d.loans) ? d.loans : []).slice(0, 100).map(l => l && {
    id:sId(l.id), name:sStr(l.name, 60), lender:sStr(l.lender, 60),
    currency:l.currency === "INR" ? "INR" : "USD",
    balance:Math.max(0, sNum(l.balance, 0)),
    apr:Math.min(100, Math.max(0, sNum(l.apr, 0))),
    minPayment:Math.max(0, sNum(l.minPayment, 0)),
    confirmedAt:l.confirmedAt ? sDate(l.confirmedAt) : "",
    confirmedTs:sNum(l.confirmedTs, 0) || 0,
    billId: billIdSet.has(sId(l.billId)) ? sId(l.billId) : "",
    archived: !!l.archived
  }).filter(l => l && l.id);

  const accounts = (Array.isArray(d.accounts) ? d.accounts : []).slice(0, 200).map(a => a && {
    id:sId(a.id), bank:sStr(a.bank, 40), name:sStr(a.name, 40),
    type:sStr(a.type, 24), currency:a.currency === "INR" ? "INR" : "USD",
    balance:sNum(a.balance, 0),
    confirmedAt:a.confirmedAt ? sDate(a.confirmedAt) : "",
    confirmedTs:sNum(a.confirmedTs, 0) || 0
  }).filter(a => a && a.id);

  const cardAlias = {};
  if(d.cardAlias && typeof d.cardAlias === "object")
    for(const [k, v] of Object.entries(d.cardAlias).slice(0, 200))
      if(cardIds.has(sId(v))) cardAlias[sStr(k, 60).toLowerCase()] = sId(v);
  return {
    version:1, sources, bills, payments, cardAlias,
    cards, spends, statements, loans, accounts,
    theme:      d.theme === "dark" || d.theme === "light" ? d.theme : null,
    viewMode:   d.viewMode === "tiles" ? "tiles" : "list",
    startPeriod:sPeriod(d.startPeriod),
    updatedAt:  sNum(d.updatedAt, Date.now()),
    pristine:   false,
    exportedAt: sStr(d.exportedAt, 40)
  };
}

/* ── icons ──────────────────────────────────────────────────────── */
const ACT_I = {
  spend:'<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',

/* ── render: summary ────────────────────────────────────────────── */
function summaryHTML(list){
  const pk = periodKey(UI.y, UI.m);
  const groups = {};
  for(const b of list){
    const g = groups[b.currency] || (groups[b.currency] = {total:0,left:0,paid:0,skip:0,part:0,sched:0,n:0,src:{}});
    const pr = progressOf(b, pk);
    g.n++;
    if(pr.skipped){ g.skip++; continue; }
    if(pr.done){ g.paid++; g.total += pr.paid; continue; }
    if(pr.covered){ g.sched++; g.total += pr.paid + pr.scheduled; continue; }
    // outstanding: only what is still owed counts toward "still to pay"
    if(pr.partial) g.part++;
    g.total += Math.max(pr.target, pr.paid);
    g.left  += pr.left;
    if(pr.left > 0) g.src[b.sourceId] = (g.src[b.sourceId] || 0) + pr.left;
  }
  const order = ["USD","INR"].filter(c => groups[c]);
  if(!order.length) return "";

  // One line per currency. The figure you actually came for is the outstanding
  // total; everything else is secondary and sized that way. Per-source amounts
  // sit behind a fold so they cost no vertical space until asked for.
  const rows = order.map(cur => {
    const g = groups[cur];
    const donePct = g.n ? (g.paid / g.n) * 100 : 0;
    const skipPct = g.n ? (g.skip / g.n) * 100 : 0;
    const open = g.n - g.paid - g.skip;
    return '<div class="tot-row">' +
      '<div class="tot-head">' +
        '<span class="tot-cur">' + (cur === "INR" ? "India" : "US") + '</span>' +
        '<span class="tot-amt num">' + money(g.left, cur) + '</span></div>' +
      '<div class="meter"><i style="width:' + donePct + '%"></i>' +
        '<i class="skip" style="width:' + skipPct + '%"></i></div>' +
      '<div class="tot-sub">' + (open
        ? open + ' left &middot; ' + g.paid + ' of ' + g.n + ' cleared' +
          (g.part ? ' &middot; ' + g.part + ' part-paid' : '') +
          (g.sched ? ' &middot; ' + g.sched + ' arranged' : '')
        : 'all ' + g.n + ' settled') + '</div>' +
    '</div>';
  }).join("");

  const allSrc = {};
  for(const cur of order)
    for(const [sid, amt] of Object.entries(groups[cur].src))
      (allSrc[cur] || (allSrc[cur] = [])).push([sid, amt]);
  const chips = order.flatMap(cur =>
    (allSrc[cur] || []).sort((a,b) => b[1] - a[1]).map(([sid, amt]) => {
      const s = srcOf(sid);
      return '<span class="src-tot"><i class="dot" style="background:' + esc(s.color) + '"></i>' +
             esc(s.name) + ' <b>' + money(amt, cur) + '</b></span>';
    })).join("");

  return '<details class="summaryfold" data-fold="sum"' + (S.sumOpen === false ? '' : ' open') + '>' +
    '<summary><span class="sfsum">' + order.map(cur => {
      const g = groups[cur];
      return money(g.left, cur);
    }).join(' &middot; ') + ' left</span><span class="chev" aria-hidden="true"></span></summary>' +
    '<div class="summary">' + rows +
    (chips
      ? '<details class="srcfold"' + (S.srcOpen ? ' open' : '') + ' data-fold="src">' +
          '<summary><span>What comes out of each account</span>' +
          '<span class="chev" aria-hidden="true"></span></summary>' +
          '<div class="by-src">' + chips + '</div></details>'
      : '') +
  '</div></details>';
}

      money(g.paid, b.currency) + ' paid · ' + g.n + '×</span>';
    if(st === "scheduled"){ amt = g.scheduled;
      stat = '<span class="tile-stat" style="color:var(--accent)">Paying ' + shortDate(g.nextDate) + '</span>'; }
    if(st === "skipped") stat = '<span class="tile-stat" style="color:var(--muted)">Skipped</span>';
    if(st === "missed")  stat = '<span class="tile-stat" style="color:var(--bad)">Overdue ' + MON3[UI.m] + ' ' + day + '</span>';

        '<span class="tile-top"><i class="dot" style="background:' + esc(s.color) + '"></i>' +
          '<span class="tile-src">' + esc(s.name) + '</span></span>' +
        '<span class="tile-name">' + esc(billDisplayName(b)) + '</span>' +
        '<span class="tile-amt num">' + (amt ? money(amt, b.currency) : "—") + '</span>' +

/* ── render: ledger ─────────────────────────────────────────────── */
function ledgerHTML(){
  if(!S.bills.some(b => !b.archived)){
    return '<div class="empty"><b>Your ledger is empty</b>' +
      'Restore a backup from iCloud Drive, or start adding bills one at a time.' +
      '<div class="welcome">' +
        '<button class="primary" data-act="restore">Restore from a file</button>' +
        '<button class="ghost" data-act="add">Add your first bill</button>' +
      '</div></div>';
  }
  const list = billsFor(UI.y, UI.m);
  let out = summaryHTML(list) + filtersHTML();
  if(!list.length){
    return out + '<div class="empty"><b>Nothing due</b>No bills fall in ' +
      MONTHS[UI.m] + ' ' + UI.y + ' with these filters.</div>' + ADD_BILL_BTN;
  }
  const pk = periodKey(UI.y, UI.m);
  // Settled bills are done with — they belong out of the way, not padding
  // out a list you have to scroll past to find what still needs paying.
  const open = [], settled = [];
  for(const b of list){
    const st = stateOf(b, UI.y, UI.m);
    (st === "paid" || st === "skipped" ? settled : open).push(b);
  }

  if(S.viewMode === "tiles"){
    if(open.length) out += tilesHTML(open);
    else out += allClearHTML(settled.length);
    if(settled.length) out += foldHTML(settled, tilesHTML(settled));
    return out + ADD_BILL_BTN;
  }

  const byDay = new Map();
  for(const b of open){
    const d = Math.min(b.dueDay, daysIn(UI.y, UI.m));
    if(!byDay.has(d)) byDay.set(d, []);
    byDay.get(d).push(b);
  }
  for(const [day, items] of [...byDay.entries()].sort((a,b) => a[0]-b[0])){
    // The whole group shares one due date, so its state belongs on the header
    // once rather than repeated down every row.
    // a group is only overdue if something in it is actually unpaid
    const gs = items.every(x => stateOf(x, UI.y, UI.m) === "scheduled")
      ? "scheduled" : stateOf(items[0], UI.y, UI.m);
    const label = gs === "missed" ? "overdue" : gs === "today" ? "due today"
                : gs === "soon"  ? "due soon" : gs === "scheduled" ? "arranged" : "";
    out += '<section class="group" data-gstate="' + gs + '"><div class="group-head">' +
      '<span class="eyebrow">' + MON3[UI.m] + ' ' + day +
        (label ? '<em>' + label + '</em>' : '') + '</span>' +
      '<span class="rule"></span><span class="cnt">' + items.length + '</span></div><div class="rows">' +
      items.map(b => rowHTML(b, pk)).join("") + '</div></section>';
  }

  if(!open.length) out += allClearHTML(settled.length);
  if(settled.length)
    out += foldHTML(settled, '<div class="rows">' + settled.map(b => rowHTML(b, pk)).join("") + '</div>');
  return out + ADD_BILL_BTN;
}
