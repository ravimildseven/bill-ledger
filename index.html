/* ── mutations ──────────────────────────────────────────────────── */
/** Today if we're looking at the live month, otherwise that month's due date. */
function defaultDate(b, pk){
  const [y,m] = pk.split("-").map(Number);
  return (y === now.getFullYear() && (m-1) === now.getMonth())
    ? todayISO : iso(dueDate(b, y, m-1));
}
function clearPeriod(billId, pk){
  S.payments = S.payments.filter(p => !(p.billId === billId && p.period === pk));
}
/** Record one payment. `final` closes the month; false leaves it outstanding. */
function addPayment(billId, pk, {amount, date, sourceId, note, final} = {}){
  const b = billOf(billId);
  const stamp = new Date().toISOString();
  const p = {
    id:uid(), billId, period:pk, status:"paid",
    date: date || defaultDate(b, pk),
    amount: amount == null ? (b.amount || 0) : amount,
    sourceId: sourceId || b.sourceId, note: note || "",
    final: final !== false,
    loggedAt:stamp, updatedAt:stamp
  };
  S.payments.push(p);
  save();
  return p;
}
const tomorrowISO = () => { const d = new Date(); d.setDate(d.getDate() + 1); return iso(d); };

/** Arrange a payment for a future date without pretending it has happened.
 *  Defaults to tomorrow so one tap gets a bill out of overdue; the date can
 *  then be moved with the picker. */
function arrangePayment(bill, pk, amount){
  const amt = amount == null ? (progressOf(bill, pk).left || bill.amount || 0) : amount;
  return addPayment(bill.id, pk, {
    amount: amt, date: tomorrowISO(),
    final: !(bill.amount > 0 && amt < bill.amount - 0.005)
  });
}

/** Close the month out at whatever has been paid so far. */
function closePeriod(billId, pk){
  const pays = paysFor(billId, pk);
  if(!pays.length) return addPayment(billId, pk, {final:true});
  pays[pays.length - 1].final = true;
  pays[pays.length - 1].updatedAt = new Date().toISOString();
  save();
}
function setStatus(billId, pk, status){
  const b = billOf(billId);
  if(status === null){ clearPeriod(billId, pk); save(); return; }
  if(status === "paid"){
    const g = progressOf(b, pk);
    // part-paid already: settle at what's been paid rather than double-charging
    if(g.partial) return closePeriod(billId, pk);
    clearPeriod(billId, pk);
    return addPayment(billId, pk, {final:true});
  }
  clearPeriod(billId, pk);
  S.payments.push({
    id:uid(), billId, period:pk, status:"skipped",
    date: defaultDate(b, pk), amount:0, sourceId:b.sourceId, note:"",
    final:true, loggedAt:new Date().toISOString(), updatedAt:new Date().toISOString()
  });
  save();
}

/* ── calendar reminders ─────────────────────────────────────────────
   One recurring all-day event per bill, with an alarm. iOS Calendar then
   does the reminding — no service worker, no push server, and it rides
   iCloud to every device on its own.                                   */
const icsEsc = s => String(s == null ? "" : s)
  .replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\r?\n/g, "\\n");
/** RFC 5545 caps lines at 75 octets; continuations start with one space. */
function icsFold(line){
  const bytes = new TextEncoder().encode(line);
  if(bytes.length <= 73) return line;
  const out = [];
  let cur = "";
  for(const ch of line){                       // iterate code points, never split one
    if(new TextEncoder().encode(cur + ch).length > 72){ out.push(cur); cur = " " + ch; }
    else cur += ch;
  }
  if(cur) out.push(cur);
  return out.join("\r\n");
}
function icsRule(b){
  const d = b.dueDay;
  if(b.freq === "once")      return null;
  if(b.freq === "yearly")    return "FREQ=YEARLY;BYMONTH=" + (b.anchorM + 1) + ";BYMONTHDAY=" + d;
  const step = {monthly:1, quarterly:3, half:6}[b.freq] || 1;
  return "FREQ=MONTHLY" + (step > 1 ? ";INTERVAL=" + step : "") + ";BYMONTHDAY=" + d;
}
function buildICS(daysBefore){
  const now = new Date();
  const stamp = now.toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, "");
  // alarm fires at 09:00 local, `daysBefore` days ahead of the all-day start
  const offsetH = daysBefore * 24 - 9;
  const trigger = offsetH === 0 ? "PT0S" : (offsetH > 0 ? "-PT" + offsetH + "H" : "PT" + (-offsetH) + "H");

  const L = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Bill Ledger//EN",
             "CALSCALE:GREGORIAN", "METHOD:PUBLISH",
             "X-WR-CALNAME:Bill Ledger", "X-WR-TIMEZONE:" + (Intl.DateTimeFormat().resolvedOptions().timeZone || "UTC")];

  const bills = S.bills.filter(b => !b.archived);
  for(const b of bills){
    const first = dueDate(b, b.anchorY, b.anchorM);
    const dt = first.getFullYear() + pad(first.getMonth() + 1) + pad(first.getDate());
    const next = new Date(first); next.setDate(next.getDate() + 1);
    const dtEnd = next.getFullYear() + pad(next.getMonth() + 1) + pad(next.getDate());
    const src = srcOf(b.sourceId).name;
    const amt = b.amount ? money(b.amount, b.currency) : "amount varies";
    const rule = icsRule(b);
    // RFC 5545: DTSTART is a DATE value here, so UNTIL must be a DATE too —
    // a date-time UNTIL against a DATE start is rejected by strict parsers.
    const until = b.endYear ? ";UNTIL=" + b.endYear + "1231" : "";

    L.push("BEGIN:VEVENT");
    L.push("UID:bill-" + b.id + "@bill-ledger");
    L.push("DTSTAMP:" + stamp);
    L.push("DTSTART;VALUE=DATE:" + dt);
    L.push("DTEND;VALUE=DATE:" + dtEnd);
    if(rule) L.push("RRULE:" + rule + until);
    L.push(icsFold("SUMMARY:" + icsEsc(b.name + " — " + amt)));
    L.push(icsFold("DESCRIPTION:" + icsEsc(
      "Pay from " + src + "." + (b.note ? " " + b.note : "") +
      "\n" + FREQ[b.freq].label + " · added by Bill Ledger")));
    L.push("TRANSP:TRANSPARENT");
    L.push("BEGIN:VALARM");
    L.push("ACTION:DISPLAY");
    L.push(icsFold("DESCRIPTION:" + icsEsc(b.name + " — " + amt + " from " + src)));
    L.push("TRIGGER;RELATED=START:" + trigger);
    L.push("END:VALARM");
    L.push("END:VEVENT");
  }
  L.push("END:VCALENDAR");
  return {text: L.join("\r\n") + "\r\n", count: bills.length};
}
async function doCalendar(){
  const sel = $("#remWhen");
  const daysBefore = sel ? parseInt(sel.value, 10) : 1;
  const {text, count} = buildICS(daysBefore);
  if(!count) return toast("No bills to remind you about yet");
  const name = "bill-ledger-reminders.ics";
  const file = new File([text], name, {type:"text/calendar"});
  try{
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:"Bill Ledger reminders"});
      return toast("Choose Calendar to add " + count + " reminders", 3600);
    }
  }catch(err){
    if(err && err.name === "AbortError") return;
  }
  try{
    const url = URL.createObjectURL(new Blob([text], {type:"text/calendar"}));
    const a = document.createElement("a");
    a.href = url; a.download = name; a.rel = "noopener";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    toast(count + " reminders saved — open the file to add them", 3600);
  }catch(e){ toast("Could not create the calendar file here"); }
}

/* ── GitHub sync ────────────────────────────────────────────────────
   Writes the ledger back to one file in a PRIVATE repo on every change.
   The token is held under its own key, never inside S, so it can never
   end up inside an exported or synced backup.                          */
const TOKEN_KEY = "billLedger.token";
const getToken = () => { try{ return localStorage.getItem(TOKEN_KEY) || ""; }catch(e){ return ""; } };
const setToken = t => {
  try{ t ? localStorage.setItem(TOKEN_KEY, t) : localStorage.removeItem(TOKEN_KEY); }catch(e){}
};

function b64enc(str){
  const bytes = new TextEncoder().encode(str);
  let bin = "";
  for(let i = 0; i < bytes.length; i += 0x8000)
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
const b64dec = b =>
  new TextDecoder().decode(Uint8Array.from(atob(String(b).replace(/\s/g, "")), c => c.charCodeAt(0)));

function syncCfg(){
  return S.sync || (S.sync = {on:false, owner:"", repo:"", path:"bill-ledger.json",
                              sha:null, at:null, err:null});
}
const syncReady = () => {
  const c = syncCfg();
  return !!(c.on && c.owner && c.repo && getToken());
};
/** What actually gets written — no sync config, no token, ever. */
function payload(){
  const {sync, ...rest} = S;
  return JSON.stringify({...rest, exportedAt:new Date().toISOString()}, null, 2);
}
function ghErr(status){
  if(status === 401) return "Token rejected — it may have expired";
  if(status === 403) return "Token lacks Contents write access to that repo";
  if(status === 404) return "Repo or file path not found — check owner/repo";
  if(status === 409) return "The file changed on GitHub — tap Sync now";
  if(status === 422) return "GitHub rejected the update";
  return "GitHub error " + status;
}
async function ghReq(method, body){
  const c = syncCfg();
  const url = "https://api.github.com/repos/" + encodeURIComponent(c.owner) + "/" +
              encodeURIComponent(c.repo) + "/contents/" +
              c.path.split("/").map(encodeURIComponent).join("/");
  const headers = {
    "Authorization": "Bearer " + getToken(),
    "Accept": "application/vnd.github+json",
    "X-GitHub-Api-Version": "2022-11-28"
  };
  if(body) headers["Content-Type"] = "application/json";
  try{
    return await fetch(url, {method, headers, body: body ? JSON.stringify(body) : undefined});
  }catch(e){
    throw new Error(navigator.onLine === false
      ? "Offline — changes are saved here and will sync later"
      : "Can't reach GitHub from this page");
  }
}
async function syncPull(){
  const res = await ghReq("GET");
  if(res.status === 404) return {empty:true};
  if(!res.ok) throw new Error(ghErr(res.status));
  const j = await res.json();
  syncCfg().sha = j.sha;
  return {data: JSON.parse(b64dec(j.content))};
}
async function syncPush(){
  const c = syncCfg();
  const body = {
    message: "Ledger update — " + new Date().toISOString().slice(0, 16).replace("T", " "),
    content: b64enc(payload())
  };
  if(c.sha) body.sha = c.sha;
  let res = await ghReq("PUT", body);
  if(res.status === 409 || res.status === 422){
    const cur = await ghReq("GET");                 // stale sha — re-read, retry once
    if(cur.ok){ body.sha = c.sha = (await cur.json()).sha; res = await ghReq("PUT", body); }
  }
  if(!res.ok) throw new Error(ghErr(res.status));
  const j = await res.json();
  c.sha = j.content.sha;
  c.at  = new Date().toISOString();
  c.err = null;
  S.lastBackup = {at:c.at, sig:signature()};
}
/** After the data underneath changes, drop filters that no longer resolve —
    otherwise the month reads "Nothing due" for no visible reason. */
function resetStaleFilters(){
  if(UI.src !== "all" && !S.sources.some(s => s.id === UI.src)) UI.src = "all";
  if(UI.cur !== "all" && !S.bills.some(b => b.currency === UI.cur)) UI.cur = "all";
}

function adopt(d){
  const c = sanitize(d);              // remote data is untrusted
  Object.assign(S, {
    version:1,
    sources: c.sources, bills: c.bills, payments: c.payments,
    cards: c.cards, spends: c.spends, statements: c.statements,
    loans: c.loans, accounts: c.accounts,
    startPeriod: c.startPeriod, viewMode: c.viewMode,
    theme: c.theme, updatedAt: c.updatedAt
  });
  resetStaleFilters();
  applyTheme();
}

let syncTimer = null, syncing = false;
function scheduleSync(){
  if(!syncReady()) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(() => runSync(true), 2500);
}
async function runSync(quiet){
  if(syncing || !syncReady()) return;
  syncing = true; render();
  try{ await syncPush(); }
  catch(e){ syncCfg().err = e.message; if(!quiet) toast(e.message, 3600); }
  syncing = false;
  saveLocal(); render();
  // only refresh the data sheet if that is genuinely what is on screen —
  // a background sync must never replace a sheet the user is working in
  if(UI.sheet === "data" && $("#sheet").classList.contains("on")) openData();
}
/** On open: whichever side is newer wins. */
async function syncBoot(){
  if(!syncReady()) return;
  syncing = true; render();
  try{
    const r = await syncPull();
    if(r.empty){ await syncPush(); }
    else{
      const remoteAt = r.data.updatedAt || 0, localAt = S.updatedAt || 0;
      if(remoteAt > localAt){
        adopt(r.data);
        S.lastBackup = {at:new Date().toISOString(), sig:signature()};
      }else if(localAt > remoteAt){
        await syncPush();
      }else{
        S.lastBackup = {at:new Date().toISOString(), sig:signature()};
      }
    }
    syncCfg().err = null;
  }catch(e){ syncCfg().err = e.message; }
  syncing = false;
  saveLocal(); render();
}

/* ── sheet ──────────────────────────────────────────────────────── */
function openSheet(billId, period){
  UI.sheet = "bill";
  UI.billId = billId;
  UI.sheetPeriod = period || periodKey(UI.y, UI.m);
  renderSheet();
  $("#scrim").classList.add("on");
  $("#sheet").classList.add("on");
}
function closeSheet(){
  if(UI.loanDraft){
    const l = loanOf(UI.loanId);
    if(l && !l.name.trim() && !l.balance) S.loans = S.loans.filter(x => x.id !== l.id), save();
    UI.loanDraft = false;
  }
  if(UI.acctDraft){
    const a = S.accounts.find(x => x.id === UI.acctId);
    if(a && !a.name.trim() && !a.bank.trim() && !a.balance)
      S.accounts = S.accounts.filter(x => x.id !== a.id), save();
    UI.acctDraft = false;
  }
  if(UI.cardDraft){
    const c = cardOf(UI.cardId);
    if(c && !c.name.trim()){ S.cards = S.cards.filter(x => x.id !== c.id); save(); }
    UI.cardDraft = false;
  }
  if(UI.draft){
    const b = billOf(UI.billId);
    if(b && !b.name.trim()){
      S.bills.splice(S.bills.indexOf(b), 1);
      S.payments = S.payments.filter(p => p.billId !== b.id);
      save();
    }
    UI.draft = false;
  }
  $("#scrim").classList.remove("on");
  $("#sheet").classList.remove("on");
  UI.billId = null; UI.cardId = null; UI.acctId = null; UI.loanId = null; UI.sheet = null;
  render();
}

function renderSheet(){
  const b = billOf(UI.billId);
  if(!b) return closeSheet();
  const pk = UI.sheetPeriod;
  const [py, pm] = pk.split("-").map(Number);
  const ownerCard = S.cards.find(x => x.billId === b.id && !x.archived);
  const gp = progressOf(b, pk);
  const paysThis = paysFor(b.id, pk).filter(x => x.status === "paid");
  const due = dueDate(b, py, pm-1);

  $("#sheetTitle").textContent = b.name || "New bill";

  const srcOptions = S.sources.map(s =>
    '<option value="' + esc(s.id) + '"' + (s.id === b.sourceId ? " selected" : "") + '>' +
    esc(s.name) + '</option>').join("");
  const srcOptionsBill = S.sources.map(s =>
    '<option value="' + esc(s.id) + '"' + (s.id === b.sourceId ? " selected" : "") + '>' + esc(s.name) + '</option>').join("");
  const freqOptions = Object.entries(FREQ).map(([k,v]) =>
    '<option value="' + k + '"' + (k === b.freq ? " selected" : "") + '>' + v.label + '</option>').join("");
  const dayOptions = Array.from({length:31}, (_,i) =>
    '<option value="' + (i+1) + '"' + (i+1 === b.dueDay ? " selected" : "") + '>' + (i+1) + '</option>').join("");

  /* per-bill history + sparkline */
  const hist = S.payments.filter(x => x.billId === b.id)
    .sort((a,c) => c.period.localeCompare(a.period));
  const byPeriod = new Map();
  for(const x of hist){
    if(x.status !== "paid") continue;
    byPeriod.set(x.period, (byPeriod.get(x.period) || 0) + (x.amount || 0));
  }
  const paid = [...byPeriod.entries()].filter(([,v]) => v > 0)
    .sort((a,c) => a[0].localeCompare(c[0])).slice(-12)
    .map(([period, amount]) => ({period, amount}));
  const max = Math.max(1, ...paid.map(x => x.amount));
  const spark = paid.length >= 2
    ? '<div class="spark">' + paid.map(x =>
        '<i style="height:' + Math.max(8, (x.amount / max) * 100) + '%" title="' +
        esc(x.period) + ' · ' + money(x.amount, b.currency) + '"></i>').join("") + '</div>' +
      '<div class="spark-note">Last ' + paid.length + ' payments · high ' + money(max, b.currency) + '</div>'
    : "";
  const histRows = hist.length
    ? '<div class="mini">' + hist.slice(0,24).map(x => {
        const s = srcOf(x.sourceId);
        return '<div class="mini-row"><span class="d num">' + shortDate(x.date) + " '" + esc(x.date.slice(2,4)) +
          '</span><i class="dot" style="background:' + esc(s.color) + '"></i><span>' + esc(s.name) + '</span>' +
          '<span class="a num ' + (x.status === "paid" ? "" : "sk") + '">' +
          (x.status === "paid" ? money(x.amount, b.currency) : "skipped") + '</span></div>';
      }).join("") + '</div>'
    : '<div class="hint">No payments recorded yet.</div>';

  $("#sheetBody").innerHTML =
    /* ── this period ── */
    '<div class="sec">' +
      '<span class="eyebrow">' + MONTHS[pm-1] + ' ' + py + ' &middot; due ' + MON3[pm-1] + ' ' + due.getDate() + '</span>' +
      (gp.skipped
        ? '<div class="bstat clean"><i class="dot" style="background:var(--muted)"></i>' +
          '<span>Skipped this month</span></div>'
        : '<div class="paystate ' + (gp.done ? "done" : (gp.partial || gp.scheduled) ? "part" : "open") + '">' +
            '<div class="paystate-top">' +
              '<span>' + (gp.done ? "Settled"
                          : gp.scheduled > 0 ? "Arranged for " + shortDate(gp.nextDate)
                          : gp.partial ? "Still owed" : "To pay") + '</span>' +
              '<b class="num">' + money(gp.done ? gp.paid : gp.scheduled > 0 ? gp.scheduled : gp.left, b.currency) + '</b></div>' +
            (gp.target ? '<span class="pbar big"><i style="width:' +
              Math.min(100, gp.target ? (gp.paid / gp.target) * 100 : 0).toFixed(1) + '%"></i></span>' : '') +
            '<div class="paystate-sub">' +
              (gp.scheduled > 0 && !gp.paid
                ? 'Nothing deducted until ' + shortDate(gp.nextDate) + ' — change the date below to move it'
                : gp.n
                ? money(gp.paid, b.currency) + ' paid over ' + gp.n + ' payment' +
                  (gp.n === 1 ? '' : 's') +
                  (gp.target ? ' of ' + money(gp.target, b.currency) : '') +
                  (gp.scheduled > 0 ? ' · ' + money(gp.scheduled, b.currency) + ' arranged' : '')
                : 'Nothing recorded yet' + (gp.target ? ' · ' + money(gp.target, b.currency) + ' expected' : '')) +
            '</div></div>') +

      // every payment this month, each editable and removable
      (paysThis.length
        ? '<div class="paylist">' + paysThis.map((x, i) =>
            '<div class="payrow" data-pay="' + esc(x.id) + '">' +
              '<span class="payn num">' + (i+1) + '</span>' +
              '<div class="payfields">' +
                '<input type="date" data-pf="date" value="' + esc(x.date) + '" aria-label="Date of payment ' + (i+1) + '">' +
                '<input type="number" inputmode="decimal" step="0.01" data-pf="amount" value="' +
                  (x.amount || 0) + '" aria-label="Amount of payment ' + (i+1) + '">' +
                '<select data-pf="sourceId" aria-label="Source of payment ' + (i+1) + '">' +
                  S.sources.map(s => '<option value="' + esc(s.id) + '"' +
                    (s.id === x.sourceId ? " selected" : "") + '>' + esc(s.name) + '</option>').join("") +
                '</select>' +
              '</div>' +
              '<button class="paydel" data-delpay="' + esc(x.id) + '" aria-label="Remove payment ' + (i+1) + '">' +

      '<div class="payacts">' +
        '<button class="ghost" id="addPay">' + (gp.n ? "Add another payment" : "Record a payment") + '</button>' +

        (gp.done
          ? '<button class="ghost" id="reopenPay">Reopen this month</button>'
          : '<button class="ghost" id="settlePay">' +
              (gp.partial ? "Settle at " + money(gp.paid, b.currency) : "Mark fully paid") + '</button>') +
        (gp.skipped
          ? '<button class="ghost" id="unskipPay">Undo skip</button>'
          : '<button class="ghost" id="skipPay">Nothing owed this month</button>') +
      '</div>' +
      '<div class="hint" style="margin-top:9px">Part-payments keep the bill in the outstanding list until the total is reached, or until you settle it.</div>' +
    '</div>' +

    /* ── bill settings ── */
    '<div class="sec"><span class="eyebrow">Bill settings</span>' +
      '<div class="fields">' +

          '<input type="text" id="bName" placeholder="e.g. Apple Card" value="' + esc(b.name) + '"></div>' +
        (ownerCard
          ? '<div class="hint">Shown everywhere as &ldquo;' + esc(displayName(ownerCard)) +

            esc(ownerCard.id) + '">Open the card</button></div>'
          : '') +

          '<div class="field"><label for="bAmt">Usual amount</label>' +
            '<input type="number" inputmode="decimal" step="0.01" id="bAmt" value="' + (b.amount || 0) + '"></div>' +
          '<div class="field"><label for="bCur">Currency</label><select id="bCur">' +
            '<option value="USD"' + (b.currency==="USD"?" selected":"") + '>US $</option>' +
            '<option value="INR"' + (b.currency==="INR"?" selected":"") + '>India ₹</option>' +
          '</select></div>' +
        '</div>' +
        '<div class="field"><label for="bSrc">Default source</label>' +
          '<select id="bSrc">' + srcOptionsBill + '</select></div>' +
        '<div class="two">' +

          '<div class="field"><label for="bFreq">Repeats</label><select id="bFreq">' + freqOptions + '</select></div>' +
        '</div>' +
        (b.freq === "monthly" ? "" :
        '<div class="two">' +
          '<div class="field"><label for="bAnchor">First due</label>' +
            '<input type="month" id="bAnchor" value="' + esc(b.anchorY + '-' + pad(b.anchorM+1)) + '"></div>' +

            '<input type="number" inputmode="numeric" id="bEnd" placeholder="never" value="' + (b.endYear || "") + '"></div>' +
        '</div>' +

          MON3[b.anchorM] + ' ' + b.anchorY + (b.endYear ? ' through ' + b.endYear : '') + '</div>') +
        '<div class="field"><label for="bNote">Note</label>' +
          '<input type="text" id="bNote" placeholder="optional" value="' + esc(b.note) + '"></div>' +
      '</div>' +
    '</div>' +

    /* ── history ── */
    '<div class="sec"><span class="eyebrow">Payment history</span>' + spark + histRows + '</div>' +

    /* ── actions ── */
    '<div class="sec">' +
      '<button class="ghost" id="archBtn">' + (b.archived ? "Restore this bill" : "Archive (hide from months)") + '</button>' +
      '<button class="danger" id="delBtn">Delete bill and its history</button>' +
    '</div>';

  wireSheet(b, pk);

function wireSheet(b, pk){
  const body = $("#sheetBody");
  const reflow = () => { renderSheet(); render(); };
  const patch  = () => { save(); render(); };

  const on = (id, ev, fn) => { const el = body.querySelector(id); if(el) el[ev] = fn; };

  // one row per payment: edit in place, no re-render so focus is never stolen
  body.querySelectorAll(".payrow").forEach(row => {
    const rec = S.payments.find(x => x.id === row.dataset.pay);
    if(!rec) return;
    row.querySelectorAll("[data-pf]").forEach(inp => {
      inp.onchange = e => {
        const f = inp.dataset.pf;
        if(f === "amount") rec.amount = Math.max(0, parseFloat(e.target.value) || 0);
        else if(f === "date") rec.date = e.target.value || rec.date;
        else rec[f] = e.target.value;
        rec.updatedAt = new Date().toISOString();
        save();
        renderSheet();   // totals above the list have to follow the edit
        render();
      };
    });
  });
  body.querySelectorAll("[data-delpay]").forEach(btn => btn.onclick = () => {
    const id = btn.dataset.delpay;
    S.payments = S.payments.filter(x => x.id !== id);
    save(); reflow();
  });

  on("#addPay", "onclick", () => {
    const g = progressOf(b, pk);
    // suggest whatever is still owed, so the common case is one tap
    addPayment(b.id, pk, {amount: g.left > 0 ? g.left : 0, final:false});
    reflow();
  });
  on("#arrangePay", "onclick", () => {
    arrangePayment(b, pk);
    reflow();
    toast("Arranged for tomorrow — change the date below", 3800);
  });
  on("#settlePay", "onclick", () => { setStatus(b.id, pk, "paid"); reflow(); });
  on("#reopenPay", "onclick", () => {
    paysFor(b.id, pk).forEach(x => { x.final = false; x.updatedAt = new Date().toISOString(); });
    save(); reflow();
  });
  on("#skipPay",   "onclick", () => { setStatus(b.id, pk, "skipped"); reflow(); });
  on("#unskipPay", "onclick", () => { setStatus(b.id, pk, null); reflow(); });

  on("#bName","onchange", e => { b.name = e.target.value.trim(); $("#sheetTitle").textContent = b.name || "New bill"; UI.draft = false; patch(); });
  on("#bAmt", "onchange", e => { b.amount = parseFloat(e.target.value) || 0; patch(); });
  on("#bCur", "onchange", e => { b.currency = e.target.value; patch(); });
  on("#bSrc", "onchange", e => { b.sourceId = e.target.value; patch(); });
  on("#bDay", "onchange", e => { b.dueDay = parseInt(e.target.value,10) || 1; patch(); });
  on("#bNote","onchange", e => { b.note = e.target.value.trim(); patch(); });
  on("#bFreq","onchange", e => {
    b.freq = e.target.value;
    if(b.freq !== "monthly" && b.anchorM === 0 && b.anchorY === 2026){
      b.anchorY = UI.y; b.anchorM = UI.m;   // anchor to the month being viewed
    }
    reflow();
  });
  on("#bAnchor","onchange", e => {
    const [y,m] = (e.target.value || "").split("-").map(Number);
    if(y && m){ b.anchorY = y; b.anchorM = m-1; }
    reflow();
  });
  on("#bEnd","onchange", e => {
    const v = parseInt(e.target.value,10);
    b.endYear = v && v > 1900 ? v : null; reflow();
  });

  on("#archBtn","onclick", () => { b.archived = !b.archived; save(); toast(b.archived ? "Archived" : "Restored"); closeSheet(); });
  on("#delBtn","onclick", () => {
    if(!confirm('Delete "' + (b.name || "this bill") + '" and all ' +
       S.payments.filter(x => x.billId === b.id).length + ' recorded payments?')) return;
    S.bills.splice(S.bills.indexOf(b), 1);
    S.payments = S.payments.filter(x => x.billId !== b.id);
    UI.draft = false; save(); toast("Deleted"); closeSheet();
  });
}

/* ── loans ──────────────────────────────────────────────────────────
   A loan has a balance and an APR but no credit limit, so it stays out
   of anything about utilisation or room to spend. It very much belongs
   in what the debt costs to carry — a personal loan is often the most
   expensive thing on the list.                                        */
const activeLoans = () => S.loans.filter(l => !l.archived);
const loanOf = id => S.loans.find(l => l.id === id);

function loanState(l){
  const t = new Date(); t.setHours(0,0,0,0);
  const conf = l.confirmedAt ? new Date(l.confirmedAt + "T00:00:00") : null;
  const age  = conf ? Math.max(0, daysBetween(conf, t)) : null;
  const repaid = l.billId
    ? S.payments.filter(p => p.billId === l.billId && p.status === "paid" &&
                             !isScheduled(p) && afterConfirm(l, p))
                .reduce((n,p) => n + (p.amount || 0), 0)
    : 0;
  const interest = (l.apr && age) ? (l.balance || 0) * (l.apr / 100 / 365) * age : 0;
  const estimate = Math.max(0, (l.balance || 0) + interest - repaid);
  const fresh = age == null ? "never" : age <= 31 ? "fresh" : age <= 62 ? "aging" : "stale";
  return {
    estimate, interest, repaid, age, fresh,
    confirmed: l.balance || 0,
    monthly: (estimate * (l.apr || 0) / 100) / 12,
    shaky: !l.confirmedAt || fresh === "stale",
    moved: repaid > 0 || interest >= 1
  };
}

/* ── cash on hand ───────────────────────────────────────────────────
   Not net worth — just what is actually available to pay cards with.
   Same confirmed-plus-movements model as a card: the balance you last
   read from the bank, then everything recorded since.                 */
const acctOf = id => S.accounts.find(a => a.id === id);

function accountState(a){
  const t = new Date(); t.setHours(0,0,0,0);
  const conf = a.confirmedAt ? new Date(a.confirmedAt + "T00:00:00") : null;
  const age  = conf ? Math.max(0, daysBetween(conf, t)) : null;

  const moves = acctMoves(a.id);
  const out = moves.filter(m => m.dir !== "in").reduce((n,m) => n + (m.amount || 0), 0);
  const inn = moves.filter(m => m.dir === "in").reduce((n,m) => n + (m.amount || 0), 0);

  // bills paid from a source that draws on this account
  const srcIds = S.sources.filter(s => s.accountId === a.id).map(s => s.id);
  const paidOut = srcIds.length
    ? S.payments.filter(p => p.status === "paid" && srcIds.includes(p.sourceId) &&
                             !isScheduled(p) && afterConfirm(a, p))
                .reduce((n,p) => n + (p.amount || 0), 0)
    : 0;

  const estimate = (a.balance || 0) - out + inn - paidOut;
  return {
    confirmed:a.balance || 0, estimate, out, inn, paidOut, age,
    linkedSources: srcIds.length,
    moved: out > 0 || inn > 0 || paidOut > 0,
    shaky: !a.confirmedAt || (age != null && age > 7)
  };
}
/** What is actually spendable now, after everything recorded since the read. */
function cashFor(cur){
  return S.accounts.filter(a => a.currency === cur)
                   .reduce((n,a) => n + accountState(a).estimate, 0);
}
function cashAge(cur){
  const list = S.accounts.filter(a => a.currency === cur && a.confirmedAt);
  if(!list.length) return null;
  const t = new Date(); t.setHours(0,0,0,0);
  return Math.max(...list.map(a => daysBetween(new Date(a.confirmedAt + "T00:00:00"), t)));
}

/* ── utilisation coaching ───────────────────────────────────────────
   Arithmetic, not advice: given an amount you are willing to put on the
   cards, work out the split that buys the most utilisation improvement,
   and say what it does to the number. Thresholds first (over-limit, then
   80%, then 30% overall), because those are where the damage sits.     */
const UTIL_GOOD = 0.30, UTIL_TIGHT = 0.80;

function coachPlan(cur, budget, mode){
  mode = mode || S.payMode || "score";
  const rows = activeCards()
    .filter(c => c.currency === cur && c.limit > 0)
    .map(c => { const s = cardState(c); return {c, bal:s.estimate, limit:s.limit, util:s.util, apr:c.apr || 0}; });
  if(!rows.length) return null;

  const limitSum = rows.reduce((n,r) => n + r.limit, 0);
  const startBal = rows.reduce((n,r) => n + r.bal, 0);
  const startMax = rows.reduce((n,r) => Math.max(n, r.limit ? r.bal / r.limit : 0), 0);
  const pay = new Map();
  let cash = Math.max(0, budget);

  const put = (r, amt) => {
    amt = Math.min(amt, cash, r.bal);
    if(amt <= 0.5) return;
    pay.set(r.c.id, (pay.get(r.c.id) || 0) + amt);
    r.bal -= amt; cash -= amt;
  };
  // 1. anything over its limit — the only state that gets a card declined
  rows.filter(r => r.bal > r.limit).sort((a,b) => (b.bal-b.limit) - (a.bal-a.limit))
      .forEach(r => put(r, r.bal - r.limit));
  // 2. down to 80%, worst first
  rows.filter(r => r.bal > r.limit * UTIL_TIGHT).sort((a,b) => b.bal/b.limit - a.bal/a.limit)
      .forEach(r => put(r, r.bal - r.limit * UTIL_TIGHT));
  // Past that point the two goals genuinely diverge, so the caller picks.
  if(mode === "score"){
    // 3. keep buying down the worst percentage until overall is under 30%
    let guard = 0;
    while(cash > 0.5 && rows.reduce((n,r) => n + r.bal, 0) > limitSum * UTIL_GOOD && guard++ < 200){
      const r = rows.filter(x => x.bal > 0).sort((a,b) => b.bal/b.limit - a.bal/a.limit)[0];
      if(!r) break;
      const need = rows.reduce((n,x) => n + x.bal, 0) - limitSum * UTIL_GOOD;
      put(r, Math.min(need, Math.max(1, r.bal - r.limit * UTIL_GOOD) || r.bal));
    }
  }
  // 4. remainder goes where the debt costs most to carry — loans included,
  //    since a personal loan is often dearer than any of the cards
  const loanRows = activeLoans().filter(l => l.currency === cur)
    .map(l => { const s = loanState(l);
      return {c:{id:l.id, name:l.name}, kind:"loan", bal:s.estimate, limit:0, apr:l.apr || 0}; })
    .filter(r => r.bal > 0);
  if(cash > 0.5)
    [...rows, ...loanRows].filter(r => r.bal > 0)
      .sort((a,b) => b.apr - a.apr)
      .forEach(r => put(r, r.bal));

  const endBal = rows.reduce((n,r) => n + r.bal, 0);
  // what the split takes off the yearly interest bill
  const all = [...rows, ...loanRows];
  const saved = [...pay.entries()].reduce((n,[id,amt]) => {
    const r = all.find(x => x.c.id === id);
    return n + amt * (r ? r.apr : 0) / 100;
  }, 0);
  // a dollar paid anywhere moves the overall number identically, so what
  // actually separates the two strategies is the worst single card
  const maxUtil = rows.reduce((n,r) => Math.max(n, r.limit ? r.bal / r.limit : 0), 0);
  return {
    cur, limitSum, mode, saved, maxUtil, startMax,
    startUtil: limitSum ? startBal / limitSum : 0,
    endUtil:   limitSum ? endBal   / limitSum : 0,
    spent: Math.max(0, budget) - cash, leftover: cash,
    steps: all.filter(r => pay.get(r.c.id))
              .map(r => ({
                name:r.c.name, amount:pay.get(r.c.id), kind:r.kind || "card",
                from:r.limit ? Math.round((r.bal + pay.get(r.c.id)) / r.limit * 100) : null,
                to:  r.limit ? Math.round(r.bal / r.limit * 100) : null
              }))
              // worst card first, loans after (they have no percentage to fix)
              .sort((a,b) => (b.from == null ? -1 : b.from) - (a.from == null ? -1 : a.from)),
    overLimit: rows.filter(r => r.bal > r.limit).length
  };
}

/** Everything you owe in one currency, dearest to carry first.
 *  Cards and loans together — the ordering question is the same for both. */
function payoffOrder(cur){
  const cards = activeCards().filter(c => c.currency === cur)
    .map(c => { const s = cardState(c);
      return {id:c.id, kind:"card", name:c.name, bal:s.estimate, apr:c.apr || 0, monthly:s.monthly ||
               (s.estimate * (c.apr || 0) / 100) / 12}; });
  const loans = activeLoans().filter(l => l.currency === cur)
    .map(l => { const s = loanState(l);
      return {id:l.id, kind:"loan", name:l.name, bal:s.estimate, apr:l.apr || 0, monthly:s.monthly}; });
  return [...cards, ...loans]
    .filter(r => r.bal > 0)
    .sort((a,b) => b.apr - a.apr || b.bal - a.bal);
}

/* ── snapshot for an AI ─────────────────────────────────────────────
   Compact markdown rather than raw JSON: an LLM reads a table far more
   reliably than a nested object, and it costs a fraction of the tokens.
   Derived figures are included so nothing has to be recomputed.       */
function aiSnapshot(){
  const L = [];
  const d = new Date();
  const plain = (n, cur) => (cur === "INR" ? "₹" : "$") +
    Math.round(n).toLocaleString(cur === "INR" ? "en-IN" : "en-US");

  L.push("# Money snapshot — " + d.toDateString());
  L.push("");

  for(const [cur, list] of cardGroups()){
    const rows = list.map(c => [c, cardState(c)]);
    L.push("## Credit cards (" + (cur === "INR" ? "INR" : "USD") + ")");
    L.push("");
    L.push("| Card | Limit | Confirmed bal | Est. today | Available | Used | APR | Min pay | Stmt day | Confirmed | Paid by bill |");
    L.push("|---|---|---|---|---|---|---|---|---|---|---|");
    for(const [c,s] of rows){
      const bill = c.billId ? (S.bills.find(b => b.id === c.billId) || {}).name : null;
      L.push("| " + [
        c.name,
        s.limit ? plain(s.limit, cur) : "—",
        plain(s.confirmed, cur),
        plain(s.estimate, cur),
        s.avail == null ? "—" : (s.avail < 0 ? "OVER by " + plain(-s.avail, cur) : plain(s.avail, cur)),
        s.util == null ? "—" : Math.round(s.util * 100) + "%",
        c.apr ? c.apr + "%" : "—",
        c.minPayment ? plain(c.minPayment, cur) : "—",
        c.statementDay || "—",
        !c.confirmedAt ? "never" : s.age === 0 ? "today" : s.age + "d ago",
        bill || "not linked"
      ].join(" | ") + " |");
    }
    const lim = rows.reduce((n,[,s]) => n + s.limit, 0);
    const bal = rows.reduce((n,[,s]) => n + s.estimate, 0);
    L.push("");
    L.push("Totals: limit " + plain(lim, cur) + " · owed " + plain(bal, cur) +
           " · available " + plain(Math.max(0, lim - bal), cur) +
           (lim ? " · overall utilisation " + Math.round((bal / lim) * 100) + "%" : ""));
    L.push("");

    const cash = cashFor(cur);
    if(S.accounts.some(a => a.currency === cur)){
      L.push("### Cash available (" + cur + ")");
      L.push("");
      for(const a of S.accounts.filter(x => x.currency === cur))
        L.push("- " + (a.bank ? a.bank + " " : "") + a.name + ": " + plain(a.balance || 0, cur) +
               (a.confirmedAt ? " (checked " + a.confirmedAt + ")" : ""));
      L.push("");
      L.push("Total cash: " + plain(cash, cur));
      L.push("");
    }

    const plan = coachPlan(cur, S.payBudget && S.payBudget[cur] != null ? S.payBudget[cur] : cash);
    if(plan && plan.steps.length){
      L.push("### Suggested split of " + plain(plan.spent, cur) +
             " (utilisation " + Math.round(plan.startUtil*100) + "% → " + Math.round(plan.endUtil*100) + "%)");
      L.push("");
      for(const st of plan.steps)
        L.push("- " + st.name + ": " + plain(st.amount, cur) + "  (" + st.from + "% → " + st.to + "%)");
      L.push("");
    }
    const po = payoffOrder(cur);
    if(po.length){
      L.push("### Carrying cost, dearest first (" + cur + ")");
      L.push("");
      for(const r of po)
        L.push("- " + r.name + (r.kind === "loan" ? " (loan)" : "") + ": " +
               (r.apr ? r.apr + "% APR" : "APR unknown") +
               " on " + plain(r.bal, cur) + " ≈ " + plain(r.monthly, cur) + "/mo");
      L.push("");
      L.push("Total interest ≈ " + plain(po.reduce((n,r)=>n+r.monthly,0)*12, cur) + "/yr");
      L.push("");
    }
  }

  // this month's bills, so questions about cash flow have the numbers
  const list = billsFor(UI.y, UI.m);
  if(list.length){
    const pk = periodKey(UI.y, UI.m);
    L.push("## Bills — " + MONTHS[UI.m] + " " + UI.y);
    L.push("");
    L.push("| Bill | Due | Amount | Paid from | Status |");
    L.push("|---|---|---|---|---|");
    for(const b of list){
      const st = stateOf(b, UI.y, UI.m), g = progressOf(b, pk);
      L.push("| " + [
        b.name, MON3[UI.m] + " " + Math.min(b.dueDay, daysIn(UI.y, UI.m)),
        b.amount ? plain(b.amount, b.currency) : "varies",
        srcOf(b.sourceId).name,
        st === "paid" ? "paid" : st === "skipped" ? "nothing owed"
          : st === "partial" ? "part-paid " + plain(g.paid, b.currency) + ", " + plain(g.left, b.currency) + " left"
          : st === "missed" ? "OVERDUE" : "due"
      ].join(" | ") + " |");
    }
    L.push("");
  }

  if(activeLoans().length){
    L.push("## Loans");
    L.push("");
    L.push("| Loan | Lender | Balance | APR | Interest/mo | Monthly payment | Confirmed | Paid by bill |");
    L.push("|---|---|---|---|---|---|---|---|");
    for(const l of activeLoans()){
      const s = loanState(l);
      const bill = l.billId ? (S.bills.find(b => b.id === l.billId) || {}).name : null;
      L.push("| " + [
        l.name, l.lender || "—", plain(s.estimate, l.currency),
        l.apr ? l.apr + "%" : "—", plain(s.monthly, l.currency),
        l.minPayment ? plain(l.minPayment, l.currency) : "—",
        !l.confirmedAt ? "never" : s.age === 0 ? "today" : s.age + "d ago",
        bill || "not linked"
      ].join(" | ") + " |");
    }
    L.push("");
  }

  L.push("## How to read this");
  L.push("- **Confirmed bal** is what the card app last showed, on the date given.");
  L.push("- **Est. today** adds estimated interest since then plus anything logged. It is an estimate, not a statement figure.");
  L.push("- Utilisation above 30% is generally treated as weighing on credit scoring; above 80% is close to declining.");
  L.push("");
  L.push("## Questions worth asking");
  L.push("- Which card should I put a payment on first, and what does that save?");
  L.push("- If I have a fixed amount spare this month, how should I split it?");
  L.push("- Which cards are hurting my credit utilisation most, and what payment fixes that?");
  L.push("- Does anything here look wrong or inconsistent?");
  return L.join("\n");
}

async function doCopyForAI(){
  const text = aiSnapshot();
  try{
    if(navigator.clipboard && window.isSecureContext){
      await navigator.clipboard.writeText(text);
      return toast("Copied — paste it into any AI chat", 3200);
    }
  }catch(e){ /* fall through */ }
  try{
    if(navigator.canShare && navigator.canShare({text})){
      await navigator.share({text}); return;
    }
  }catch(e){ if(e && e.name === "AbortError") return; }
  // last resort: show it so it can be selected by hand
  UI.sheet = "data";
  $("#sheetTitle").textContent = "Snapshot";
  $("#sheetBody").innerHTML =
    '<div class="sec"><div class="hint" style="margin-bottom:9px">Select all and copy.</div>' +
    '<textarea readonly id="aiOut" style="width:100%;min-height:50vh;font-family:var(--f-num);font-size:11.5px">' +
    esc(text) + '</textarea></div>';
  const ta = $("#aiOut"); ta.focus(); ta.select();
}

function wireCardSheet(c){
  const body = $("#sheetBody");
  const q = id => body.querySelector(id);
  const patch = () => { save(); render(); };
  const reflow = () => { renderCardSheet(); render(); };

  // Log a payment from the card, so a card can be run from one place. If it
  // is not in the monthly list yet, adding it there is part of the same tap.
  q("#cardPay").onclick = () => {
    const bill = ensureCardBill(c);
    if(!bill) return toast("Give the card a name first");
    const pk = periodKey(UI.y, UI.m);
    const g = progressOf(bill, pk);
    const suggest = g.left > 0 ? g.left : (c.minPayment || bill.amount || 0);
    const v = prompt("Payment on " + (c.name || "this card") + ":", String(Math.round(suggest * 100) / 100));
    if(v === null) return;
    const n = parseFloat(String(v).replace(/[^0-9.\-]/g, ""));
    if(!Number.isFinite(n) || n <= 0) return toast("Enter an amount");
    // final only when it clears the expected amount, so part-payments stay open
    addPayment(bill.id, pk, {amount:n,
      final: !(bill.amount > 0 && n < bill.amount - 0.005)});
    save(); reflow();
    toast("Logged — set a later date below to arrange it ahead", 3800);
  };

  q("#cardArrange").onclick = () => {
    const bill = ensureCardBill(c);
    if(!bill) return toast("Give the card a name first");
    arrangePayment(bill, periodKey(UI.y, UI.m));
    save(); reflow();
    toast("Arranged for tomorrow — change the date below", 3800);
  };

  q("#cardConfirm").onclick = () => {
    const v = prompt("Balance shown in your " + (c.name || "card") + " app right now:",
                     String(c.balance || 0));
    if(v === null) return;
    const n = parseFloat(String(v).replace(/[^0-9.\-]/g, ""));
    if(!Number.isFinite(n) || n < 0) return toast("Enter a number");
    markConfirmed(c, n); c.confirmedFrom = "manual";
    S.spends = S.spends.filter(x => x.cardId !== c.id);   // superseded by a fresh truth
    patch(); reflow(); toast("Balance confirmed");
  };
  q("#cardSpend").onclick = () => {
    const v = prompt("Amount just spent on " + (c.name || "this card") + ":", "");
    if(v === null) return;
    const n = parseFloat(String(v).replace(/[^0-9.\-]/g, ""));
    if(!Number.isFinite(n) || n <= 0) return toast("Enter an amount");
    const note = prompt("What for? (optional)", "") || "";
    S.spends.push({id:uid(), cardId:c.id, accountId:"", dir:"out", date:todayISO,
                   loggedAt:new Date().toISOString(), amount:n, note:note.trim()});
    patch(); reflow(); toast("Logged " + money(n, c.currency));
  };

  q("#cName").onchange  = e => {
    c.name = e.target.value.trim();
    const b = cardBill(c);
    if(b && c.name) b.name = c.name;          // one name, not two
    $("#sheetTitle").textContent = c.name || "New card"; patch();
  };
  q("#cLimit").onchange = e => { c.limit = Math.max(0, parseFloat(e.target.value) || 0); reflow(); patch(); };
  q("#cCur").onchange   = e => { c.currency = e.target.value; reflow(); patch(); };
  q("#cApr").onchange   = e => { c.apr = Math.max(0, parseFloat(e.target.value) || 0); reflow(); patch(); };
  q("#cStmt").onchange  = e => { c.statementDay = parseInt(e.target.value,10) || 0; reflow(); patch(); };
  q("#cInList").onchange = e => {
    if(e.target.checked){
      if(!ensureCardBill(c)){ e.target.checked = false; return toast("Give the card a name first"); }
      toast("Added to the monthly list");
    }else{
      const b = cardBill(c);
      if(b){
        const n = S.payments.filter(p => p.billId === b.id).length;
        if(n && !confirm("Hide it from the monthly list? Its " + n + " recorded payment" +
            (n === 1 ? "" : "s") + " stay in history and it can come back later.")){
          e.target.checked = true; return;
        }
        b.archived = true;                     // hidden, never destroyed
      }
      toast("Hidden from the monthly list");
    }
    save(); reflow();
  };
  q("#cDue").onchange   = e => {
    c.dueDay = parseInt(e.target.value,10) || 0;
    const b = cardBill(c);                    // keep the bill on the same date
    if(b && c.dueDay) b.dueDay = c.dueDay;
    reflow(); patch();
  };
  q("#cMin").onchange   = e => { c.minPayment = Math.max(0, parseFloat(e.target.value) || 0); patch(); };
  q("#cBill").onchange  = e => { c.billId = e.target.value; reflow(); patch(); };

  q("#cardArch").onclick = () => { c.archived = !c.archived; save(); closeSheet(); };
  q("#cardDel").onclick = () => {
    if(!confirm('Delete "' + (c.name || "this card") + '" and everything logged against it?')) return;
    S.cards  = S.cards.filter(x => x.id !== c.id);
    S.spends = S.spends.filter(x => x.cardId !== c.id);
    S.statements = S.statements.filter(x => x.cardId !== c.id);
    save(); closeSheet(); toast("Deleted");
  };
}

      '<button class="paydel" data-delpay="' + esc(x.id) + '" aria-label="Remove payment ' + (i+1) + '">' +

    '</div>' +
    (isScheduled(x) ? '<div class="schednote">Arranged for ' + shortDate(x.date) +
      ' &middot; ' + money(x.amount || 0, cur) + ' not deducted yet</div>' : '')
  ).join("") + '</div>';
}

/** Timeline of hand-logged movements, newest first, each removable. */
function movesHTML(list, cur, title){
  if(!list.length) return "";
  const sorted = list.slice().sort((a,b) =>
    (b.loggedAt || b.date || "").localeCompare(a.loggedAt || a.date || ""));
  return '<div class="movelist"><span class="eyebrow">' + title + '</span>' +
    sorted.map(m =>
      '<div class="moverow"><span class="d num">' + shortDate(m.date) + '</span>' +
      '<span class="mnote">' + (m.note ? esc(m.note) : (m.dir === "in" ? "money in" : "spend")) + '</span>' +
      '<span class="a num' + (m.dir === "in" ? " in" : "") + '">' +
        (m.dir === "in" ? "+" : "−") + money(m.amount || 0, cur) + '</span>' +
      '<button class="paydel" data-delmove="' + esc(m.id) + '" aria-label="Remove entry">' +
      '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>').join("") +
  '</div>';
}

            '<span class="a" style="font-weight:500;color:var(--muted)">+' + money(s.interest, l.currency) + '</span></div>' : '') +
          (s.repaid ? '<div class="mini-row"><span class="d" style="width:auto">payments since</span>' +

          '</div>' : '') +
      '<button class="ghost" id="loanPay" style="margin-top:11px">Log a payment</button>' +

    if(v === null) return;
    const n = parseFloat(String(v).replace(/[^0-9.\-]/g, ""));

  };

    const b2 = loanBillOrWarn(); if(!b2) return;

  };

    markConfirmed(l, n); save(); reflow(); toast("Balance confirmed");
  };

                                  $("#sheetTitle").textContent = l.name || "New loan"; patch(); };
  q("#lLender").onchange = e => { l.lender = e.target.value.trim(); patch(); };
  q("#lApr").onchange    = e => { l.apr = Math.max(0, parseFloat(e.target.value) || 0); reflow(); patch(); };
  q("#lCur").onchange    = e => { l.currency = e.target.value; reflow(); patch(); };
  q("#lMin").onchange    = e => { l.minPayment = Math.max(0, parseFloat(e.target.value) || 0); patch(); };
  q("#lBill").onchange   = e => { l.billId = e.target.value; reflow(); patch(); };
  q("#lArch").onclick    = () => { l.archived = !l.archived; save(); closeSheet(); };
  q("#lDel").onclick     = () => {
    if(!confirm('Delete "' + (l.name || "this loan") + '"?')) return;
    S.loans = S.loans.filter(x => x.id !== l.id);
    UI.loanDraft = false; save(); closeSheet(); toast("Deleted");
  };
  $("#scrim").classList.add("on");
  $("#sheet").classList.add("on");
}

  $("#sheet").classList.add("on");
}

      '<div class="fields">' + cards.map(c => {

  };

  $("#sheet").classList.add("on");
}

/* ── data sheet: sync section ───────────────────────────────────── */
function syncAgo(){
  const c = syncCfg();
  if(!c.at) return "not synced yet";
  const mins = Math.round((Date.now() - new Date(c.at).getTime()) / 60000);
  if(mins < 1)  return "synced just now";
  if(mins < 60) return "synced " + mins + " min ago";
  const hrs = Math.round(mins / 60);
  if(hrs < 24)  return "synced " + hrs + " hour" + (hrs===1?"":"s") + " ago";
  return "synced " + Math.round(hrs / 24) + " day" + (Math.round(hrs/24)===1?"":"s") + " ago";
}

      '<div class="hint" style="margin-top:9px">It contains balances, limits and card names. Paste it only somewhere you are comfortable putting that.</div>' +
    '</div>' +
    syncSectionHTML() +
    '<div class="sec"><span class="eyebrow">Manual backup</span>' +
      '<div class="bstat ' + (isDirty() ? "dirty" : "clean") + '">' +
        '<i class="dot" style="background:' + (isDirty() ? "var(--warn)" : "var(--ok)") + '"></i>' +
        '<span>' + (isDirty() ? "Unsaved changes &middot; " : "Up to date &middot; ") + sinceBackup() + '</span></div>' +
      '<button class="primary" id="expBtn">Back up to Files / iCloud Drive</button>' +
      '<button class="ghost" id="impBtn">Restore from a file</button>' +
      '<div class="hint" style="margin-top:10px">' + S.bills.length + ' bills &middot; ' + counts +
        ' payment' + (counts===1?'':'s') + ' &middot; saves as one JSON file.</div>' +
      '<details class="howto"><summary>Make every backup land in iCloud automatically</summary>' +
        '<ol><li>iPhone <b>Settings</b> &rarr; <b>Apps</b> &rarr; <b>Safari</b> &rarr; <b>Downloads</b></li>' +
        '<li>Choose <b>iCloud Drive</b> instead of On My iPhone</li>' +
        '<li>Now <b>Back up</b> writes straight into iCloud Drive &rarr; Downloads, and syncs to every device</li></ol>' +
        '<p>To restore on a new phone, open this page, tap <b>Restore from a file</b> and pick the newest <code>bill-ledger-….json</code> from iCloud Drive.</p>' +
      '</details>' +
    '</div>' +
    '<div class="sec"><span class="eyebrow">Payment sources</span>' +
      '<div class="mini">' + S.sources.map(s =>
        '<div class="mini-row"><i class="dot" style="background:' + esc(s.color) + '"></i>' +
        '<span>' + esc(s.name) + '</span>' +
        '<span class="a num" style="font-weight:500;color:var(--muted)">' +
          S.bills.filter(b => !b.archived && b.sourceId === s.id).length + ' bills</span>' +
        '<button class="icon-btn" data-delsrc="' + esc(s.id) + '" aria-label="Remove ' + esc(s.name) + '" style="width:30px;height:30px">' +
          '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>').join("") +
      '</div>' +
      '<div class="fields"><div class="two">' +
        '<div class="field"><label for="nsName">New source</label>' +
          '<input type="text" id="nsName" placeholder="e.g. HDFC"></div>' +
        '<div class="field"><label for="nsColor">Colour</label>' +
          '<input type="color" id="nsColor" value="#4B7BA8" style="padding:5px;height:44px"></div>' +
      '</div></div>' +
      '<button class="ghost" id="addSrc" style="margin-top:10px">Add source</button>' +
    '</div>' +
    '<div class="sec"><span class="eyebrow">Archived bills</span>' +
      (S.bills.filter(b => b.archived).length
        ? '<div class="mini">' + S.bills.filter(b => b.archived).map(b =>
            '<div class="mini-row"><span>' + esc(billDisplayName(b)) + '</span>' +
            '<button class="a" data-unarch="' + esc(b.id) + '" style="color:var(--accent);font-weight:600">Restore</button></div>').join("") + '</div>'
        : '<div class="hint">None.</div>') +
    '</div>' +
    '<div class="sec"><span class="eyebrow">Reset</span>' +
      '<button class="danger" id="resetBtn">Erase everything and reload the starter list</button></div>';

  const body = $("#sheetBody");
  const q = id => body.querySelector(id);

  if(q("#syncOn")) q("#syncOn").onclick = async () => {
    const owner = q("#syOwner").value.trim().replace(/^@/, "");
    const repo  = q("#syRepo").value.trim();
    const tok   = q("#syTok").value.trim();
    if(!owner || !repo) return toast("Enter your username and repo name");
    if(!tok) return toast("Paste an access token");
    const c = syncCfg();
    Object.assign(c, {on:true, owner, repo, sha:null, err:null});
    setToken(tok);
    saveLocal();
    toast("Connecting…");
    await syncBoot();
    openData();
    toast(syncCfg().err ? syncCfg().err : "Sync is on", syncCfg().err ? 4000 : 2000);
  };
  if(q("#syncNow")) q("#syncNow").onclick = () => runSync(false);
  if(q("#syncOff")) q("#syncOff").onclick = () => {
    if(!confirm("Turn off sync? The file already on GitHub is kept, and this device keeps its own copy.")) return;
    Object.assign(syncCfg(), {on:false, sha:null, at:null, err:null});
    setToken("");
    saveLocal(); openData(); render(); toast("Sync off");
  };

  if(q("#aiBtn")) q("#aiBtn").onclick = doCopyForAI;
  if(q("#calBtn")) q("#calBtn").onclick = doCalendar;
  body.querySelector("#expBtn").onclick = doExport;
  body.querySelector("#impBtn").onclick = () => $("#importFile").click();
  body.querySelector("#addSrc").onclick = () => {
    const n = body.querySelector("#nsName").value.trim();
    if(!n) return toast("Give the source a name");
    S.sources.push({id:uid(), name:n, color:body.querySelector("#nsColor").value});
    save(); openData(); render(); toast("Added " + n);
  };
  body.querySelectorAll("[data-delsrc]").forEach(btn => btn.onclick = () => {
    const id = btn.dataset.delsrc;
    const used = S.bills.filter(b => b.sourceId === id).length;
    if(used) return toast("Still used by " + used + " bill" + (used>1?"s":""));
    S.sources = S.sources.filter(s => s.id !== id); save(); openData(); render();
  });
  body.querySelectorAll("[data-unarch]").forEach(btn => btn.onclick = () => {
    const b = billOf(btn.dataset.unarch); if(b) b.archived = false;
    save(); openData(); render(); toast("Restored");
  });
  body.querySelector("#resetBtn").onclick = () => {
    if(!confirm("Erase all bills and payment history, and reload the starter list?")) return;
    Object.assign(S, seed()); save(); closeSheet(); toast("Reset");
  };

  $("#scrim").classList.add("on");
  $("#sheet").classList.add("on");
}

function markBackedUp(){
  S.lastBackup = {at:new Date().toISOString(), sig:signature()};
  save(); render();
  // only refresh the data sheet if that is genuinely what is on screen —
  // a background sync must never replace a sheet the user is working in
  if(UI.sheet === "data" && $("#sheet").classList.contains("on")) openData();
}
async function doExport(){
  const name = "bill-ledger.json";     // stable name so Files can replace the old one
  const data = payload();
  // Share sheet first on iOS: it's the only route that offers "Save to Files"
  // onto an existing file rather than piling up bill-ledger 2.json, 3.json…
  try{
    const file = new File([data], name, {type:"application/json"});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:"Bill Ledger backup"});
      markBackedUp(); return toast("Shared — choose Save to Files", 3200);
    }
  }catch(err){
    if(err && err.name === "AbortError") return;   // user dismissed the sheet
    /* otherwise fall through to the download paths */
  }
  if(window.claude && window.claude.downloads){
    try{
      await window.claude.downloads.save({filename:name, data});
      markBackedUp(); return toast("Backed up · save it to iCloud Drive");
    }catch(err){
      const code = err && err.code;
      if(code === "declined") return;
      if(code === "rate_limited") return toast("A save prompt is already open");
      if(code === "too_large")   return toast("Backup is too large to save here");
      /* anything else: fall through to the ordinary download path */
    }
  }
  try{
    const url = URL.createObjectURL(new Blob([data], {type:"application/json"}));
    const a = document.createElement("a");
    a.href = url; a.download = name; a.rel = "noopener";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    markBackedUp(); toast("Backed up · choose iCloud Drive when saving", 3200);
  }catch(e){ toast("Could not save the backup from this browser"); }
}

$("#importFile").onchange = e => {
  const f = e.target.files && e.target.files[0];
  if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const raw = JSON.parse(r.result);
      if(!Array.isArray(raw.bills) || !Array.isArray(raw.sources)) throw new Error("shape");
      const d = sanitize(raw);          // file is untrusted, whoever sent it
      const when = d.exportedAt ? "\n\nBacked up " + new Date(d.exportedAt).toLocaleString() : "";
      if(!confirm("Replace everything on this device with " + d.bills.length + " bills and " +
        d.payments.length + " payments from this file?" + when)) return;
      Object.assign(S, {
        version:1, sources:d.sources, bills:d.bills, payments:d.payments,
        cards:d.cards, spends:d.spends, statements:d.statements,
        loans:d.loans, accounts:d.accounts,
        startPeriod:d.startPeriod, viewMode:d.viewMode, theme:d.theme
      });
      S.lastBackup = {at:d.exportedAt || new Date().toISOString(), sig:signature()};
      resetStaleFilters();
      applyTheme(); save(); closeSheet(); toast("Restored from backup");
    }catch(err){ toast("That file isn't a Bill Ledger backup"); }
  };
  r.readAsText(f);
  e.target.value = "";
};

/* ── events ─────────────────────────────────────────────────────── */
// remember whether the settled fold was left open, without a re-render that
// would fight the browser's own <details> toggle
$("#main").addEventListener("toggle", e => {
  const d = e.target.closest && e.target.closest("[data-fold]");
  if(d){
    const f = d.dataset.fold;
    if(f === "cardset"){ S.cardSetOpen = d.open; saveLocal(); return; }
    S[f === "src" ? "srcOpen" : f === "sum" ? "sumOpen"
      : f.startsWith("plan") ? "planOpen" : "settledOpen"] = d.open;
    saveLocal();
  }
}, true);

$("#main").addEventListener("change", e => {
  const bg = e.target.closest("[data-budget]");
  if(!bg) return;
  const cur = bg.dataset.budget;
  S.payBudget = S.payBudget || {};
  const v = parseFloat(bg.value);
  S.payBudget[cur] = Number.isFinite(v) && v >= 0 ? v : cashFor(cur);
  save(); render();
});

$("#main").addEventListener("click", e => {
  const card = e.target.closest("[data-card]");
  if(card){ openCard(card.dataset.card); return; }
  const md = e.target.closest("[data-mode2]");
  if(md){ S.payMode = md.dataset.mode2; save(); render(); return; }
  const acct = e.target.closest("[data-editacct]");
  if(acct){ openAccount(acct.dataset.editacct); return; }
  const ln = e.target.closest("[data-editloan]");
  if(ln){ openLoan(ln.dataset.editloan); return; }
  const act = e.target.closest("[data-act]");
  if(act){
    const a = act.dataset.act;
    if(a === "restore") $("#importFile").click();
    if(a === "add") $("#addBtn").click();
    if(a === "addcard"){
      const c = newCard(); UI.cardDraft = true; openCard(c.id);
      setTimeout(() => { const el = $("#cName"); if(el) el.focus(); }, 280);
    }
    if(a === "refreshall") openRefreshAll();
    if(a === "copyai") doCopyForAI();
    if(a === "addacct") openAccount(null);
    if(a === "addloan") openLoan(null);
    if(a === "fixstale") openRefreshAll();
    return;
  }
  const mode = e.target.closest("[data-mode]");
  if(mode){ S.viewMode = mode.dataset.mode; save(); render(); return; }
  const cv = e.target.closest("[data-cardview]");
  if(cv){ S.cardView = cv.dataset.cardview; save(); render(); return; }
  const tick = e.target.closest("[data-tick]");
  if(tick){
    const id = tick.dataset.tick, pk = periodKey(UI.y, UI.m);
    // settled -> clear the month; anything else (including part-paid) -> settle
    setStatus(id, pk, stateOf(billOf(id), UI.y, UI.m) === "paid" ? null : "paid");
    render();
    return;
  }
  const open = e.target.closest("[data-open]");
  if(open) openSheet(open.dataset.open, open.dataset.period);
});

document.querySelectorAll(".tab").forEach(t => t.onclick = () => { UI.view = t.dataset.view; render(); });
$("#prevM").onclick = () => { if(--UI.m < 0){ UI.m = 11; UI.y--; } render(); };
$("#nextM").onclick = () => { if(++UI.m > 11){ UI.m = 0; UI.y++; } render(); };
$("#mLabel").onclick = () => { UI.y = now.getFullYear(); UI.m = now.getMonth(); render(); };

document.addEventListener("click", e => {
  const chip = e.target.closest(".chip[data-f]");
  if(!chip) return;
  const {f, v} = chip.dataset;
  if(f === "clear"){ UI.cur = "all"; UI.src = "all"; }
  if(f === "cur") UI.cur = v;
  if(f === "src") UI.src = (UI.src === v ? "all" : v);
  render();
});

$("#addBtn").onclick = () => {
  const b = {
    id:uid(), name:"", amount:0, currency:UI.cur === "INR" ? "INR" : "USD",
    sourceId:S.sources[0] ? S.sources[0].id : "", dueDay:1, freq:"monthly",
    anchorY:UI.y, anchorM:UI.m, endYear:null, note:"", archived:false
  };
  S.bills.push(b); UI.draft = true; save();
  openSheet(b.id);
  setTimeout(() => { const el = $("#bName"); if(el) el.focus(); }, 280);
};
$("#histBtn").onclick = () => { UI.view = UI.view === "history" ? "ledger" : "history"; render(); };
$("#dataBtn").onclick = openData;
$("#sheetBody").addEventListener("toggle", e => {
  const d = e.target.closest && e.target.closest("[data-fold=\"cardset\"]");
  if(d){ S.cardSetOpen = d.open; saveLocal(); }
}, true);

$("#sheetBody").addEventListener("change", e => {
  const row = e.target.closest(".payrow");
  if(!row || (UI.sheet !== "card" && UI.sheet !== "loan")) return;
  const rec = S.payments.find(x => x.id === row.dataset.pay);
  if(!rec) return;
  const f = e.target.dataset.pf;
  if(f === "amount") rec.amount = Math.max(0, parseFloat(e.target.value) || 0);
  else if(f === "date") rec.date = e.target.value || rec.date;
  rec.updatedAt = new Date().toISOString();
  save(); UI.sheet === "loan" ? openLoan(UI.loanId) : renderCardSheet(); render();
});

$("#sheetBody").addEventListener("click", e => {
  const dp = e.target.closest("[data-delpay]");
  if(dp && (UI.sheet === "card" || UI.sheet === "loan")){
    S.payments = S.payments.filter(x => x.id !== dp.dataset.delpay);
    save(); UI.sheet === "loan" ? openLoan(UI.loanId) : renderCardSheet(); render(); return;
  }
  const oc = e.target.closest("[data-opencard]");
  if(oc){ openCard(oc.dataset.opencard); return; }
  const del = e.target.closest("[data-delmove]");
  if(!del) return;
  S.spends = S.spends.filter(x => x.id !== del.dataset.delmove);
  save();
  if(UI.sheet === "card") renderCardSheet();
  else if(UI.sheet === "account") openAccount(UI.acctId);
  render();
});
$("#sheetDone").onclick = closeSheet;
$("#scrim").onclick = closeSheet;
document.addEventListener("keydown", e => { if(e.key === "Escape" && $("#sheet").classList.contains("on")) closeSheet(); });

/* theme */
function applyTheme(){
  if(S.theme) document.documentElement.setAttribute("data-theme", S.theme);
  else document.documentElement.removeAttribute("data-theme");
}
$("#themeBtn").onclick = () => {
  const dark = matchMedia("(prefers-color-scheme: dark)").matches;
  const cur = S.theme || (dark ? "dark" : "light");
  S.theme = cur === "dark" ? "light" : "dark";
  applyTheme(); save();
};

applyTheme();
saveLocal();   // persist the starter list on first open
render();
syncBoot();    // no-op unless GitHub sync is switched on
})();
</script>
