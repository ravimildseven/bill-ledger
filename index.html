function shortDate(isoStr){
  if(!isoStr) return "";
  const [y,m,d] = isoStr.split("-").map(Number);
  return MON3[m-1] + " " + d;
}

/* ── render: history ────────────────────────────────────────────── */
/* ── activity: every movement, summed by week or month ──────────────
   Three figures that must never be added together:
     out of accounts — cash that actually left (bill payments + spends)
     on cards        — swipes logged, which become cash out when paid
     in              — money arriving
   A card bill payment sits in the first and settles earlier swipes, so
   summing the first two would count the same spending twice.          */
function weekStartOf(isoStr){
  const d = new Date(isoStr + "T00:00:00");
  d.setDate(d.getDate() - ((d.getDay() + 6) % 7));      // Monday
  return iso(d);
}
function weekLabel(startISO){
  const a = new Date(startISO + "T00:00:00");
  const b = new Date(a); b.setDate(b.getDate() + 6);
  const sameMonth = a.getMonth() === b.getMonth();
  return MON3[a.getMonth()] + " " + a.getDate() + " – " +
         (sameMonth ? "" : MON3[b.getMonth()] + " ") + b.getDate();
}

/** Everything that moved money, newest first. */
function movements(){
  const out = [];
  for(const p of S.payments){
    if(p.status !== "paid" || isScheduled(p)) continue;
    const b = billOf(p.billId); if(!b) continue;
    out.push({kind:"bill", date:p.date, amount:p.amount || 0, currency:b.currency,
              label:billDisplayName(b), sub:srcOf(p.sourceId).name,
              dir:"out", cash:true, sourceId:p.sourceId});
  }
  for(const s of S.spends){
    if(s.cardId){
      const c = cardOf(s.cardId); if(!c) continue;
      out.push({kind:"card", date:s.date, amount:s.amount || 0, currency:c.currency,
                label:s.note || s.cat || "Card spend", sub:displayName(c), cat:s.cat || "", gap:!!s.gap,
                dir:"out", cash:false, sourceId:c.sourceId});
    }else if(s.accountId){
      const a = acctOf(s.accountId); if(!a) continue;
      const inbound = s.dir === "in";
      out.push({kind:"cash", date:s.date, amount:s.amount || 0, currency:a.currency,
                label:s.note || s.cat || (inbound ? "Money in" : "Spend"), cat:s.cat || "", gap:!!s.gap,
                sub:((a.bank ? a.bank + " · " : "") + a.name).trim(),
                dir:inbound ? "in" : "out", cash:true, sourceId:""});
    }
  }
  return out.sort((a,b) => (b.date || "").localeCompare(a.date || ""));
}

/** Spending as CSV, so it opens in Numbers or a spreadsheet. One row per
 *  movement, with the period keys already worked out for pivoting. */
function activityCSV(){
  const q = v => {
    const t = String(v == null ? "" : v);
    return /[",\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t;
  };
  const rows = [["date","week_starting","month","type","direction","description",
                 "card_or_account","paid_from","account_debited","currency","amount"]];
  for(const m of movements()){
    const acct = m.kind === "bill" ? accountForSource(m.sourceId) : null;
    rows.push([
      m.date, weekStartOf(m.date), (m.date || "").slice(0,7),
      m.kind === "bill" ? "bill payment" : m.kind === "card" ? "card spend" : "cash",
      m.dir === "in" ? "in" : "out",
      m.label, m.sub,
      m.kind === "bill" ? srcOf(m.sourceId).name : "",
      acct ? ((acct.bank ? acct.bank + " " : "") + acct.name).trim() : "",
      m.currency,
      (m.amount || 0).toFixed(2)
    ]);
  }
  return rows.map(r => r.map(q).join(",")).join("\r\n") + "\r\n";
}
async function doExportCSV(){
  const text = activityCSV();
  const name = "spending-" + todayISO + ".csv";
  try{
    const file = new File([text], name, {type:"text/csv"});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:"Spending"});
      return toast("Shared — choose where to save it", 3200);
    }
  }catch(err){ if(err && err.name === "AbortError") return; }
  try{
    const url = URL.createObjectURL(new Blob([text], {type:"text/csv"}));
    const a = document.createElement("a");
    a.href = url; a.download = name; a.rel = "noopener";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    toast("Downloaded " + name, 3200);
  }catch(e){ toast("Could not create the file here"); }
}

/** Where the newest period's spending went, by category — spends only,
 *  never bill payments, so a card bill doesn't count its swipes twice. */
function catBarsHTML(list){
  const spends = list.filter(m => m.kind !== "bill" && m.dir !== "in");
  const curs = [...new Set(spends.map(m => m.currency))];
  if(curs.length !== 1 || spends.length < 2) return "";
  const by = {};
  for(const m of spends){ const k = m.cat || "Uncategorised"; by[k] = (by[k] || 0) + m.amount; }
  const rows = Object.entries(by).sort((a,b) => b[1] - a[1]).slice(0, 6);
  if(rows.length < 2 && rows[0][0] === "Uncategorised") return "";
  const top = rows[0][1] || 1;
  return '<div class="catbars">' + rows.map(([k, v]) =>
    '<div class="catbar"><span>' + esc(k) + '</span><i style="width:' + Math.max(3, (v / top) * 100).toFixed(1) +
    '%"></i><b>' + money(v, curs[0]) + '</b></div>').join("") + '</div>';
}

function historyHTML(){
  const grain = S.actGrain === "week" ? "week" : "month";
  const all = movements()
    .filter(m => UI.cur === "all" || m.currency === UI.cur)
    .filter(m => UI.src === "all" || m.sourceId === UI.src);

  let out = filtersHTML() +
    '<div class="controls" style="padding-left:16px">' +
      '<span class="eyebrow" style="margin-right:auto">' + all.length + ' entries</span>' +
      '<div class="vtog">' +
        '<button data-grain="week" aria-pressed="' + (grain === "week") + '">Weekly</button>' +
        '<button data-grain="month" aria-pressed="' + (grain === "month") + '">Monthly</button>' +
      '</div></div>';

  if(!all.length){
    return out + '<div class="empty"><b>Nothing recorded yet</b>' +
      'Tick a bill off, or log a spend on a card or account, and it lands here with weekly and monthly totals.</div>';
  }

  const groups = new Map();
  for(const m of all){
    const key = grain === "week" ? weekStartOf(m.date) : (m.date || "").slice(0, 7);
    if(!groups.has(key)) groups.set(key, []);
    groups.get(key).push(m);
  }
  const keys = [...groups.keys()].sort().reverse();

  const totalsFor = list => {
    const t = {};
    for(const m of list){
      const g = t[m.currency] || (t[m.currency] = {cashOut:0, cardOut:0, cashIn:0});
      if(m.dir === "in") g.cashIn += m.amount;
      else if(m.cash)    g.cashOut += m.amount;
      else               g.cardOut += m.amount;
    }
    return t;
  };

  // trend across the periods on screen, tallest bar sets the scale
  const trend = keys.slice(0, 12).reverse().map(k => {
    const t = totalsFor(groups.get(k));
    return {k, out:Object.values(t).reduce((n,g) => n + g.cashOut, 0)};
  });
  const peak = Math.max(1, ...trend.map(x => x.out));
  if(trend.length >= 2){
    out += '<div class="trend"><span class="eyebrow">Money out, last ' + trend.length +
      ' ' + (grain === "week" ? "weeks" : "months") + '</span><div class="trendbars">' +
      trend.map(x => '<i style="height:' + Math.max(4, (x.out / peak) * 100) + '%" title="' +
        esc(x.k) + '"></i>').join("") + '</div></div>';
  }

  keys.forEach((key, gi) => {
    const list = groups.get(key);
    const t = totalsFor(list);
    const title = grain === "week" ? weekLabel(key)
      : MONTHS[Number(key.slice(5, 7)) - 1] + " " + key.slice(0, 4);
    out += '<div class="actgroup"><div class="acthead"><h3>' + esc(title) + '</h3>' +
      '<span class="cnt">' + list.length + '</span></div>' +
      '<div class="acttotals">' + Object.entries(t).map(([cur,g]) =>
        '<div class="acttotwrap">' +
          (Object.keys(t).length > 1
            ? '<span class="curtag">' + (cur === "INR" ? "India ₹" : "US $") + '</span>' : '') +
          '<div class="acttot">' +
            '<div><span>Money out</span><b class="num">' + money(g.cashOut, cur) + '</b></div>' +
            (g.cardOut ? '<div><span>Card spend</span><b class="num card">' + money(g.cardOut, cur) + '</b></div>' : '') +
            (g.cashIn  ? '<div><span>Money in</span><b class="num in">' + money(g.cashIn, cur) + '</b></div>' : '') +
          '</div>' +
        '</div>').join("") + '</div>' +
      (gi === 0 ? catBarsHTML(list) : '') +
      '<div class="rows">' + list.map(m => {
        const [, mm, dd] = (m.date || "--").split("-");
        return '<div class="hrow act">' +
          '<span class="hdate"><b class="num">' + Number(dd || 0) + '</b>' + (MON3[Number(mm) - 1] || '') + '</span>' +
          '<span class="info"><span class="name">' + esc(m.label) + '</span>' +
            '<span class="meta"><i class="ktag ' + m.kind + '">' +
              (m.kind === "bill" ? "bill" : m.kind === "card" ? "card" : "cash") + '</i>' +
              (m.gap ? '<i class="cattag gaptag">unlogged</i>' : '') +
              (m.cat && m.cat !== m.label ? '<i class="cattag">' + esc(m.cat) + '</i>' : '') +
              esc(m.sub) + '</span></span>' +
          '<span class="a num ' + (m.dir === "in" ? "in" : m.cash ? "" : "oncard") + '">' +
            (m.dir === "in" ? "+" : "−") + money(m.amount, m.currency) + '</span></div>';
      }).join("") + '</div></div>';
  });
  out += '<div class="cardacts"><button class="ghost" data-act="csv">Export spending as a spreadsheet</button>' +
    '<button class="ghost" data-act="copyai">Copy a snapshot for an AI</button></div>';
  out += '<div class="hint" style="padding:4px 16px 18px">' +
    '<b>Money out</b> is cash that left your accounts — bills paid and money spent from an account.<br>' +
    '<b>Card spend</b> is what you put on a card. It is not cash yet; it becomes Money out when you pay that card’s bill.<br>' +
    'They are shown apart because adding them would count the same spending twice.</div>';
  return out;
}

/* ── render: cards ──────────────────────────────────────────────── */
const LEVEL_LABEL = {safe:"Plenty left", watch:"Getting used", tight:"Nearly full",
                     maxed:"No room", none:"No limit set"};

/** What is actually missing, said precisely. */
function cardGap(c, s){
  if(!s.limit && !c.confirmedAt) return "Needs a limit and a balance";
  if(!s.limit)      return "Needs a credit limit";
  if(!c.confirmedAt) return "Needs a balance";
  return null;
}
function cardsHTML(){
  const cards = activeCards();
  if(!cards.length){
    return '<div class="empty"><b>No cards yet</b>' +
      'Add a card with its limit and balance, and this page will tell you what is safe to swipe.' +
      '<div class="welcome"><button class="primary" data-act="addcard">Add your first card</button></div></div>';
  }
  const states = cards.map(c => [c, cardState(c)]);
  const need = states.filter(([c,s]) => s.needsUpdate || cardGap(c,s)).length;

  // headline: total room across cards we can actually vouch for, per currency
  const byCur = {};
  for(const [c,s] of states){
    if(s.avail == null) continue;
    const g = byCur[c.currency] || (byCur[c.currency] = {avail:0, limit:0, shaky:0});
    g.avail += s.avail; g.limit += s.limit; if(s.shaky) g.shaky++;
  }
  // owed against held, per currency — the two numbers that frame everything else
  const owed = {}, held = {};
  for(const [c,st] of states) owed[c.currency] = (owed[c.currency] || 0) + st.estimate;
  for(const l of activeLoans()) owed[l.currency] = (owed[l.currency] || 0) + loanState(l).estimate;
  for(const a2 of S.accounts) held[a2.currency] = (held[a2.currency] || 0) + accountState(a2).estimate;
  const owedCurs = [...new Set([...Object.keys(owed), ...Object.keys(held)])].sort();
  let out = '<div class="owedbar">' + owedCurs.map(cur =>
    '<div class="owedrow">' +
      '<div class="owedcell owe"><span>Owed</span><b class="num">' +
        money(owed[cur] || 0, cur) + '</b></div>' +
      '<div class="owedcell have"><span>In accounts</span><b class="num">' +
        money(held[cur] || 0, cur) + '</b></div>' +
    '</div>').join("") + '</div>';

  out += '<div class="summary">' + Object.entries(byCur).map(([cur,g]) =>
    '<div class="tot-row"><div class="tot-head">' +

      '<div class="tot-sub">of ' + money(g.limit, cur) + ' total limit' +
        (g.shaky ? ' &middot; ' + g.shaky + ' figure' + (g.shaky===1?'':'s') + ' not current' : '') +

    out += '<details class="fold" data-fold="plan-' + cur + '"' +

      if(plan.saved > 1)

      out += '<div class="field" style="margin-top:11px"><label for="bg-' + cur + '">Change the amount</label>' +
        '<input type="number" inputmode="decimal" step="1" id="bg-' + cur + '" data-budget="' + cur +
        '" value="' + Math.round(budget) + '"></div>' +
        '<div class="hint">Under 30% overall is the usual credit-scoring threshold; over 80% is where cards start declining.</div>' +
      '</div>';

      // --- carrying cost ---
      const po = payoffOrder(cur);
      if(po.length){
        const yr = po.reduce((n,r) => n + r.monthly, 0) * 12;
        out += '<div class="planblock"><div class="planhead"><span>Costs most to carry</span>' +
          '<b class="num">' + money(yr, cur) + '<em>/yr</em></b></div><div class="mini">' +
          po.slice(0, 10).map(r =>

            '<span class="a num">' + money(r.monthly, cur) + '<em>/mo</em></span></div>').join("") +
          '</div><div class="hint" style="margin-top:7px">Interest is an estimate from the APR you entered. Clearing the top of this list saves the most.</div></div>';
      }
    }
    out += '</div></details>';
  }
  return out;
}

/* ── mutations ──────────────────────────────────────────────────── */
/** Today if we're looking at the live month, otherwise that month's due date. */
function defaultDate(b, pk){
  const [y,m] = pk.split("-").map(Number);
  return (y === now.getFullYear() && (m-1) === now.getMonth())
    ? todayISO : iso(dueDate(b, y, m-1));
}
function clearPeriod(billId, pk){
  S.payments = S.payments.filter(p => !(p.billId === billId && p.period === pk));
}
/** Record one payment. `final` closes the month; false leaves it outstanding. */
function addPayment(billId, pk, {amount, date, sourceId, note, final} = {}){
  const b = billOf(billId);
  const stamp = new Date().toISOString();
  const p = {
    id:uid(), billId, period:pk, status:"paid",
    date: date || defaultDate(b, pk),
    amount: amount == null ? (b.amount || 0) : amount,
    sourceId: sourceId || b.sourceId, note: note || "",
    final: final !== false,
    loggedAt:stamp, updatedAt:stamp
  };
  S.payments.push(p);
  save();
  return p;
}
const tomorrowISO = () => { const d = new Date(); d.setDate(d.getDate() + 1); return iso(d); };

/** Arrange a payment for a future date without pretending it has happened.
 *  Defaults to tomorrow so one tap gets a bill out of overdue; the date can
 *  then be moved with the picker. */
function arrangePayment(bill, pk, amount){
  const amt = amount == null ? (progressOf(bill, pk).left || bill.amount || 0) : amount;
  return addPayment(bill.id, pk, {
    amount: amt, date: tomorrowISO(),
    final: !(bill.amount > 0 && amt < bill.amount - 0.005)
  });
}

/** Close the month out at whatever has been paid so far. */
function closePeriod(billId, pk){
  const pays = paysFor(billId, pk);
  if(!pays.length) return addPayment(billId, pk, {final:true});
  pays[pays.length - 1].final = true;
  pays[pays.length - 1].updatedAt = new Date().toISOString();
  save();
}
function setStatus(billId, pk, status){
  const b = billOf(billId);
  if(status === null){ clearPeriod(billId, pk); save(); return; }
  if(status === "paid"){
    const g = progressOf(b, pk);
    // part-paid already: settle at what's been paid rather than double-charging
    if(g.partial) return closePeriod(billId, pk);
    clearPeriod(billId, pk);
    return addPayment(billId, pk, {final:true});
  }
  clearPeriod(billId, pk);
  S.payments.push({
    id:uid(), billId, period:pk, status:"skipped",
    date: defaultDate(b, pk), amount:0, sourceId:b.sourceId, note:"",
    final:true, loggedAt:new Date().toISOString(), updatedAt:new Date().toISOString()
  });
  save();
}

/* ── calendar reminders ─────────────────────────────────────────────
   One recurring all-day event per bill, with an alarm. iOS Calendar then
   does the reminding — no service worker, no push server, and it rides
   iCloud to every device on its own.                                   */
const icsEsc = s => String(s == null ? "" : s)
  .replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\r?\n/g, "\\n");
/** RFC 5545 caps lines at 75 octets; continuations start with one space. */
function icsFold(line){
  const bytes = new TextEncoder().encode(line);
  if(bytes.length <= 73) return line;
  const out = [];
  let cur = "";
  for(const ch of line){                       // iterate code points, never split one
    if(new TextEncoder().encode(cur + ch).length > 72){ out.push(cur); cur = " " + ch; }
    else cur += ch;
  }
  if(cur) out.push(cur);
  return out.join("\r\n");
}
function icsRule(b){
  const d = b.dueDay;
  if(b.freq === "once")      return null;
  if(b.freq === "yearly")    return "FREQ=YEARLY;BYMONTH=" + (b.anchorM + 1) + ";BYMONTHDAY=" + d;
  const step = {monthly:1, quarterly:3, half:6}[b.freq] || 1;
  return "FREQ=MONTHLY" + (step > 1 ? ";INTERVAL=" + step : "") + ";BYMONTHDAY=" + d;
}
/** The day after a statement closes is when the bank's figure is freshest. */
const checkInDay = c => c.statementDay >= 28 ? 1 : c.statementDay + 1;
const stmtCards = () => activeCards().filter(c => c.statementDay > 0);
function buildICS(daysBefore, withCards){
  const now = new Date();
  const stamp = now.toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, "");
  // alarm fires at 09:00 local, `daysBefore` days ahead of the all-day start
  const offsetH = daysBefore * 24 - 9;
  const trigger = offsetH === 0 ? "PT0S" : (offsetH > 0 ? "-PT" + offsetH + "H" : "PT" + (-offsetH) + "H");

  const L = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Bill Ledger//EN",
             "CALSCALE:GREGORIAN", "METHOD:PUBLISH",
             "X-WR-CALNAME:Bill Ledger", "X-WR-TIMEZONE:" + (Intl.DateTimeFormat().resolvedOptions().timeZone || "UTC")];

  const bills = S.bills.filter(b => !b.archived);
  for(const b of bills){
    const first = dueDate(b, b.anchorY, b.anchorM);
    const dt = first.getFullYear() + pad(first.getMonth() + 1) + pad(first.getDate());
    const next = new Date(first); next.setDate(next.getDate() + 1);
    const dtEnd = next.getFullYear() + pad(next.getMonth() + 1) + pad(next.getDate());
    const src = srcOf(b.sourceId).name;
    const amt = b.amount ? money(b.amount, b.currency) : "amount varies";
    const rule = icsRule(b);
    // RFC 5545: DTSTART is a DATE value here, so UNTIL must be a DATE too —
    // a date-time UNTIL against a DATE start is rejected by strict parsers.
    const until = b.endYear ? ";UNTIL=" + b.endYear + "1231" : "";

    L.push("BEGIN:VEVENT");
    L.push("UID:bill-" + b.id + "@bill-ledger");
    L.push("DTSTAMP:" + stamp);
    L.push("DTSTART;VALUE=DATE:" + dt);
    L.push("DTEND;VALUE=DATE:" + dtEnd);
    if(rule) L.push("RRULE:" + rule + until);
    L.push(icsFold("SUMMARY:" + icsEsc(b.name + " — " + amt)));
    L.push(icsFold("DESCRIPTION:" + icsEsc(
      "Pay from " + src + "." + (b.note ? " " + b.note : "") +
      "\n" + FREQ[b.freq].label + " · added by Bill Ledger")));
    L.push("TRANSP:TRANSPARENT");
    L.push("BEGIN:VALARM");
    L.push("ACTION:DISPLAY");
    L.push(icsFold("DESCRIPTION:" + icsEsc(b.name + " — " + amt + " from " + src)));
    L.push("TRIGGER;RELATED=START:" + trigger);
    L.push("END:VALARM");
    L.push("END:VEVENT");
  }

  // one monthly check-in per card, the morning after its statement closes
  const cards = withCards ? stmtCards() : [];
  for(const c of cards){
    const day = checkInDay(c);
    const first = nextOnDay(day) || new Date();
    const dt = first.getFullYear() + pad(first.getMonth() + 1) + pad(first.getDate());
    const next = new Date(first); next.setDate(next.getDate() + 1);
    const dtEnd = next.getFullYear() + pad(next.getMonth() + 1) + pad(next.getDate());
    const title = "Update " + displayName(c) + " balance";
    L.push("BEGIN:VEVENT");
    L.push("UID:stmt-" + c.id + "@bill-ledger");
    L.push("DTSTAMP:" + stamp);
    L.push("DTSTART;VALUE=DATE:" + dt);
    L.push("DTEND;VALUE=DATE:" + dtEnd);
    L.push("RRULE:FREQ=MONTHLY;BYMONTHDAY=" + day);
    L.push(icsFold("SUMMARY:" + icsEsc(title)));
    L.push(icsFold("DESCRIPTION:" + icsEsc(
      "The statement closed yesterday, so the card app's balance is fresh. " +
      "In Bill Ledger: Cards → " + displayName(c) + " → Update balance. " +
      "It shows anything you forgot to log.\nAdded by Bill Ledger")));
    L.push("TRANSP:TRANSPARENT");
    L.push("BEGIN:VALARM");
    L.push("ACTION:DISPLAY");
    L.push(icsFold("DESCRIPTION:" + icsEsc(title + " — statement just closed")));
    L.push("TRIGGER;RELATED=START:PT9H");
    L.push("END:VALARM");
    L.push("END:VEVENT");
  }
  L.push("END:VCALENDAR");
  return {text: L.join("\r\n") + "\r\n", count: bills.length + cards.length,
          bills: bills.length, cards: cards.length};
}
async function doCalendar(){
  const sel = $("#remWhen");
  const daysBefore = sel ? parseInt(sel.value, 10) : 1;
  const rc = $("#remCards");
  const {text, count} = buildICS(daysBefore, !rc || rc.checked);
  if(!count) return toast("No bills to remind you about yet");
  const name = "bill-ledger-reminders.ics";
  const file = new File([text], name, {type:"text/calendar"});
  try{
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:"Bill Ledger reminders"});
      return toast("Choose Calendar to add " + count + " reminders", 3600);
    }
  }catch(err){
    if(err && err.name === "AbortError") return;
  }
  try{
    const url = URL.createObjectURL(new Blob([text], {type:"text/calendar"}));
    const a = document.createElement("a");
    a.href = url; a.download = name; a.rel = "noopener";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    toast(count + " reminders saved — open the file to add them", 3600);
  }catch(e){ toast("Could not create the calendar file here"); }
}

/* ── GitHub sync ────────────────────────────────────────────────────
   Writes the ledger back to one file in a PRIVATE repo on every change.
   The token is held under its own key, never inside S, so it can never
   end up inside an exported or synced backup.                          */
const TOKEN_KEY = "billLedger.token";
const getToken = () => { try{ return localStorage.getItem(TOKEN_KEY) || ""; }catch(e){ return ""; } };
const setToken = t => {
  try{ t ? localStorage.setItem(TOKEN_KEY, t) : localStorage.removeItem(TOKEN_KEY); }catch(e){}
};

function b64enc(str){
  const bytes = new TextEncoder().encode(str);
  let bin = "";
  for(let i = 0; i < bytes.length; i += 0x8000)
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
const b64dec = b =>
  new TextDecoder().decode(Uint8Array.from(atob(String(b).replace(/\s/g, "")), c => c.charCodeAt(0)));

function syncCfg(){
  return S.sync || (S.sync = {on:false, owner:"", repo:"", path:"bill-ledger.json",
                              sha:null, at:null, err:null});
}
const syncReady = () => {
  const c = syncCfg();
  return !!(c.on && c.owner && c.repo && getToken());
};
/** What actually gets written — no sync config, no token, ever. */
function payload(){
  const {sync, ...rest} = S;
  // `quick` is what the iPhone Shortcut reads to list your cards; it is
  // derived on every write and ignored on the way back in
  return JSON.stringify({...rest, quick:quickInfo(), exportedAt:new Date().toISOString()}, null, 2);
}
function ghErr(status){
  if(status === 401) return "Token rejected — it may have expired";
  if(status === 403) return "Token lacks Contents write access to that repo";
  if(status === 404) return "Repo or file path not found — check owner/repo";
  if(status === 409) return "The file changed on GitHub — tap Sync now";
  if(status === 422) return "GitHub rejected the update";
  return "GitHub error " + status;
}
async function ghReq(method, body, path){
  const c = syncCfg();
  const url = "https://api.github.com/repos/" + encodeURIComponent(c.owner) + "/" +
              encodeURIComponent(c.repo) + "/contents/" +
              (path || c.path).split("/").map(encodeURIComponent).join("/");
  const headers = {
    "Authorization": "Bearer " + getToken(),
    "Accept": "application/vnd.github+json",
    "X-GitHub-Api-Version": "2022-11-28"
  };
  if(body) headers["Content-Type"] = "application/json";
  try{
    return await fetch(url, {method, headers, body: body ? JSON.stringify(body) : undefined});
  }catch(e){
    throw new Error(navigator.onLine === false
      ? "Offline — changes are saved here and will sync later"
      : "Can't reach GitHub from this page");
  }
}
async function syncPull(){
  const res = await ghReq("GET");
  if(res.status === 404) return {empty:true};
  if(!res.ok) throw new Error(ghErr(res.status));
  const j = await res.json();
  syncCfg().sha = j.sha;
  return {data: JSON.parse(b64dec(j.content))};
}
/* ── merging two copies of the ledger ───────────────────────────────
   Phone, Safari and Mac each hold a copy. Replacing one with the other
   loses whatever the older side added, so the two are merged record by
   record instead. Each device keeps a fingerprint of every record as of
   its last successful sync (the "base"); against it a three-way merge can
   tell an addition from a deletion, and an edit on one side from an edit
   on both. Only a record edited on both sides falls back to the newer
   copy. The base never leaves this device.                             */
const COLLS = ["sources","bills","payments","cards","spends","statements","loans","accounts"];
const BASE_KEY = "billLedger.syncBase";
function recHash(r){
  const t = JSON.stringify(r, Object.keys(r).sort());   // records are flat
  let h = 5381;
  for(let i = 0; i < t.length; i++) h = ((h * 33) ^ t.charCodeAt(i)) >>> 0;
  return h.toString(36) + "." + t.length.toString(36);
}
function snapshotOf(d){
  const out = {};
  for(const k of COLLS){ out[k] = {}; for(const r of d[k] || []) out[k][r.id] = recHash(r); }
  return out;
}
const sameSnapshot = (a, b) => JSON.stringify(snapshotOf(a)) === JSON.stringify(snapshotOf(b));
function loadBase(){ try{ return JSON.parse(localStorage.getItem(BASE_KEY) || "null"); }catch(e){ return null; } }
function saveBase(d){ try{ localStorage.setItem(BASE_KEY, JSON.stringify(snapshotOf(d))); }catch(e){} }
/** This device's ledger in the same sanitised shape the remote arrives in. */
const localCanon = () => sanitize(JSON.parse(payload()));

function mergeLedgers(L, R, base){
  const localNewer = (L.updatedAt || 0) >= (R.updatedAt || 0);
  const N = localNewer ? L : R, O = localNewer ? R : L;
  const out = Object.assign({}, N);
  let conflicts = 0;
  for(const k of COLLS){
    const lm = new Map((L[k] || []).map(r => [r.id, r]));
    const rm = new Map((R[k] || []).map(r => [r.id, r]));
    const nm = localNewer ? lm : rm;
    const b = base && base[k];
    // newer copy's order first, then anything only the older copy has
    const ids = [...(N[k] || []).map(r => r.id), ...(O[k] || []).map(r => r.id).filter(id => !nm.has(id))];
    const res = [];
    for(const id of ids){
      const l = lm.get(id), r = rm.get(id), bh = b ? b[id] : undefined;
      if(l && r){
        const hl = recHash(l), hr = recHash(r);
        if(hl === hr || hr === bh) res.push(l);        // same, or only this side changed it
        else if(hl === bh) res.push(r);                // only the other side changed it
        else { res.push(localNewer ? l : r); conflicts++; }
      }else{
        const only = l || r;
        // it was there at the last sync and one side has since deleted it;
        // the deletion stands unless the surviving copy was edited after
        if(bh !== undefined && recHash(only) === bh) continue;
        res.push(only);
      }
    }
    out[k] = res;
  }
  out.cardAlias = Object.assign({}, O.cardAlias || {}, N.cardAlias || {});
  out.updatedAt = Math.max(L.updatedAt || 0, R.updatedAt || 0);
  return {data:out, conflicts};
}

async function syncPush(){
  const c = syncCfg();
  // Refuse to replace a remote that exists with a ledger holding nothing.
  // Emptying it deliberately goes through Reset, which sets the override.
  if(isPristine() && c.sha && !S.allowEmptyPush){
    c.err = "Refused to overwrite your synced data with an empty ledger";
    return;
  }
  let sent = payload();
  const body = {
    message: "Ledger update — " + new Date().toISOString().slice(0, 16).replace("T", " "),
    content: b64enc(sent)
  };
  if(c.sha) body.sha = c.sha;
  let res = await ghReq("PUT", body);
  if(res.status === 409 || res.status === 422){
    // another device wrote since we last read: merge its copy in, then retry
    // once — never overwrite it, which is how entries used to vanish
    const cur = await ghReq("GET");
    if(cur.ok){
      const j0 = await cur.json();
      body.sha = c.sha = j0.sha;
      const m = mergeLedgers(localCanon(), sanitize(JSON.parse(b64dec(j0.content))), loadBase());
      adopt(m.data);
      S.updatedAt = Date.now();
      saveLocal();
      sent = payload();
      body.content = b64enc(sent);
      res = await ghReq("PUT", body);
    }
  }
  if(!res.ok) throw new Error(ghErr(res.status));
  const j = await res.json();
  saveBase(sanitize(JSON.parse(sent)));         // exactly what GitHub now holds
  c.sha = j.content.sha;
  c.at  = new Date().toISOString();
  c.err = null;
  S.lastBackup = {at:c.at, sig:signature()};
}
/** After the data underneath changes, drop filters that no longer resolve —
    otherwise the month reads "Nothing due" for no visible reason. */
function resetStaleFilters(){
  if(UI.src !== "all" && !S.sources.some(s => s.id === UI.src)) UI.src = "all";
  if(UI.cur !== "all" && !S.bills.some(b => b.currency === UI.cur)) UI.cur = "all";
}

function adopt(d){
  const c = sanitize(d);              // remote data is untrusted
  Object.assign(S, {
    version:1,
    sources: c.sources, bills: c.bills, payments: c.payments,
    cards: c.cards, spends: c.spends, statements: c.statements,
    loans: c.loans, accounts: c.accounts, cardAlias: c.cardAlias,
    startPeriod: c.startPeriod, viewMode: c.viewMode,
    theme: c.theme, updatedAt: c.updatedAt
  });
  resetStaleFilters();
  applyTheme();
}

let syncTimer = null, syncing = false;
function scheduleSync(){
  if(!syncReady()) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(() => runSync(true), 2500);
}
async function runSync(quiet){
  if(syncing || !syncReady()) return;
  syncing = true; render();
  try{ await syncPush(); }
  catch(e){ syncCfg().err = e.message; if(!quiet) toast(e.message, 3600); }
  syncing = false;
  saveLocal(); render();
  // only refresh the data sheet if that is genuinely what is on screen —
  // a background sync must never replace a sheet the user is working in
  if(UI.sheet === "data" && $("#sheet").classList.contains("on")) openData();
}
/** On open: merge this device's copy with GitHub's, push if that changed
 *  GitHub's, and remember the result as the new base. */
async function syncBoot(){
  if(!syncReady() || syncing) return;
  UI.lastBoot = Date.now();
  syncing = true; render();
  try{
    const r = await syncPull();
    let pushed = false;
    if(r.empty){
      if(!isPristine()){ await syncPush(); pushed = true; }   // never create a remote from nothing
    }else{
      const d = r.data;
      const remoteHas = (d.bills || []).length || (d.cards || []).length ||
                        (d.payments || []).length || (d.loans || []).length ||
                        (d.accounts || []).length;
      const remoteAt = d.updatedAt || 0, localAt = S.updatedAt || 0;
      // A local ledger with nothing in it always loses, whatever the clocks say.
      if(isPristine() && remoteHas){
        adopt(d);
        S.pristine = false;
        S.lastBackup = {at:new Date().toISOString(), sig:signature()};
        saveBase(sanitize(d));
      }else if(remoteAt !== localAt || !sameSnapshot(localCanon(), sanitize(d))){
        const R = sanitize(d);
        const m = mergeLedgers(localCanon(), R, loadBase());
        if(!sameSnapshot(m.data, localCanon())) adopt(m.data);
        if(!sameSnapshot(m.data, R)){
          S.updatedAt = Math.max(Date.now(), remoteAt + 1);   // the merge is the newest copy
          await syncPush(); pushed = true;
        }else{
          S.updatedAt = remoteAt;
          saveBase(R);
          S.lastBackup = {at:new Date().toISOString(), sig:signature()};
        }
      }else{
        saveBase(sanitize(d));
        S.lastBackup = {at:new Date().toISOString(), sig:signature()};
      }
      // a remote written before the shortcut existed has no card list for it
      if(!pushed && !isPristine() &&
         JSON.stringify(d.quick || null) !== JSON.stringify(quickInfo())) await syncPush();
    }
    syncCfg().err = null;
    await pullInbox();
  }catch(e){ syncCfg().err = e.message; }
  syncing = false;
  saveLocal(); render();
}

/* ── sheet ──────────────────────────────────────────────────────── */
function openSheet(billId, period){
  UI.sheet = "bill";
  UI.billId = billId;
  UI.sheetPeriod = period || periodKey(UI.y, UI.m);
  renderSheet();
  $("#scrim").classList.add("on");
  $("#sheet").classList.add("on");
}
function closeSheet(){
  if(UI.loanDraft){
    const l = loanOf(UI.loanId);
    if(l && !l.name.trim() && !l.balance) S.loans = S.loans.filter(x => x.id !== l.id), save();
    UI.loanDraft = false;
  }
  if(UI.acctDraft){
    const a = S.accounts.find(x => x.id === UI.acctId);
    if(a && !a.name.trim() && !a.bank.trim() && !a.balance)
      S.accounts = S.accounts.filter(x => x.id !== a.id), save();
    UI.acctDraft = false;
  }
  if(UI.cardDraft){
    const c = cardOf(UI.cardId);
    if(c && !c.name.trim()){ S.cards = S.cards.filter(x => x.id !== c.id); save(); }
    UI.cardDraft = false;
  }
  if(UI.draft){
    const b = billOf(UI.billId);
    if(b && !b.name.trim()){
      S.bills.splice(S.bills.indexOf(b), 1);
      S.payments = S.payments.filter(p => p.billId !== b.id);
      save();
    }
    UI.draft = false;
  }
  $("#scrim").classList.remove("on");
  $("#sheet").classList.remove("on");
  UI.billId = null; UI.cardId = null; UI.acctId = null; UI.loanId = null; UI.sheet = null;
  const done = $("#sheetDone"); done.textContent = "Done"; done.classList.remove("save"); done.disabled = false;
  if(document.activeElement && document.activeElement.blur) document.activeElement.blur();
  render();
}

function renderSheet(){
  const b = billOf(UI.billId);
  if(!b) return closeSheet();
  const pk = UI.sheetPeriod;
  const [py, pm] = pk.split("-").map(Number);
  const ownerCard = S.cards.find(x => x.billId === b.id && !x.archived);
  const gp = progressOf(b, pk);
  const paysThis = paysFor(b.id, pk).filter(x => x.status === "paid");
  const due = dueDate(b, py, pm-1);

  $("#sheetTitle").textContent = b.name || "New bill";

  const srcOptions = S.sources.map(s =>
    '<option value="' + esc(s.id) + '"' + (s.id === b.sourceId ? " selected" : "") + '>' +
    esc(s.name) + '</option>').join("");
  const srcOptionsBill = S.sources.map(s =>
    '<option value="' + esc(s.id) + '"' + (s.id === b.sourceId ? " selected" : "") + '>' + esc(s.name) + '</option>').join("");
  const freqOptions = Object.entries(FREQ).map(([k,v]) =>
    '<option value="' + k + '"' + (k === b.freq ? " selected" : "") + '>' + v.label + '</option>').join("");
  const dayOptions = Array.from({length:31}, (_,i) =>
    '<option value="' + (i+1) + '"' + (i+1 === b.dueDay ? " selected" : "") + '>' + (i+1) + '</option>').join("");

  /* per-bill history + sparkline */
  const hist = S.payments.filter(x => x.billId === b.id)
    .sort((a,c) => c.period.localeCompare(a.period));
  const byPeriod = new Map();
  for(const x of hist){
    if(x.status !== "paid") continue;
    byPeriod.set(x.period, (byPeriod.get(x.period) || 0) + (x.amount || 0));
  }
  const paid = [...byPeriod.entries()].filter(([,v]) => v > 0)
    .sort((a,c) => a[0].localeCompare(c[0])).slice(-12)
    .map(([period, amount]) => ({period, amount}));
  const max = Math.max(1, ...paid.map(x => x.amount));
  const spark = paid.length >= 2
    ? '<div class="spark">' + paid.map(x =>
        '<i style="height:' + Math.max(8, (x.amount / max) * 100) + '%" title="' +
        esc(x.period) + ' · ' + money(x.amount, b.currency) + '"></i>').join("") + '</div>' +
      '<div class="spark-note">Last ' + paid.length + ' payments · high ' + money(max, b.currency) + '</div>'
    : "";
  const histRows = hist.length
    ? '<div class="mini">' + hist.slice(0,24).map(x => {
        const s = srcOf(x.sourceId);
        return '<div class="mini-row"><span class="d num">' + shortDate(x.date) + " '" + esc(x.date.slice(2,4)) +
          '</span><i class="dot" style="background:' + esc(s.color) + '"></i><span>' + esc(s.name) + '</span>' +
          '<span class="a num ' + (x.status === "paid" ? "" : "sk") + '">' +
          (x.status === "paid" ? money(x.amount, b.currency) : "skipped") + '</span></div>';
      }).join("") + '</div>'
    : '<div class="hint">No payments recorded yet.</div>';

  $("#sheetBody").innerHTML =
    /* ── this period ── */
    '<div class="sec">' +
      '<span class="eyebrow">' + MONTHS[pm-1] + ' ' + py + ' &middot; due ' + MON3[pm-1] + ' ' + due.getDate() + '</span>' +
      (gp.skipped
        ? '<div class="bstat clean"><i class="dot" style="background:var(--muted)"></i>' +
          '<span>Skipped this month</span></div>'
        : '<div class="paystate ' + (gp.done ? "done" : (gp.partial || gp.scheduled) ? "part" : "open") + '">' +
            '<div class="paystate-top">' +
              '<span>' + (gp.done ? "Settled"
                          : gp.scheduled > 0 ? "Arranged for " + shortDate(gp.nextDate)
                          : gp.partial ? "Still owed" : "To pay") + '</span>' +
              '<b class="num">' + money(gp.done ? gp.paid : gp.scheduled > 0 ? gp.scheduled : gp.left, b.currency) + '</b></div>' +
            (gp.target ? '<span class="pbar big"><i style="width:' +
              Math.min(100, gp.target ? (gp.paid / gp.target) * 100 : 0).toFixed(1) + '%"></i></span>' : '') +
            '<div class="paystate-sub">' +
              (gp.scheduled > 0 && !gp.paid
                ? 'Nothing deducted until ' + shortDate(gp.nextDate) + ' — change the date below to move it'
                : gp.n
                ? money(gp.paid, b.currency) + ' paid over ' + gp.n + ' payment' +
                  (gp.n === 1 ? '' : 's') +
                  (gp.target ? ' of ' + money(gp.target, b.currency) : '') +
                  (gp.scheduled > 0 ? ' · ' + money(gp.scheduled, b.currency) + ' arranged' : '')
                : 'Nothing recorded yet' + (gp.target ? ' · ' + money(gp.target, b.currency) + ' expected' : '')) +
            '</div></div>') +

      // every payment this month, each editable and removable
      (paysThis.length

    '</div>';

  wireSheet(b, pk);
}

function wireSheet(b, pk){
  const body = $("#sheetBody");
  const reflow = () => { renderSheet(); render(); };
  const patch  = () => { save(); render(); };

  const on = (id, ev, fn) => { const el = body.querySelector(id); if(el) el[ev] = fn; };

  // one row per payment: edit in place, no re-render so focus is never stolen
  body.querySelectorAll(".payrow").forEach(row => {
    const rec = S.payments.find(x => x.id === row.dataset.pay);
    if(!rec) return;
    row.querySelectorAll("[data-pf]").forEach(inp => {
      inp.onchange = e => {
        const f = inp.dataset.pf;
        if(f === "amount") rec.amount = Math.max(0, parseFloat(e.target.value) || 0);
        else if(f === "date") rec.date = e.target.value || rec.date;
        else rec[f] = e.target.value;
        rec.updatedAt = new Date().toISOString();
        save();
        renderSheet();   // totals above the list have to follow the edit
        render();
      };
    });
  });
  body.querySelectorAll("[data-delpay]").forEach(btn => btn.onclick = () => {
    const id = btn.dataset.delpay;
    S.payments = S.payments.filter(x => x.id !== id);
    save(); reflow();
  });

  on("#addPay", "onclick", () => {
    const g = progressOf(b, pk);
    // suggest whatever is still owed, so the common case is one tap
    addPayment(b.id, pk, {amount: g.left > 0 ? g.left : 0, final:false});
    reflow();
  });
  on("#arrangePay", "onclick", () => {
    arrangePayment(b, pk);
    reflow();
    toast("Arranged for tomorrow — change the date below", 3800);
  });
  on("#settlePay", "onclick", () => { setStatus(b.id, pk, "paid"); reflow(); });
  on("#reopenPay", "onclick", () => {
    paysFor(b.id, pk).forEach(x => { x.final = false; x.updatedAt = new Date().toISOString(); });
    save(); reflow();
  });
  on("#skipPay",   "onclick", () => { setStatus(b.id, pk, "skipped"); reflow(); });
  on("#unskipPay", "onclick", () => { setStatus(b.id, pk, null); reflow(); });

  on("#bName","onchange", e => { b.name = e.target.value.trim(); $("#sheetTitle").textContent = b.name || "New bill"; UI.draft = false; patch(); });
  on("#bAmt", "onchange", e => { b.amount = parseFloat(e.target.value) || 0; patch(); });
  on("#bCur", "onchange", e => { b.currency = e.target.value; patch(); });
  on("#bSrc", "onchange", e => { b.sourceId = e.target.value; patch(); });
  on("#bDay", "onchange", e => { b.dueDay = parseInt(e.target.value,10) || 1; patch(); });
  on("#bNote","onchange", e => { b.note = e.target.value.trim(); patch(); });
  on("#bFreq","onchange", e => {
    b.freq = e.target.value;
    if(b.freq !== "monthly" && b.anchorM === 0 && b.anchorY === 2026){
      b.anchorY = UI.y; b.anchorM = UI.m;   // anchor to the month being viewed
    }
    reflow();
  });
  on("#bAnchor","onchange", e => {
    const [y,m] = (e.target.value || "").split("-").map(Number);
    if(y && m){ b.anchorY = y; b.anchorM = m-1; }
    reflow();
  });
  on("#bEnd","onchange", e => {
    const v = parseInt(e.target.value,10);
    b.endYear = v && v > 1900 ? v : null; reflow();
  });

  on("#archBtn","onclick", () => { b.archived = !b.archived; save(); toast(b.archived ? "Archived" : "Restored"); closeSheet(); });
  on("#delBtn","onclick", () => {
    if(!confirm('Delete "' + (b.name || "this bill") + '" and all ' +
       S.payments.filter(x => x.billId === b.id).length + ' recorded payments?')) return;
    S.bills.splice(S.bills.indexOf(b), 1);
    S.payments = S.payments.filter(x => x.billId !== b.id);
    UI.draft = false; save(); toast("Deleted"); closeSheet();
  });
}

/* ── loans ──────────────────────────────────────────────────────────
   A loan has a balance and an APR but no credit limit, so it stays out
   of anything about utilisation or room to spend. It very much belongs
   in what the debt costs to carry — a personal loan is often the most
   expensive thing on the list.                                        */
const activeLoans = () => S.loans.filter(l => !l.archived);
const loanOf = id => S.loans.find(l => l.id === id);

function loanState(l){
  const t = new Date(); t.setHours(0,0,0,0);
  const conf = l.confirmedAt ? new Date(l.confirmedAt + "T00:00:00") : null;
  const age  = conf ? Math.max(0, daysBetween(conf, t)) : null;
  const repaid = l.billId
    ? S.payments.filter(p => p.billId === l.billId && p.status === "paid" &&
                             !isScheduled(p) && afterConfirm(l, p))
                .reduce((n,p) => n + (p.amount || 0), 0)
    : 0;
  const interest = (l.apr && age) ? (l.balance || 0) * (l.apr / 100 / 365) * age : 0;
  const estimate = Math.max(0, (l.balance || 0) + interest - repaid);
  const fresh = age == null ? "never" : age <= 31 ? "fresh" : age <= 62 ? "aging" : "stale";
  return {
    estimate, interest, repaid, age, fresh,
    confirmed: l.balance || 0,
    monthly: (estimate * (l.apr || 0) / 100) / 12,
    shaky: !l.confirmedAt || fresh === "stale",
    moved: repaid > 0 || interest >= 1
  };
}

/* ── cash on hand ───────────────────────────────────────────────────
   Not net worth — just what is actually available to pay cards with.
   Same confirmed-plus-movements model as a card: the balance you last
   read from the bank, then everything recorded since.                 */
const acctOf = id => S.accounts.find(a => a.id === id);

/** Which account a payment source draws on. An explicit link wins; failing
 *  that a name match, so a source called SoFi finds "SoFi Checking" without
 *  anyone having to wire it up first. That indirection being unset silently
 *  is why payments were not reducing any balance. */
function accountForSource(sourceId){
  if(!sourceId) return null;
  const explicit = S.accounts.find(a => S.sources.some(x => x.id === sourceId && x.accountId === a.id));
  if(explicit) return explicit;
  const src = S.sources.find(x => x.id === sourceId);
  if(!src || !src.name) return null;
  const want = src.name.trim().toLowerCase();
  return S.accounts.find(a =>
    (a.bank || "").trim().toLowerCase() === want ||
    (a.name || "").trim().toLowerCase() === want ||
    ((a.bank || "") + " " + (a.name || "")).trim().toLowerCase().includes(want)) || null;
}
/** True when the link is inferred rather than set, so the UI can say so. */
function sourceLinkIsGuess(sourceId){
  const src = S.sources.find(x => x.id === sourceId);
  return !!(src && !src.accountId && accountForSource(sourceId));
}

function accountState(a){
  const t = new Date(); t.setHours(0,0,0,0);
  const conf = a.confirmedAt ? new Date(a.confirmedAt + "T00:00:00") : null;
  const age  = conf ? Math.max(0, daysBetween(conf, t)) : null;

  const moves = acctMoves(a.id);
  const out = moves.filter(m => m.dir !== "in").reduce((n,m) => n + (m.amount || 0), 0);
  const inn = moves.filter(m => m.dir === "in").reduce((n,m) => n + (m.amount || 0), 0);

  // bills paid from a source that draws on this account
  const srcIds = S.sources.filter(s => {
    const acct = accountForSource(s.id);
    return acct && acct.id === a.id;
  }).map(s => s.id);
  const paidOut = srcIds.length
    ? S.payments.filter(p => p.status === "paid" && srcIds.includes(p.sourceId) &&
                             !isScheduled(p) && afterConfirm(a, p))
                .reduce((n,p) => n + (p.amount || 0), 0)
    : 0;

  const estimate = (a.balance || 0) - out + inn - paidOut;
  return {
    confirmed:a.balance || 0, estimate, out, inn, paidOut, age,
    linkedSources: srcIds.length,
    moved: out > 0 || inn > 0 || paidOut > 0,
    shaky: !a.confirmedAt || (age != null && age > 7)
  };
}
/** What is actually spendable now, after everything recorded since the read. */
function cashFor(cur){
  return S.accounts.filter(a => a.currency === cur)
                   .reduce((n,a) => n + accountState(a).estimate, 0);
}
function cashAge(cur){
  const list = S.accounts.filter(a => a.currency === cur && a.confirmedAt);
  if(!list.length) return null;
  const t = new Date(); t.setHours(0,0,0,0);
  return Math.max(...list.map(a => daysBetween(new Date(a.confirmedAt + "T00:00:00"), t)));
}

/* ── utilisation coaching ───────────────────────────────────────────
   Arithmetic, not advice: given an amount you are willing to put on the
   cards, work out the split that buys the most utilisation improvement,
   and say what it does to the number. Thresholds first (over-limit, then
   80%, then 30% overall), because those are where the damage sits.     */
const UTIL_GOOD = 0.30, UTIL_TIGHT = 0.80;

function coachPlan(cur, budget, mode){
  mode = mode || S.payMode || "score";
  const rows = activeCards()
    .filter(c => c.currency === cur && c.limit > 0)
    .map(c => { const s = cardState(c); return {c, bal:s.estimate, limit:s.limit, util:s.util, apr:c.apr || 0}; });
  if(!rows.length) return null;

  const limitSum = rows.reduce((n,r) => n + r.limit, 0);
  const startBal = rows.reduce((n,r) => n + r.bal, 0);
  const startMax = rows.reduce((n,r) => Math.max(n, r.limit ? r.bal / r.limit : 0), 0);
  const pay = new Map();
  let cash = Math.max(0, budget);

  const put = (r, amt) => {
    amt = Math.min(amt, cash, r.bal);
    if(amt <= 0.5) return;
    pay.set(r.c.id, (pay.get(r.c.id) || 0) + amt);
    r.bal -= amt; cash -= amt;
  };
  // 1. anything over its limit — the only state that gets a card declined
  rows.filter(r => r.bal > r.limit).sort((a,b) => (b.bal-b.limit) - (a.bal-a.limit))
      .forEach(r => put(r, r.bal - r.limit));
  // 2. down to 80%, worst first
  rows.filter(r => r.bal > r.limit * UTIL_TIGHT).sort((a,b) => b.bal/b.limit - a.bal/a.limit)
      .forEach(r => put(r, r.bal - r.limit * UTIL_TIGHT));
  // Past that point the two goals genuinely diverge, so the caller picks.
  if(mode === "score"){
    // 3. keep buying down the worst percentage until overall is under 30%
    let guard = 0;
    while(cash > 0.5 && rows.reduce((n,r) => n + r.bal, 0) > limitSum * UTIL_GOOD && guard++ < 200){
      const r = rows.filter(x => x.bal > 0).sort((a,b) => b.bal/b.limit - a.bal/a.limit)[0];
      if(!r) break;
      const need = rows.reduce((n,x) => n + x.bal, 0) - limitSum * UTIL_GOOD;
      put(r, Math.min(need, Math.max(1, r.bal - r.limit * UTIL_GOOD) || r.bal));
    }
  }
  // 4. remainder goes where the debt costs most to carry — loans included,
  //    since a personal loan is often dearer than any of the cards
  const loanRows = activeLoans().filter(l => l.currency === cur)
    .map(l => { const s = loanState(l);
      return {c:{id:l.id, name:l.name}, kind:"loan", bal:s.estimate, limit:0, apr:l.apr || 0}; })
    .filter(r => r.bal > 0);
  if(cash > 0.5)
    [...rows, ...loanRows].filter(r => r.bal > 0)
      .sort((a,b) => b.apr - a.apr)
      .forEach(r => put(r, r.bal));

  const endBal = rows.reduce((n,r) => n + r.bal, 0);
  // what the split takes off the yearly interest bill
  const all = [...rows, ...loanRows];
  const saved = [...pay.entries()].reduce((n,[id,amt]) => {
    const r = all.find(x => x.c.id === id);
    return n + amt * (r ? r.apr : 0) / 100;
  }, 0);
  // a dollar paid anywhere moves the overall number identically, so what
  // actually separates the two strategies is the worst single card
  const maxUtil = rows.reduce((n,r) => Math.max(n, r.limit ? r.bal / r.limit : 0), 0);
  return {
    cur, limitSum, mode, saved, maxUtil, startMax,
    startUtil: limitSum ? startBal / limitSum : 0,
    endUtil:   limitSum ? endBal   / limitSum : 0,
    spent: Math.max(0, budget) - cash, leftover: cash,
    steps: all.filter(r => pay.get(r.c.id))
              .map(r => ({
                name:r.c.name, amount:pay.get(r.c.id), kind:r.kind || "card",
                from:r.limit ? Math.round((r.bal + pay.get(r.c.id)) / r.limit * 100) : null,
                to:  r.limit ? Math.round(r.bal / r.limit * 100) : null
              }))
              // worst card first, loans after (they have no percentage to fix)
              .sort((a,b) => (b.from == null ? -1 : b.from) - (a.from == null ? -1 : a.from)),
    overLimit: rows.filter(r => r.bal > r.limit).length
  };
}

/** Everything you owe in one currency, dearest to carry first.
 *  Cards and loans together — the ordering question is the same for both. */
function payoffOrder(cur){
  const cards = activeCards().filter(c => c.currency === cur)
    .map(c => { const s = cardState(c);
      return {id:c.id, kind:"card", name:c.name, bal:s.estimate, apr:c.apr || 0, monthly:s.monthly ||
               (s.estimate * (c.apr || 0) / 100) / 12}; });
  const loans = activeLoans().filter(l => l.currency === cur)
    .map(l => { const s = loanState(l);
      return {id:l.id, kind:"loan", name:l.name, bal:s.estimate, apr:l.apr || 0, monthly:s.monthly}; });
  return [...cards, ...loans]
    .filter(r => r.bal > 0)
    .sort((a,b) => b.apr - a.apr || b.bal - a.bal);
}

/* ── snapshot for an AI ─────────────────────────────────────────────
   Compact markdown rather than raw JSON: an LLM reads a table far more
   reliably than a nested object, and it costs a fraction of the tokens.
   Derived figures are included so nothing has to be recomputed.       */
function aiSnapshot(){
  const L = [];
  const d = new Date();
  const plain = (n, cur) => (cur === "INR" ? "₹" : "$") +
    Math.round(n).toLocaleString(cur === "INR" ? "en-IN" : "en-US");

  L.push("# Money snapshot — " + d.toDateString());
  L.push("");

  for(const [cur, list] of cardGroups()){
    const rows = list.map(c => [c, cardState(c)]);
    L.push("## Credit cards (" + (cur === "INR" ? "INR" : "USD") + ")");
    L.push("");
    L.push("| Card | Limit | Confirmed bal | Est. today | Available | Used | APR | Min pay | Stmt day | Confirmed | Paid by bill |");
    L.push("|---|---|---|---|---|---|---|---|---|---|---|");
    for(const [c,s] of rows){
      const bill = c.billId ? (S.bills.find(b => b.id === c.billId) || {}).name : null;
      L.push("| " + [
        c.name,
        s.limit ? plain(s.limit, cur) : "—",
        plain(s.confirmed, cur),
        plain(s.estimate, cur),
        s.avail == null ? "—" : (s.avail < 0 ? "OVER by " + plain(-s.avail, cur) : plain(s.avail, cur)),
        s.util == null ? "—" : Math.round(s.util * 100) + "%",
        c.apr ? c.apr + "%" : "—",
        c.minPayment ? plain(c.minPayment, cur) : "—",
        c.statementDay || "—",
        !c.confirmedAt ? "never" : s.age === 0 ? "today" : s.age + "d ago",
        bill || "not linked"
      ].join(" | ") + " |");
    }
    const lim = rows.reduce((n,[,s]) => n + s.limit, 0);
    const bal = rows.reduce((n,[,s]) => n + s.estimate, 0);
    L.push("");
    L.push("Totals: limit " + plain(lim, cur) + " · owed " + plain(bal, cur) +
           " · available " + plain(Math.max(0, lim - bal), cur) +
           (lim ? " · overall utilisation " + Math.round((bal / lim) * 100) + "%" : ""));
    L.push("");

    const cash = cashFor(cur);
    if(S.accounts.some(a => a.currency === cur)){
      L.push("### Cash available (" + cur + ")");
      L.push("");
      for(const a of S.accounts.filter(x => x.currency === cur))
        L.push("- " + (a.bank ? a.bank + " " : "") + a.name + ": " + plain(a.balance || 0, cur) +
               (a.confirmedAt ? " (checked " + a.confirmedAt + ")" : ""));
      L.push("");
      L.push("Total cash: " + plain(cash, cur));
      L.push("");
    }

    const plan = coachPlan(cur, S.payBudget && S.payBudget[cur] != null ? S.payBudget[cur] : cash);
    if(plan && plan.steps.length){
      L.push("### Suggested split of " + plain(plan.spent, cur) +
             " (utilisation " + Math.round(plan.startUtil*100) + "% → " + Math.round(plan.endUtil*100) + "%)");
      L.push("");
      for(const st of plan.steps)
        L.push("- " + st.name + ": " + plain(st.amount, cur) + "  (" + st.from + "% → " + st.to + "%)");
      L.push("");
    }
    const po = payoffOrder(cur);
    if(po.length){
      L.push("### Carrying cost, dearest first (" + cur + ")");
      L.push("");
      for(const r of po)
        L.push("- " + r.name + (r.kind === "loan" ? " (loan)" : "") + ": " +
               (r.apr ? r.apr + "% APR" : "APR unknown") +
               " on " + plain(r.bal, cur) + " ≈ " + plain(r.monthly, cur) + "/mo");
      L.push("");
      L.push("Total interest ≈ " + plain(po.reduce((n,r)=>n+r.monthly,0)*12, cur) + "/yr");
      L.push("");
    }
  }

  // this month's bills, so questions about cash flow have the numbers
  const list = billsFor(UI.y, UI.m);
  if(list.length){
    const pk = periodKey(UI.y, UI.m);
    L.push("## Bills — " + MONTHS[UI.m] + " " + UI.y);
    L.push("");
    L.push("| Bill | Due | Amount | Paid from | Status |");
    L.push("|---|---|---|---|---|");
    for(const b of list){
      const st = stateOf(b, UI.y, UI.m), g = progressOf(b, pk);
      L.push("| " + [
        b.name, MON3[UI.m] + " " + Math.min(b.dueDay, daysIn(UI.y, UI.m)),
        b.amount ? plain(b.amount, b.currency) : "varies",
        srcOf(b.sourceId).name,
        st === "paid" ? "paid" : st === "skipped" ? "nothing owed"
          : st === "partial" ? "part-paid " + plain(g.paid, b.currency) + ", " + plain(g.left, b.currency) + " left"
          : st === "missed" ? "OVERDUE" : "due"
      ].join(" | ") + " |");
    }
    L.push("");
  }

  if(activeLoans().length){
    L.push("## Loans");
    L.push("");
    L.push("| Loan | Lender | Balance | APR | Interest/mo | Monthly payment | Confirmed | Paid by bill |");
    L.push("|---|---|---|---|---|---|---|---|");
    for(const l of activeLoans()){
      const s = loanState(l);
      const bill = l.billId ? (S.bills.find(b => b.id === l.billId) || {}).name : null;
      L.push("| " + [
        l.name, l.lender || "—", plain(s.estimate, l.currency),
        l.apr ? l.apr + "%" : "—", plain(s.monthly, l.currency),
        l.minPayment ? plain(l.minPayment, l.currency) : "—",
        !l.confirmedAt ? "never" : s.age === 0 ? "today" : s.age + "d ago",
        bill || "not linked"
      ].join(" | ") + " |");
    }
    L.push("");
  }

  L.push("## How to read this");
  L.push("- **Confirmed bal** is what the card app last showed, on the date given.");
  L.push("- **Est. today** adds estimated interest since then plus anything logged. It is an estimate, not a statement figure.");
  L.push("- Utilisation above 30% is generally treated as weighing on credit scoring; above 80% is close to declining.");
  L.push("");
  L.push("## Questions worth asking");
  L.push("- Which card should I put a payment on first, and what does that save?");
  L.push("- If I have a fixed amount spare this month, how should I split it?");
  L.push("- Which cards are hurting my credit utilisation most, and what payment fixes that?");
  L.push("- Does anything here look wrong or inconsistent?");
  return L.join("\n");
}

async function doCopyForAI(){
  const text = aiSnapshot();
  try{
    if(navigator.clipboard && window.isSecureContext){
      await navigator.clipboard.writeText(text);
      return toast("Copied — paste it into any AI chat", 3200);
    }
  }catch(e){ /* fall through */ }
  try{
    if(navigator.canShare && navigator.canShare({text})){
      await navigator.share({text}); return;
    }
  }catch(e){ if(e && e.name === "AbortError") return; }
  // last resort: show it so it can be selected by hand
  UI.sheet = "data";
  $("#sheetTitle").textContent = "Snapshot";
  $("#sheetBody").innerHTML =
    '<div class="sec"><div class="hint" style="margin-bottom:9px">Select all and copy.</div>' +
    '<textarea readonly id="aiOut" style="width:100%;min-height:50vh;font-family:var(--f-num);font-size:11.5px">' +
    esc(text) + '</textarea></div>';
  const ta = $("#aiOut"); ta.focus(); ta.select();
}

function wireCardSheet(c){
  const body = $("#sheetBody");
  const q = id => body.querySelector(id);
  const patch = () => { save(); render(); };
  const reflow = () => { renderCardSheet(); render(); };

  // Log a payment from the card, so a card can be run from one place. If it
  // is not in the monthly list yet, adding it there is part of the same tap.
  q("#cardPay").onclick = () => {
    const bill = ensureCardBill(c);
    if(!bill) return toast("Give the card a name first");
    const pk = periodKey(UI.y, UI.m);
    const g = progressOf(bill, pk);
    const suggest = g.left > 0 ? g.left : (c.minPayment || bill.amount || 0);
    const v = prompt("Payment on " + (c.name || "this card") + ":", String(Math.round(suggest * 100) / 100));
    if(v === null) return;
    const n = parseFloat(String(v).replace(/[^0-9.\-]/g, ""));
    if(!Number.isFinite(n) || n <= 0) return toast("Enter an amount");
    // final only when it clears the expected amount, so part-payments stay open
    addPayment(bill.id, pk, {amount:n,
      final: !(bill.amount > 0 && n < bill.amount - 0.005)});
    save(); reflow();
    toast("Logged — set a later date below to arrange it ahead", 3800);
  };

  q("#cardArrange").onclick = () => {
    const bill = ensureCardBill(c);
    if(!bill) return toast("Give the card a name first");
    arrangePayment(bill, periodKey(UI.y, UI.m));
    save(); reflow();
    toast("Arranged for tomorrow — change the date below", 3800);
  };

  q("#cardConfirm").onclick = () => {
    if(!c.name.trim()) return toast("Give the card a name first");
    UI.cardDraft = false;
    openBalanceUpdate("card", c.id, "card");
  };
  q("#cardSpend").onclick = () => {
    if(!c.name.trim()) return toast("Give the card a name first");
    UI.cardDraft = false;
    openQuick({mode:"card", cardId:c.id, back:{card:c.id}});
  };

  q("#cName").onchange  = e => {
    c.name = e.target.value.trim();
    const b = cardBill(c);
    if(b && c.name) b.name = c.name;          // one name, not two
    $("#sheetTitle").textContent = c.name || "New card"; patch();
  };
  q("#cLimit").onchange = e => { c.limit = Math.max(0, parseFloat(e.target.value) || 0); reflow(); patch(); };
  q("#cCur").onchange   = e => { c.currency = e.target.value; reflow(); patch(); };
  q("#cApr").onchange   = e => { c.apr = Math.max(0, parseFloat(e.target.value) || 0); reflow(); patch(); };
  q("#cStmt").onchange  = e => { c.statementDay = parseInt(e.target.value,10) || 0; reflow(); patch(); };
  q("#cInList").onchange = e => {
    if(e.target.checked){
      if(!ensureCardBill(c)){ e.target.checked = false; return toast("Give the card a name first"); }
      toast("Added to the monthly list");
    }else{
      const b = cardBill(c);
      if(b){
        const n = S.payments.filter(p => p.billId === b.id).length;
        if(n && !confirm("Hide it from the monthly list? Its " + n + " recorded payment" +
            (n === 1 ? "" : "s") + " stay in history and it can come back later.")){
          e.target.checked = true; return;
        }
        b.archived = true;                     // hidden, never destroyed
      }
      toast("Hidden from the monthly list");
    }
    save(); reflow();
  };
  q("#cDue").onchange   = e => {
    c.dueDay = parseInt(e.target.value,10) || 0;
    const b = cardBill(c);                    // keep the bill on the same date
    if(b && c.dueDay) b.dueDay = c.dueDay;
    reflow(); patch();
  };
  q("#cMin").onchange   = e => { c.minPayment = Math.max(0, parseFloat(e.target.value) || 0); patch(); };
  q("#cBill").onchange  = e => { c.billId = e.target.value; reflow(); patch(); };

  q("#cardArch").onclick = () => { c.archived = !c.archived; save(); closeSheet(); };
  q("#cardDel").onclick = () => {
    if(!confirm('Delete "' + (c.name || "this card") + '" and everything logged against it?')) return;
    S.cards  = S.cards.filter(x => x.id !== c.id);
    S.spends = S.spends.filter(x => x.cardId !== c.id);
    S.statements = S.statements.filter(x => x.cardId !== c.id);
    save(); closeSheet(); toast("Deleted");
  };
}

/** Says plainly which account a payment leaves, and flags when nothing
 *  will be deducted because no account matches the source. */
function payFromNote(x, cur){
  if(isScheduled(x))
    return '<div class="schednote">Arranged for ' + shortDate(x.date) +
           ' &middot; ' + money(x.amount || 0, cur) + ' not deducted yet</div>';
  const acct = accountForSource(x.sourceId);
  if(!acct)
    return '<div class="schednote warn">Not linked to an account &mdash; this will not reduce any balance</div>';
  return '<div class="schednote calm">Comes out of ' +
    esc(((acct.bank ? acct.bank + " · " : "") + acct.name).trim()) +
    (sourceLinkIsGuess(x.sourceId) ? ' (matched by name)' : '') + '</div>';
}

/** Timeline of hand-logged movements, newest first, each removable. */
const MOVES_SHOWN = 4;
function moveRowHTML(m, cur){
  return '<div class="moverow"><span class="d num">' + shortDate(m.date) + '</span>' +
    '<span class="mnote">' + (m.note ? esc(m.note) : (m.dir === "in" ? "Money in" : (m.cat ? esc(m.cat) : "Spend"))) +
      (m.cat && m.note ? '<i class="cattag">' + esc(m.cat) + '</i>' : '') + '</span>' +
    '<span class="a num' + (m.dir === "in" ? " in" : "") + '">' +
      (m.dir === "in" ? "+" : "−") + money(m.amount || 0, cur) + '</span>' +
    '<button class="paydel" data-delmove="' + esc(m.id) + '" aria-label="Remove entry">' +
    '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>';
}
/** Newest few always visible; the rest fold away so a long month never
 *  pushes the sheet's actions out of reach (they sit above this now). */
function movesHTML(list, cur, title){
  if(!list.length) return "";
  const sorted = list.slice().sort((a,b) =>
    (b.loggedAt || b.date || "").localeCompare(a.loggedAt || a.date || ""));
  const out = sorted.filter(m => m.dir !== "in").reduce((n,m) => n + (m.amount || 0), 0);
  const inn = sorted.filter(m => m.dir === "in").reduce((n,m) => n + (m.amount || 0), 0);
  const head = sorted.slice(0, MOVES_SHOWN), rest = sorted.slice(MOVES_SHOWN);
  return '<div class="movelist"><div class="movehead"><span class="eyebrow">' + title + '</span>' +
      '<span class="movesum num">' + sorted.length + ' &middot; ' +
        (out ? '−' + money(out, cur) : '') + (out && inn ? ' ' : '') + (inn ? '+' + money(inn, cur) : '') +
      '</span></div>' +
    head.map(m => moveRowHTML(m, cur)).join("") +
    (rest.length
      ? '<details class="morefold"><summary>Show ' + rest.length + ' more<span class="chev" aria-hidden="true"></span></summary>' +
          rest.map(m => moveRowHTML(m, cur)).join("") + '</details>'
      : '') +
  '</div>';
}

        : '<div class="hint" style="margin-top:9px">Link this loan to the bill that pays it, below, and payments can be logged and arranged from here.</div>') +
    '</div>' +

    '<div class="sec"><span class="eyebrow">Loan settings</span><div class="fields">' +
      '<div class="two">' +
        '<div class="field"><label for="lName">Name</label>' +
          '<input type="text" id="lName" placeholder="e.g. SoFi personal loan" value="' + esc(l.name) + '"></div>' +
        '<div class="field"><label for="lLender">Lender</label>' +

        '<div class="field"><label for="lApr">APR %</label>' +
          '<input type="number" inputmode="decimal" step="0.01" id="lApr" placeholder="28" value="' + (l.apr || "") + '"></div>' +

        '<select id="lBill">' + billOptions + '</select></div>' +
      '<div class="hint">Link it and the payments you tick off each month come straight off this balance.</div>' +
    '</div></div>' +

    '<div class="sec">' +
      '<button class="ghost" id="lArch">' + (l.archived ? "Restore" : "Archive (hide it)") + '</button>' +
      '<button class="danger" id="lDel">Delete this loan</button>' +
    '</div>';

  const body = $("#sheetBody"), q = id => body.querySelector(id);
  const patch = () => { save(); render(); };
  const reflow = () => { openLoan(l.id); render(); };
  const loanBillOrWarn = () => {
    const b2 = lm && lm.bill;
    if(!b2) toast("Link this loan to a bill first, below");
    return b2;
  };
  if(q("#loanPay")) q("#loanPay").onclick = () => {
    const b2 = loanBillOrWarn(); if(!b2) return;
    const pk = periodKey(UI.y, UI.m);
    const g = progressOf(b2, pk);
    const suggest = g.left > 0 ? g.left : (l.minPayment || b2.amount || 0);
    const v = prompt("Payment on " + (l.name || "this loan") + ":", String(Math.round(suggest * 100) / 100));
    if(v === null) return;
    const n = parseFloat(String(v).replace(/[^0-9.\-]/g, ""));
    if(!Number.isFinite(n) || n <= 0) return toast("Enter an amount");
    addPayment(b2.id, pk, {amount:n, final: !(b2.amount > 0 && n < b2.amount - 0.005)});
    save(); reflow(); toast("Logged — set a later date below to arrange it ahead", 3800);
  };
  if(q("#loanArrange")) q("#loanArrange").onclick = () => {
    const b2 = loanBillOrWarn(); if(!b2) return;
    arrangePayment(b2, periodKey(UI.y, UI.m));
    save(); reflow(); toast("Arranged for tomorrow — change the date below", 3800);
  };
  q("#loanConfirm").onclick = () => {
    const v = prompt("Balance the lender shows for " + (l.name || "this loan") + ":", String(l.balance || 0));
    if(v === null) return;
    const n = parseFloat(String(v).replace(/[^0-9.\-]/g, ""));
    if(!Number.isFinite(n) || n < 0) return toast("Enter a number");
    markConfirmed(l, n); save(); reflow(); toast("Balance confirmed");
  };
  q("#lName").onchange   = e => { l.name = e.target.value.trim(); UI.loanDraft = false;
                                  $("#sheetTitle").textContent = l.name || "New loan"; patch(); };
  q("#lLender").onchange = e => { l.lender = e.target.value.trim(); patch(); };
  q("#lApr").onchange    = e => { l.apr = Math.max(0, parseFloat(e.target.value) || 0); reflow(); patch(); };
  q("#lCur").onchange    = e => { l.currency = e.target.value; reflow(); patch(); };
  q("#lMin").onchange    = e => { l.minPayment = Math.max(0, parseFloat(e.target.value) || 0); patch(); };
  q("#lBill").onchange   = e => { l.billId = e.target.value; reflow(); patch(); };
  q("#lArch").onclick    = () => { l.archived = !l.archived; save(); closeSheet(); };
  q("#lDel").onclick     = () => {
    if(!confirm('Delete "' + (l.name || "this loan") + '"?')) return;
    S.loans = S.loans.filter(x => x.id !== l.id);
    UI.loanDraft = false; save(); closeSheet(); toast("Deleted");
  };
  $("#scrim").classList.add("on");
  $("#sheet").classList.add("on");
}

/** One screen, every card, one number each — the fastest honest refresh. */
function openRefreshAll(){
  UI.sheet = "refresh";
  UI.cardId = null;
  $("#sheetTitle").textContent = "Update balances";
  const cards = cardsByAvailable();
  $("#sheetBody").innerHTML =
    '<div class="sec">' +
      '<div class="hint" style="margin-bottom:12px">Open each card app and type what it shows. Leave a card blank to keep its current figure.</div>' +
      '<div class="fields">' + cards.map(c => {
        const s = cardState(c);
        return '<div class="field"><label for="rf-' + esc(c.id) + '">' + esc(c.name) +
          '<span style="float:right;font-weight:500;color:var(--muted)">expects ' + money(s.estimate, c.currency) +
          ' &middot; ' + (c.confirmedAt ? (s.age === 0 ? "read today" : s.age + "d ago") : "never read") + '</span></label>' +
          '<input type="text" inputmode="decimal" id="rf-' + esc(c.id) + '" data-refresh="' + esc(c.id) +
          '" placeholder="' + esc(String(Math.round(s.estimate * 100) / 100)) + '">' +
          '<div class="rfgap" data-rfgap="' + esc(c.id) + '"></div></div>';
      }).join("") + '</div>' +
      '<label class="rowtoggle"><span>File differences as unlogged spends</span>' +
        '<input type="checkbox" id="rfFile" checked></label>' +
      '<button class="primary" id="refreshSave" style="margin-top:13px">Save as confirmed today</button>' +
    '</div>';
  const body = $("#sheetBody");
  const gapFor = inp => {
    const c = cardOf(inp.dataset.refresh), v = parseAmt(inp.value);
    return (!c || inp.value.trim() === "" || !Number.isFinite(v)) ? null : {c, v, gap: v - cardState(c).estimate};
  };
  body.querySelectorAll("[data-refresh]").forEach(inp => inp.oninput = () => {
    const r = gapFor(inp), box = body.querySelector('[data-rfgap="' + inp.dataset.refresh + '"]');
    if(!r){ box.textContent = ""; box.className = "rfgap"; return; }
    const g = r.gap;
    box.className = "rfgap" + (g >= GAP_MIN ? " warn" : Math.abs(g) < GAP_MIN ? " ok" : "");
    box.textContent = Math.abs(g) < GAP_MIN ? "Matches"
      : g > 0 ? money(g, r.c.currency) + " more than expected — unlogged spending"
      : money(-g, r.c.currency) + " less than expected — a credit or payment not logged";
  });
  body.querySelector("#refreshSave").onclick = () => {
    const file = body.querySelector("#rfFile").checked;
    let n = 0, filed = 0, cur = "USD";
    body.querySelectorAll("[data-refresh]").forEach(inp => {
      const r = gapFor(inp);
      if(!r || r.v < 0) return;                       // blank = keep the current figure
      const {c, v, gap} = r;
      if(file && gap >= GAP_MIN){
        S.spends.push({id:uid(), cardId:c.id, accountId:"", dir:"out", date:todayISO,
          loggedAt:new Date().toISOString(), amount:Math.round(gap * 100) / 100,
          note:"Unlogged spending", cat:"", settled:true, gap:true});
        filed += gap; cur = c.currency;
      }
      markConfirmed(c, v); c.confirmedFrom = "manual";
      settleMoves(x => x.cardId === c.id);
      n++;
    });
    if(!n) return toast("Type at least one balance");
    save(); closeSheet();
    toast(n + " card" + (n === 1 ? "" : "s") + " updated" +
          (filed ? " · " + money(filed, cur) + " filed as unlogged" : ""), 3400);
  };
  $("#scrim").classList.add("on");
  $("#sheet").classList.add("on");
}

/* ── data sheet: sync section ───────────────────────────────────── */
function syncAgo(){
  const c = syncCfg();
  if(!c.at) return "not synced yet";
  const mins = Math.round((Date.now() - new Date(c.at).getTime()) / 60000);
  if(mins < 1)  return "synced just now";
  if(mins < 60) return "synced " + mins + " min ago";
  const hrs = Math.round(mins / 60);
  if(hrs < 24)  return "synced " + hrs + " hour" + (hrs===1?"":"s") + " ago";
  return "synced " + Math.round(hrs / 24) + " day" + (Math.round(hrs/24)===1?"":"s") + " ago";
}

      '<div class="hint">Stored only on this device, and never written into a backup or the synced file.</div>' +
    '</div>' +
    '<button class="primary" id="syncOn" style="margin-top:11px">Connect and sync</button>' +
    '<details class="howto"><summary>How to set this up (2 minutes)</summary>' +
      '<p><b>Open this link in a browser</b> — it goes straight to the right page:<br>' +

      '<ol>' +
        '<li>First make sure you have a <b>private</b> empty repo to sync into — <code>bill-ledger-data</code></li>' +

function markBackedUp(){
  S.lastBackup = {at:new Date().toISOString(), sig:signature()};
  save(); render();
  // only refresh the data sheet if that is genuinely what is on screen —
  // a background sync must never replace a sheet the user is working in
  if(UI.sheet === "data" && $("#sheet").classList.contains("on")) openData();
}
async function doExport(){
  const name = "bill-ledger.json";     // stable name so Files can replace the old one
  const data = payload();
  // Share sheet first on iOS: it's the only route that offers "Save to Files"
  // onto an existing file rather than piling up bill-ledger 2.json, 3.json…
  try{
    const file = new File([data], name, {type:"application/json"});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:"Bill Ledger backup"});
      markBackedUp(); return toast("Shared — choose Save to Files", 3200);
    }
  }catch(err){
    if(err && err.name === "AbortError") return;   // user dismissed the sheet
    /* otherwise fall through to the download paths */
  }
  if(window.claude && window.claude.downloads){
    try{
      await window.claude.downloads.save({filename:name, data});
      markBackedUp(); return toast("Backed up · save it to iCloud Drive");
    }catch(err){
      const code = err && err.code;
      if(code === "declined") return;
      if(code === "rate_limited") return toast("A save prompt is already open");
      if(code === "too_large")   return toast("Backup is too large to save here");
      /* anything else: fall through to the ordinary download path */
    }
  }
  try{
    const url = URL.createObjectURL(new Blob([data], {type:"application/json"}));
    const a = document.createElement("a");
    a.href = url; a.download = name; a.rel = "noopener";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    markBackedUp(); toast("Backed up · choose iCloud Drive when saving", 3200);
  }catch(e){ toast("Could not save the backup from this browser"); }
}

$("#importFile").onchange = e => {
  const f = e.target.files && e.target.files[0];
  if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const raw = JSON.parse(r.result);
      if(!Array.isArray(raw.bills) || !Array.isArray(raw.sources)) throw new Error("shape");
      const d = sanitize(raw);          // file is untrusted, whoever sent it
      const when = d.exportedAt ? "\n\nBacked up " + new Date(d.exportedAt).toLocaleString() : "";
      if(!confirm("Replace everything on this device with " + d.bills.length + " bills and " +
        d.payments.length + " payments from this file?" + when)) return;
      Object.assign(S, {
        version:1, sources:d.sources, bills:d.bills, payments:d.payments,
        cards:d.cards, spends:d.spends, statements:d.statements,
        loans:d.loans, accounts:d.accounts, cardAlias:d.cardAlias,
        startPeriod:d.startPeriod, viewMode:d.viewMode, theme:d.theme
      });
      S.lastBackup = {at:d.exportedAt || new Date().toISOString(), sig:signature()};
      resetStaleFilters();
      applyTheme(); save(); closeSheet(); toast("Restored from backup");
    }catch(err){ toast("That file isn't a Bill Ledger backup"); }
  };
  r.readAsText(f);
  e.target.value = "";
};

/* ── quick add ──────────────────────────────────────────────────────
   One sheet for the thing you do most: amount, card, what for, done.
   Cards are ordered by when you last used them, so the usual one is
   already picked; the keypad comes up on the same tap that opens it.   */
const CATS = ["Groceries","Dining","Fuel","Shopping","Home","Kids","Health",
              "Travel","Gifts","Fun","Bills","Other"];
const normName = v => String(v == null ? "" : v).trim().toLowerCase().replace(/\s+/g, " ");
const parseAmt = v => {
  const n = parseFloat(String(v == null ? "" : v).replace(/,/g, "").replace(/[^0-9.]/g, ""));
  return Number.isFinite(n) ? Math.round(n * 100) / 100 : NaN;
};
const byRecent = list => list.slice().sort((a,b) =>
  (b.loggedAt || b.date || "").localeCompare(a.loggedAt || a.date || ""));
const curSym = cur => cur === "INR" ? "₹" : "$";
const acctLabel = a => (((a.bank ? a.bank + " " : "") + (a.name || "")).trim() || "Account");

/** Cards in the order you reach for them: last used first, then most room. */
function quickCards(){
  const ids = [];
  for(const x of byRecent(S.spends)) if(x.cardId && !ids.includes(x.cardId)) ids.push(x.cardId);
  const used = ids.map(cardOf).filter(c => c && !c.archived);
  return [...used, ...cardsByAvailable(activeCards().filter(c => !ids.includes(c.id)))];
}
/** Notes used before, newest first, each with the category it last had. */
function recentNotes(limit){
  const seen = new Map();
  for(const x of byRecent(S.spends)){
    if(x.dir === "in") continue;
    const k = normName(x.note);
    if(!k || seen.has(k)) continue;
    seen.set(k, {note:x.note.trim(), cat:x.cat || ""});
    if(seen.size >= limit) break;
  }
  return [...seen.values()];
}
function catForNote(note){
  const k = normName(note);
  if(!k) return "";
  const hit = byRecent(S.spends).find(x => x.cat && normName(x.note) === k);
  return hit ? hit.cat : "";
}
function quickCur(){
  const q = UI.q || {};
  const h = q.mode === "acct" ? acctOf(q.acctId) : cardOf(q.cardId);
  return h ? h.currency : "USD";
}
