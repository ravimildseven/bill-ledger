<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bill Ledger</title>
<meta name="description" content="A private monthly bill checklist that keeps its history. All data stays on your device.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#EDF0F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D131B" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bill Ledger">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.png">
<style>*{margin:0}</style>
</head>
<body>
<style>
/* ── tokens ─────────────────────────────────────────────────────── */
:root{
  --paper:#EDF0F4; --surface:#FFFFFF; --surface-2:#F5F7FA; --sheet:#FFFFFF;
  --ink:#111925; --ink-2:#3B4657; --muted:#66748A;
  --line:#D3DBE5; --line-soft:#E4E9F0;
  --accent:#1B4F8F; --accent-soft:#E1EAF6; --accent-ink:#FFFFFF;
  --ok:#2C7A5B;   --ok-soft:#DEF0E7;
  --warn:#8F6310; --warn-soft:#F7EBD3;
  --bad:#AC3324;  --bad-soft:#F8E2DE;
  --shadow:0 1px 2px rgba(17,25,37,.07), 0 10px 30px rgba(17,25,37,.10);
  --scrim:rgba(17,25,37,.42);

  --f-display:ui-serif,"New York","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --f-ui:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --f-num:ui-monospace,"SF Mono",SFMono-Regular,Menlo,"Roboto Mono",monospace;

  --r-sm:8px; --r-md:12px; --r-lg:16px;
}
@media (prefers-color-scheme:dark){
  :root{
    --paper:#0D131B; --surface:#151D28; --surface-2:#1B2431; --sheet:#171F2B;
    --ink:#E4EAF2; --ink-2:#B9C4D2; --muted:#8494A8;
    --line:#26323F; --line-soft:#1E2733;
    --accent:#79ADEC; --accent-soft:#17293F; --accent-ink:#0B121B;
    --ok:#5CB78D;   --ok-soft:#12291F;
    --warn:#D3A241; --warn-soft:#2B2213;
    --bad:#E68872;  --bad-soft:#331B17;
    --shadow:0 1px 2px rgba(0,0,0,.45), 0 12px 34px rgba(0,0,0,.5);
    --scrim:rgba(4,8,13,.6);
  }
}
:root[data-theme="dark"]{
  --paper:#0D131B; --surface:#151D28; --surface-2:#1B2431; --sheet:#171F2B;
  --ink:#E4EAF2; --ink-2:#B9C4D2; --muted:#8494A8;
  --line:#26323F; --line-soft:#1E2733;
  --accent:#79ADEC; --accent-soft:#17293F; --accent-ink:#0B121B;
  --ok:#5CB78D;   --ok-soft:#12291F;
  --warn:#D3A241; --warn-soft:#2B2213;
  --bad:#E68872;  --bad-soft:#331B17;
  --shadow:0 1px 2px rgba(0,0,0,.45), 0 12px 34px rgba(0,0,0,.5);
  --scrim:rgba(4,8,13,.6);
}
:root[data-theme="light"]{
  --paper:#EDF0F4; --surface:#FFFFFF; --surface-2:#F5F7FA; --sheet:#FFFFFF;
  --ink:#111925; --ink-2:#3B4657; --muted:#66748A;
  --line:#D3DBE5; --line-soft:#E4E9F0;
  --accent:#1B4F8F; --accent-soft:#E1EAF6; --accent-ink:#FFFFFF;
  --ok:#2C7A5B;   --ok-soft:#DEF0E7;
  --warn:#8F6310; --warn-soft:#F7EBD3;
  --bad:#AC3324;  --bad-soft:#F8E2DE;
  --shadow:0 1px 2px rgba(17,25,37,.07), 0 10px 30px rgba(17,25,37,.10);
  --scrim:rgba(17,25,37,.42);
}

/* ── base ───────────────────────────────────────────────────────── */
*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--f-ui); font-size:15px; line-height:1.45;
  -webkit-text-size-adjust:100%; -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
button,input,select,textarea{font:inherit; color:inherit}
button{background:none; border:0; cursor:pointer; -webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px}
.num{font-family:var(--f-num); font-variant-numeric:tabular-nums; letter-spacing:-.01em}
.eyebrow{
  font-size:11px; font-weight:650; letter-spacing:.09em; text-transform:uppercase;
  color:var(--muted);
}
.shell{max-width:560px; margin:0 auto; padding:0 0 108px}

/* ── app bar ────────────────────────────────────────────────────── */
.bar{
  position:sticky; top:0; z-index:30; background:var(--surface);
  border-bottom:1px solid var(--line);
  padding:max(10px,env(safe-area-inset-top)) 16px 0;
}
.bar-top{display:flex; align-items:center; gap:10px; min-height:38px}
.brand{
  font-family:var(--f-display); font-size:19px; font-weight:600;
  letter-spacing:-.015em; margin-right:auto;
}
.icon-btn{
  position:relative; width:38px; height:38px; display:grid; place-items:center;
  border-radius:10px; color:var(--ink-2);
}
.icon-btn.unsaved::after{
  content:""; position:absolute; top:6px; right:6px; width:8px; height:8px;
  border-radius:99px; background:var(--warn); border:2px solid var(--surface);
}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn svg{width:19px; height:19px; fill:none; stroke:currentColor; stroke-width:1.7;
  stroke-linecap:round; stroke-linejoin:round}

.month-nav{display:flex; align-items:center; gap:6px; padding:2px 0 10px}
.month-nav .icon-btn{width:36px; height:36px}
.month-label{
  flex:1; text-align:center; font-family:var(--f-display);
  font-size:20px; font-weight:600; letter-spacing:-.01em;
}
.month-label small{
  display:block; font-family:var(--f-ui); font-size:11px; font-weight:650;
  letter-spacing:.09em; text-transform:uppercase; color:var(--muted); margin-top:1px;
}
.today-btn{
  font-size:12px; font-weight:600; color:var(--accent);
  padding:6px 10px; border-radius:8px; background:var(--accent-soft);
}

.tabs{display:flex; gap:2px; border-top:1px solid var(--line-soft)}
.tab{
  flex:1; padding:11px 4px 10px; font-size:13.5px; font-weight:600;
  color:var(--muted); border-bottom:2px solid transparent; margin-bottom:-1px;
}
.tab[aria-selected="true"]{color:var(--ink); border-bottom-color:var(--accent)}

/* ── summary ────────────────────────────────────────────────────── */
.summary{
  background:var(--surface); border-bottom:1px solid var(--line);
  padding:14px 16px 16px; display:flex; flex-direction:column; gap:14px;
}
.tot-row{display:flex; flex-direction:column; gap:7px}
.tot-head{display:flex; align-items:baseline; gap:8px}
.tot-cur{font-size:12px; font-weight:700; letter-spacing:.05em; color:var(--muted)}
.tot-amt{font-size:23px; font-weight:600; letter-spacing:-.02em; margin-left:auto}
.tot-sub{font-size:12px; color:var(--muted)}
.meter{height:5px; border-radius:99px; background:var(--line-soft); overflow:hidden; display:flex}
.meter i{display:block; height:100%; background:var(--ok); transition:width .3s ease}
.meter i.skip{background:var(--muted); opacity:.5}
.by-src{display:flex; flex-wrap:wrap; gap:6px}
.src-tot{
  display:inline-flex; align-items:center; gap:6px; padding:4px 9px 4px 7px;
  border:1px solid var(--line); border-radius:99px; font-size:12px; background:var(--surface-2);
}
.src-tot b{font-weight:600; font-family:var(--f-num); font-variant-numeric:tabular-nums}
.dot{width:8px; height:8px; border-radius:99px; flex:none}
.all-clear{
  display:flex; align-items:center; gap:8px; color:var(--ok);
  font-size:13.5px; font-weight:600;
}

/* ── view toggle ────────────────────────────────────────────────── */
.viewbar{display:flex; align-items:center; gap:10px; padding:12px 16px 0}
.viewbar .eyebrow{margin-right:auto}
.vtog{display:flex; gap:2px; padding:2px; background:var(--surface-2);
  border:1px solid var(--line); border-radius:9px}
.vtog button{padding:6px 9px; border-radius:7px; color:var(--muted); display:grid; place-items:center}
.vtog button[aria-pressed="true"]{background:var(--surface); color:var(--ink);
  box-shadow:0 1px 2px rgba(0,0,0,.09)}
.vtog svg{width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.8;
  stroke-linecap:round; stroke-linejoin:round}

/* ── tiles ──────────────────────────────────────────────────────── */
.tiles{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:9px; padding:0 16px 18px}
.tile{
  position:relative; display:flex; flex-direction:column; align-items:stretch;
  gap:0; text-align:left; padding:11px 11px 11px 14px; min-height:104px;
  background:var(--surface); border:1px solid var(--line); border-radius:13px;
  overflow:hidden;
}
.tile::before{
  content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--line);
}
.tile[data-state="today"]::before,
.tile[data-state="soon"]::before{background:var(--warn)}
.tile[data-state="missed"]::before{background:var(--bad)}
.tile[data-state="paid"]::before{background:var(--ok)}
.tile[data-state="skipped"]::before{background:var(--muted); opacity:.6}
.tile-top{display:flex; align-items:center; gap:5px; font-size:11px; color:var(--muted);
  min-width:0; margin-bottom:5px}
.tile-src{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.tile-name{
  font-size:13.5px; font-weight:600; line-height:1.3; letter-spacing:-.005em;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
}
.tile[data-state="paid"] .tile-name,
.tile[data-state="skipped"] .tile-name{color:var(--muted)}
.tile-amt{margin-top:auto; padding-top:7px; font-size:16px; font-weight:600; letter-spacing:-.015em}
.tile[data-state="skipped"] .tile-amt{color:var(--muted); text-decoration:line-through}
.tile-stat{font-size:10.5px; font-weight:600; margin-top:2px}
.tile-check{
  position:absolute; top:6px; right:6px; width:32px; height:32px; display:grid; place-items:center;
}
.tile-check span{
  width:21px; height:21px; border-radius:99px; border:1.5px solid var(--line);
  display:grid; place-items:center;
}
.tile-check svg{width:12px; height:12px; fill:none; stroke:var(--surface); stroke-width:2.6;
  stroke-linecap:round; stroke-linejoin:round; opacity:0}
.tile[data-state="paid"] .tile-check span{background:var(--ok); border-color:var(--ok)}
.tile[data-state="paid"] .tile-check svg{opacity:1}
.tile[data-state="skipped"] .tile-check span{background:var(--muted); border-color:var(--muted); opacity:.65}
.tile[data-state="skipped"] .tile-check svg{opacity:1}
@media (max-width:340px){ .tiles{grid-template-columns:1fr} }

/* ── filters ────────────────────────────────────────────────────── */
.filters{
  display:flex; gap:6px; padding:12px 16px; overflow-x:auto; scrollbar-width:none;
}
.filters::-webkit-scrollbar{display:none}
.chip{
  flex:none; display:inline-flex; align-items:center; gap:6px;
  padding:9px 13px; border-radius:99px; border:1px solid var(--line);
  background:var(--surface); font-size:13px; font-weight:550; color:var(--ink-2);
  white-space:nowrap;
}
.chip[aria-pressed="true"]{
  background:var(--ink); border-color:var(--ink); color:var(--paper);
}

/* ── ledger rows ────────────────────────────────────────────────── */
.group{margin:0 0 18px}
.group-head{
  display:flex; align-items:center; gap:10px; padding:0 16px 7px;
}
.group-head .eyebrow{white-space:nowrap}
.group-head .rule{flex:1; height:1px; background:var(--line)}
.group-head .cnt{font-size:11px; color:var(--muted); font-family:var(--f-num)}
.rows{background:var(--surface); border-block:1px solid var(--line)}

.row{display:flex; align-items:stretch; gap:0; position:relative}
.row + .row::before{
  content:""; position:absolute; left:56px; right:0; top:0; height:1px; background:var(--line-soft);
}
.tick{
  flex:none; width:56px; display:grid; place-items:center; align-self:stretch;
}
.tick span{
  width:24px; height:24px; border-radius:99px; border:1.5px solid var(--line);
  display:grid; place-items:center; transition:background .15s, border-color .15s;
}
.tick svg{width:14px; height:14px; fill:none; stroke:var(--surface); stroke-width:2.4;
  stroke-linecap:round; stroke-linejoin:round; opacity:0}
.row[data-state="paid"] .tick span{background:var(--ok); border-color:var(--ok)}
.row[data-state="paid"] .tick svg{opacity:1; stroke:var(--surface)}
.row[data-state="skipped"] .tick span{background:var(--muted); border-color:var(--muted); opacity:.65}
.row[data-state="skipped"] .tick svg{opacity:1}
.row[data-state="missed"] .tick span{border-color:var(--bad)}

.body{
  flex:1; min-width:0; display:flex; align-items:center; gap:12px;
  padding:12px 16px 12px 0; text-align:left;
}
.info{min-width:0; flex:1; display:block}
.name{
  display:block; font-size:15px; font-weight:550; letter-spacing:-.005em;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.row[data-state="paid"] .name,
.row[data-state="skipped"] .name{color:var(--muted)}
.meta{
  display:flex; align-items:center; gap:6px; margin-top:3px;
  font-size:12px; color:var(--muted);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.meta .sep{opacity:.45}
.freq-tag{color:var(--accent); font-weight:600}
.amt-col{text-align:right; flex:none; display:block}
.amt{display:block; font-size:15px; font-weight:600; letter-spacing:-.01em}
.row[data-state="skipped"] .amt{color:var(--muted); text-decoration:line-through;
  text-decoration-thickness:1px}
.stat{display:block; font-size:11.5px; margin-top:3px; font-weight:600}
.stat.paid{color:var(--ok)}
.stat.missed{color:var(--bad)}
.stat.soon{color:var(--warn)}
.stat.today{color:var(--warn); font-weight:700}
.row[data-state="today"] .tick span{border-color:var(--warn); border-width:2px}
.stat.plain{color:var(--muted); font-weight:500}
.stat.skipped{color:var(--muted); font-weight:500}

.empty{
  text-align:center; padding:52px 28px; color:var(--muted); font-size:14px;
}
.empty b{display:block; color:var(--ink); font-family:var(--f-display);
  font-size:17px; font-weight:600; margin-bottom:5px}
.welcome{display:flex; flex-direction:column; gap:8px; max-width:270px;
  margin:20px auto 0}

/* ── history ────────────────────────────────────────────────────── */
.hist-month{
  display:flex; align-items:baseline; gap:10px; padding:16px 16px 7px;
}
.hist-month h3{
  margin:0; font-family:var(--f-display); font-size:16px; font-weight:600;
  letter-spacing:-.01em;
}
.hist-month .tot{margin-left:auto; font-size:12.5px; color:var(--muted)}
.hrow{
  display:flex; width:100%; align-items:center; gap:12px; text-align:left;
  padding:11px 16px; position:relative;
}
.hrow + .hrow::before{
  content:""; position:absolute; left:16px; right:0; top:0; height:1px; background:var(--line-soft);
}
.hdate{
  flex:none; width:52px; font-size:12px; color:var(--muted); line-height:1.25;
}
.hdate b{display:block; font-size:16px; font-weight:600; color:var(--ink)}
.hrow .a{margin-left:auto; flex:none; font-size:14.5px; font-weight:600}
.hrow .a.sk{color:var(--muted); font-weight:500}

/* ── fab ────────────────────────────────────────────────────────── */
.fab{
  position:fixed; z-index:35; right:max(16px,calc(50vw - 264px));
  bottom:calc(20px + env(safe-area-inset-bottom));
  height:50px; padding:0 20px 0 16px; border-radius:99px;
  background:var(--accent); color:var(--accent-ink);
  display:flex; align-items:center; gap:8px; font-size:14.5px; font-weight:600;
  box-shadow:var(--shadow);
}
.fab svg{width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:2.2;
  stroke-linecap:round}

/* ── sheet ──────────────────────────────────────────────────────── */
.scrim{
  position:fixed; inset:0; z-index:40; background:var(--scrim);
  opacity:0; pointer-events:none; transition:opacity .22s ease;
  -webkit-backdrop-filter:blur(2px); backdrop-filter:blur(2px);
}
.scrim.on{opacity:1; pointer-events:auto}
.sheet{
  position:fixed; z-index:41; left:0; right:0; bottom:0; margin:0 auto;
  max-width:560px; max-height:92vh; background:var(--sheet);
  border-radius:18px 18px 0 0; box-shadow:var(--shadow);
  display:flex; flex-direction:column;
  transform:translateY(102%); transition:transform .26s cubic-bezier(.32,.72,0,1);
}
.sheet.on{transform:translateY(0)}
.sheet-head{
  flex:none; padding:8px 12px 12px; border-bottom:1px solid var(--line);
  display:flex; align-items:center; gap:8px;
}
.grab{
  position:absolute; top:7px; left:50%; transform:translateX(-50%);
  width:34px; height:4px; border-radius:99px; background:var(--line);
}
.sheet-title{
  flex:1; min-width:0; font-family:var(--f-display); font-size:17px; font-weight:600;
  padding-top:8px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.sheet-done{
  padding-top:8px; font-size:14.5px; font-weight:650; color:var(--accent);
  padding-inline:8px;
}
.sheet-body{
  overflow-y:auto; -webkit-overflow-scrolling:touch;
  padding:4px 16px calc(26px + env(safe-area-inset-bottom));
}
.sec{padding:16px 0; border-bottom:1px solid var(--line-soft)}
.sec:last-child{border-bottom:0}
.sec > .eyebrow{display:block; margin-bottom:11px}

.seg{
  display:flex; gap:3px; padding:3px; background:var(--surface-2);
  border:1px solid var(--line); border-radius:11px;
}
.seg button{
  flex:1; padding:9px 6px; border-radius:8px; font-size:13.5px; font-weight:600;
  color:var(--muted); display:flex; align-items:center; justify-content:center; gap:6px;
}
.seg button[aria-pressed="true"]{background:var(--surface); color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.09)}
.seg button[aria-pressed="true"][data-v="paid"]{color:var(--ok)}
.seg button[aria-pressed="true"][data-v="skipped"]{color:var(--muted)}
.seg svg{width:15px; height:15px; fill:none; stroke:currentColor; stroke-width:2.2;
  stroke-linecap:round; stroke-linejoin:round}

.fields{display:flex; flex-direction:column; gap:11px; margin-top:12px}
.field{display:flex; flex-direction:column; gap:5px}
.field label{font-size:12px; font-weight:600; color:var(--muted)}
.field input,.field select,.field textarea{
  width:100%; padding:11px 12px; border-radius:10px; background:var(--surface);
  border:1px solid var(--line); font-size:15.5px; -webkit-appearance:none; appearance:none;
}
.field input[type="date"],.field input[type="month"]{min-height:44px}
.field select{
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),
                   linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 17px) 50%, calc(100% - 12px) 50%;
  background-size:5px 5px, 5px 5px; background-repeat:no-repeat; padding-right:34px;
}
.field textarea{resize:vertical; min-height:56px; font-size:14.5px}
.two{display:grid; grid-template-columns:1fr 1fr; gap:11px}
.hint{font-size:11.5px; color:var(--muted); margin-top:-1px}

.spark{display:flex; align-items:flex-end; gap:3px; height:44px; margin:2px 0 8px}
.spark i{
  flex:1; min-width:3px; background:var(--accent-soft); border-radius:2px 2px 0 0;
  border-top:2px solid var(--accent); opacity:.55;
}
.spark i:last-child{opacity:1}
.spark-note{font-size:11.5px; color:var(--muted)}

.mini{display:flex; flex-direction:column}
.mini-row{
  display:flex; align-items:center; gap:10px; padding:9px 0; font-size:13.5px;
  border-top:1px solid var(--line-soft);
}
.mini-row:first-child{border-top:0}
.mini-row .d{color:var(--muted); font-size:12.5px; width:74px; flex:none}
.mini-row .a{margin-left:auto; font-weight:600}
.mini-row .a.sk{color:var(--muted); font-weight:500}

.danger{
  width:100%; margin-top:6px; padding:12px; border-radius:10px;
  border:1px solid var(--line); color:var(--bad); font-size:14px; font-weight:600;
}
.ghost{
  width:100%; padding:12px; border-radius:10px; border:1px solid var(--line);
  font-size:14px; font-weight:600; color:var(--ink-2); background:var(--surface);
}
.ghost + .ghost{margin-top:8px}
.primary{
  width:100%; padding:13px; border-radius:10px; border:1px solid var(--accent);
  background:var(--accent); color:var(--accent-ink); font-size:14.5px; font-weight:650;
}
.primary + .ghost{margin-top:8px}
.bstat{
  display:flex; align-items:center; gap:8px; margin-bottom:11px; padding:9px 11px;
  border-radius:9px; font-size:12.5px; font-weight:550; background:var(--surface-2);
  border:1px solid var(--line);
}

<script>
(() => {
"use strict";

/* ── constants ──────────────────────────────────────────────────── */
const KEY = "billLedger.v1";
const FREQ = {
  monthly:   {label:"Monthly",     step:1},
  quarterly: {label:"Quarterly",   step:3},
  half:      {label:"Half-yearly", step:6},
  yearly:    {label:"Yearly",      step:12},
  once:      {label:"One-time",    step:0}
};
const MONTHS = ["January","February","March","April","May","June",
                "July","August","September","October","November","December"];
const MON3 = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

/* ── seed ───────────────────────────────────────────────────────── */
function seed(){
  const sources = [
    {id:"checking", name:"Checking",    color:"#1D6FA8"},
    {id:"card",     name:"Credit card", color:"#5B54C4"},
    {id:"savings",  name:"Savings",     color:"#0F8A8A"}
  ];
  // [name, amount, currency, source, dueDay, freq, anchorY, anchorM, endYear, note, archived]
  const rows = [];   // the public build ships empty
  const bills = rows.map((r,i) => ({
    id:"b"+(i+1), name:r[0], amount:r[1], currency:r[2], sourceId:r[3],
    dueDay:r[4], freq:r[5], anchorY:r[6], anchorM:r[7], endYear:r[8],
    note:r[9], archived:!!r[10]
  }));
  const d0 = new Date();
  return {
    version:1, sources, bills, payments:[], theme:null, viewMode:"list", lastBackup:null,
    updatedAt: d0.getTime(),
    sync:{on:false, owner:"", repo:"", path:"bill-ledger.json", sha:null, at:null, err:null},
    // months before this are "not tracked yet", not overdue
    startPeriod: d0.getFullYear() + "-" + String(d0.getMonth()+1).padStart(2,"0")
  };
}

/* ── storage ────────────────────────────────────────────────────── */
let storageOK = true;
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){ storageOK = false; }
  return seed();
}
function saveLocal(){
  if(!storageOK) return;
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }
  catch(e){ storageOK = false; renderWarn(); }
}
/** Local write + a debounced push to GitHub when sync is switched on. */
function save(){
  S.updatedAt = Date.now();
  saveLocal();
  scheduleSync();
}

const S = load();
if(!S.sources || !S.bills) Object.assign(S, seed());
if(!S.payments) S.payments = [];
if(!S.viewMode) S.viewMode = "list";

/* ── view state ─────────────────────────────────────────────────── */
const now = new Date();
const UI = {
  view:"ledger",
  y:now.getFullYear(), m:now.getMonth(),
  cur:"all", src:"all",
  billId:null, draft:false
};

/* ── helpers ────────────────────────────────────────────────────── */
const $  = s => document.querySelector(s);
const uid = () => "x" + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const pad = n => String(n).padStart(2,"0");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const periodKey = (y,m) => y + "-" + pad(m+1);
const daysIn    = (y,m) => new Date(y, m+1, 0).getDate();
const dueDate   = (b,y,m) => new Date(y, m, Math.min(b.dueDay, daysIn(y,m)));
const iso       = d => d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate());
const todayISO  = iso(new Date());

const fmtUSD = new Intl.NumberFormat("en-US",{style:"currency",currency:"USD"});
const fmtINR = new Intl.NumberFormat("en-IN",{style:"currency",currency:"INR",maximumFractionDigits:0});
const money  = (n, cur) => (cur === "INR" ? fmtINR : fmtUSD).format(n || 0);

function srcOf(id){ return S.sources.find(s => s.id === id) || {name:"—", color:"var(--muted)"}; }
function billOf(id){ return S.bills.find(b => b.id === id); }

function isDue(b, y, m){
  const f = FREQ[b.freq] || FREQ.monthly;
  if(b.freq === "once") return b.anchorY === y && b.anchorM === m;
  const diff = (y - b.anchorY) * 12 + (m - b.anchorM);
  if(diff < 0) return false;
  if(b.endYear && y > b.endYear) return false;
  return diff % f.step === 0;
}
function payFor(billId, pk){
  return S.payments.find(p => p.billId === billId && p.period === pk);
}
function billsFor(y, m){
  return S.bills
    .filter(b => !b.archived && isDue(b, y, m))
    .filter(b => UI.cur === "all" || b.currency === UI.cur)
    .filter(b => UI.src === "all" || b.sourceId === UI.src)
    .sort((a,b) => a.dueDay - b.dueDay || a.name.localeCompare(b.name));
}
/** due | soon | missed | paid | skipped */
function stateOf(b, y, m){
  const pk = periodKey(y,m);
  const p = payFor(b.id, pk);
  if(p) return p.status;
  if(S.startPeriod && pk < S.startPeriod) return "due";  // before you started tracking
  const d = dueDate(b, y, m);
  const t = new Date(); t.setHours(0,0,0,0);
  const days = Math.round((d - t) / 86400000);
  if(days < 0) return "missed";
  if(days === 0) return "today";
  if(days <= 4) return "soon";
  return "due";
}
function toast(msg, ms){
  const t = $("#toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(toast._h); toast._h = setTimeout(() => t.classList.remove("on"), ms || 2000);
}

/* ── backup freshness ───────────────────────────────────────────── */
function signature(){
  const s = JSON.stringify({b:S.bills, p:S.payments, r:S.sources});
  let h = 5381;
  for(let i = 0; i < s.length; i++) h = ((h * 33) ^ s.charCodeAt(i)) >>> 0;
  return h.toString(36) + "." + s.length.toString(36);
}
function isDirty(){ return !S.lastBackup || S.lastBackup.sig !== signature(); }
function sinceBackup(){
  if(!S.lastBackup) return "never backed up";
  const ms = Date.now() - new Date(S.lastBackup.at).getTime();
  const mins = Math.round(ms / 60000);
  if(mins < 1)  return "backed up just now";
  if(mins < 60) return "backed up " + mins + " min ago";
  const hrs = Math.round(mins / 60);
  if(hrs < 24)  return "backed up " + hrs + " hour" + (hrs===1?"":"s") + " ago";
  const days = Math.round(hrs / 24);
  return "backed up " + days + " day" + (days===1?"":"s") + " ago";
}
let nudged = false;
function maybeNudge(){
  if(nudged || !isDirty()) return;
  const changes = S.payments.length;
  const stale = S.lastBackup
    ? (Date.now() - new Date(S.lastBackup.at).getTime()) > 7 * 864e5
    : changes >= 5;
  if(!stale) return;
  nudged = true;
  toast("Unsaved changes — tap the database icon to back up to iCloud", 4200);
}

/* ── sanitising the trust boundary ──────────────────────────────────
   Anything arriving from an imported file or the synced repo is treated
   as untrusted: every field is coerced to its expected type and shape
   before it can reach the DOM. Escaping on output is the second layer;
   this is the first.                                                   */
const S_FREQ = Object.keys(FREQ);
// strip control characters only — spaces, hyphens and ₹ must survive
const sStr  = (v, max) => String(v == null ? "" : v)
  .replace(/[\u0000-\u001F\u007F]/g, "").slice(0, max);
const sNum  = (v, d) => { const n = Number(v); return Number.isFinite(n) ? n : d; };
const sInt  = (v, lo, hi, d) => Math.min(hi, Math.max(lo, Math.round(sNum(v, d))));
const sId   = v => String(v == null ? "" : v).replace(/[^A-Za-z0-9_-]/g, "").slice(0, 40);
const sHex  = v => /^#[0-9a-fA-F]{6}$/.test(String(v)) ? String(v) : "#5C6670";
const sDate = v => /^\d{4}-\d{2}-\d{2}$/.test(String(v)) ? String(v) : todayISO;
const sPeriod = v => /^\d{4}-\d{2}$/.test(String(v)) ? String(v)
                   : periodKey(new Date().getFullYear(), new Date().getMonth());

function sanitize(d){
  if(!d || typeof d !== "object") throw new Error("shape");
  let sources = (Array.isArray(d.sources) ? d.sources : []).slice(0, 60)
    .map(s => ({id:sId(s && s.id), name:sStr(s && s.name, 40) || "Account", color:sHex(s && s.color)}))
    .filter(s => s.id);
  if(!sources.length) sources = [{id:"account", name:"Account", color:"#5C6670"}];
  const srcIds = new Set(sources.map(s => s.id));
  const fallbackSrc = sources[0].id;

  const bills = (Array.isArray(d.bills) ? d.bills : []).slice(0, 600).map(b => b && {
    id:       sId(b.id),
    name:     sStr(b.name, 80),
    amount:   Math.max(0, sNum(b.amount, 0)),
    currency: b.currency === "INR" ? "INR" : "USD",
    sourceId: srcIds.has(sId(b.sourceId)) ? sId(b.sourceId) : fallbackSrc,
    dueDay:   sInt(b.dueDay, 1, 31, 1),
    freq:     S_FREQ.includes(b.freq) ? b.freq : "monthly",
    anchorY:  sInt(b.anchorY, 1970, 2999, 2026),
    anchorM:  sInt(b.anchorM, 0, 11, 0),
    endYear:  b.endYear == null || b.endYear === "" ? null : sInt(b.endYear, 1970, 2999, 2999),
    note:     sStr(b.note, 120),
    archived: !!b.archived
  }).filter(b => b && b.id);
  const billIds = new Set(bills.map(b => b.id));

  const payments = (Array.isArray(d.payments) ? d.payments : []).slice(0, 40000)
    .filter(p => p && billIds.has(sId(p.billId)))
    .map(p => ({
      id:       sId(p.id) || uid(),
      billId:   sId(p.billId),
      period:   sPeriod(p.period),
      status:   p.status === "skipped" ? "skipped" : "paid",
      date:     sDate(p.date),
      amount:   Math.max(0, sNum(p.amount, 0)),
      sourceId: srcIds.has(sId(p.sourceId)) ? sId(p.sourceId) : fallbackSrc,
      note:     sStr(p.note, 120),
      loggedAt: sStr(p.loggedAt, 40),
      updatedAt:sStr(p.updatedAt, 40)
    }));

  return {
    version:1, sources, bills, payments,
    theme:      d.theme === "dark" || d.theme === "light" ? d.theme : null,
    viewMode:   d.viewMode === "tiles" ? "tiles" : "list",
    startPeriod:sPeriod(d.startPeriod),
    updatedAt:  sNum(d.updatedAt, Date.now()),
    exportedAt: sStr(d.exportedAt, 40)
  };
}

/* ── icons ──────────────────────────────────────────────────────── */
const I = {
  check:'<svg viewBox="0 0 24 24"><path d="M4.5 12.5l5 5 10-11"/></svg>',
  minus:'<svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg>',
  clock:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>'
};

/* ── render: warning banner ─────────────────────────────────────── */
function renderWarn(){
  $("#storeWarn").innerHTML = storageOK ? "" :
    '<div class="banner">This browser is blocking local storage, so changes will be lost when you close the page. Use <b>Backup</b> to export your data.</div>';
}

/* ── render: summary ────────────────────────────────────────────── */
function summaryHTML(list){
  const pk = periodKey(UI.y, UI.m);
  const groups = {};
  for(const b of list){
    const g = groups[b.currency] || (groups[b.currency] = {total:0,left:0,paid:0,skip:0,n:0,src:{}});
    const p = payFor(b.id, pk);
    const amt = p ? (p.amount || 0) : (b.amount || 0);
    g.n++;
    if(p && p.status === "paid"){ g.paid++; g.total += amt; }
    else if(p && p.status === "skipped"){ g.skip++; }
    else{
      g.total += amt; g.left += amt;
      if(amt > 0){
        const sid = b.sourceId;
        g.src[sid] = (g.src[sid] || 0) + amt;
      }
    }
  }
  const order = ["USD","INR"].filter(c => groups[c]);
  if(!order.length) return "";

  return '<div class="summary">' + order.map(cur => {
    const g = groups[cur];
    const donePct = g.n ? (g.paid / g.n) * 100 : 0;
    const skipPct = g.n ? (g.skip / g.n) * 100 : 0;
    const open = g.n - g.paid - g.skip;
    const srcChips = Object.entries(g.src)
      .sort((a,b) => b[1] - a[1])
      .map(([sid,amt]) => {
        const s = srcOf(sid);
        return '<span class="src-tot"><i class="dot" style="background:' + esc(s.color) + '"></i>' +
               esc(s.name) + ' <b>' + money(amt, cur) + '</b></span>';
      }).join("");
    return '<div class="tot-row">' +
      '<div class="tot-head"><span class="tot-cur">' + cur + ' &middot; still to pay</span>' +
        '<span class="tot-amt num">' + money(g.left, cur) + '</span></div>' +
      '<div class="meter"><i style="width:' + donePct + '%"></i><i class="skip" style="width:' + skipPct + '%"></i></div>' +
      '<div class="tot-sub">' + g.paid + ' of ' + g.n + ' cleared' +
        (g.skip ? ' &middot; ' + g.skip + ' skipped' : '') +
        ' &middot; ' + money(g.total, cur) + ' billed</div>' +
      (open
        ? '<div class="by-src">' + srcChips + '</div>'
        : '<div class="all-clear">' + I.check + ' Nothing left for ' + cur + ' this month</div>') +
    '</div>';
  }).join("") + '</div>';
}

/* ── render: filters ────────────────────────────────────────────── */
function filtersHTML(){
  const curs = [["all","All"],["USD","US $"],["INR","India ₹"]];
  const c = curs.map(([v,l]) =>
    '<button class="chip" data-f="cur" data-v="' + v + '" aria-pressed="' + (UI.cur===v) + '">' + l + '</button>').join("");
  const s = S.sources.map(x =>
    '<button class="chip" data-f="src" data-v="' + esc(x.id) + '" aria-pressed="' + (UI.src===x.id) + '">' +
    '<i class="dot" style="background:' + x.color + '"></i>' + esc(x.name) + '</button>').join("");
  const clear = UI.src !== "all"
    ? '<button class="chip" data-f="src" data-v="all" aria-pressed="false">Clear source</button>' : "";
  return '<div class="filters">' + c + s + clear + '</div>';
}

/* ── render: view toggle ────────────────────────────────────────── */
function viewbarHTML(n){
  return '<div class="viewbar"><span class="eyebrow">' + n + ' bill' + (n===1?'':'s') + ' this month</span>' +
    '<div class="vtog">' +
      '<button data-mode="list" aria-pressed="' + (S.viewMode!=="tiles") + '" aria-label="List view">' +
        '<svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>' +
      '<button data-mode="tiles" aria-pressed="' + (S.viewMode==="tiles") + '" aria-label="Tile view">' +
        '<svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/>' +
        '<rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/>' +
        '<rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/>' +
        '<rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg></button>' +
    '</div></div>';
}

/* ── render: tiles ──────────────────────────────────────────────── */
function tilesHTML(list){
  const pk = periodKey(UI.y, UI.m);
  return '<div class="tiles">' + list.map(b => {
    const st = stateOf(b, UI.y, UI.m);
    const p  = payFor(b.id, pk);
    const s  = srcOf(b.sourceId);
    const amt = p ? (p.amount || 0) : (b.amount || 0);
    const day = Math.min(b.dueDay, daysIn(UI.y, UI.m));
    let stat = '<span class="tile-stat" style="color:var(--muted)">' + MON3[UI.m] + ' ' + day + '</span>';
    if(st === "paid")    stat = '<span class="tile-stat" style="color:var(--ok)">Paid ' + shortDate(p.date) + '</span>';
    if(st === "skipped") stat = '<span class="tile-stat" style="color:var(--muted)">Skipped</span>';
    if(st === "missed")  stat = '<span class="tile-stat" style="color:var(--bad)">Overdue ' + MON3[UI.m] + ' ' + day + '</span>';
    if(st === "today")   stat = '<span class="tile-stat" style="color:var(--warn)">Due today</span>';
    if(st === "soon")    stat = '<span class="tile-stat" style="color:var(--warn)">Due ' + MON3[UI.m] + ' ' + day + '</span>';
    return '<div class="tile" data-state="' + st + '">' +
      '<button class="tile-check" data-tick="' + esc(b.id) + '" aria-label="Toggle paid for ' + esc(b.name) + '">' +
        '<span>' + (st === "skipped" ? I.minus : I.check) + '</span></button>' +
      '<button data-open="' + esc(b.id) + '" style="display:flex;flex-direction:column;align-items:stretch;flex:1;text-align:left;min-width:0">' +
        '<span class="tile-top"><i class="dot" style="background:' + esc(s.color) + '"></i>' +
          '<span class="tile-src">' + esc(s.name) + '</span></span>' +
        '<span class="tile-name">' + esc(b.name) + '</span>' +
        '<span class="tile-amt num">' + (amt ? money(amt, b.currency) : "—") + '</span>' +
        stat +
      '</button></div>';
  }).join("") + '</div>';
}

/* ── render: ledger ─────────────────────────────────────────────── */
function ledgerHTML(){
  if(!S.bills.some(b => !b.archived)){
    return '<div class="empty"><b>Your ledger is empty</b>' +
      'Restore a backup from iCloud Drive, or start adding bills one at a time.' +
      '<div class="welcome">' +
        '<button class="primary" data-act="restore">Restore from a file</button>' +
        '<button class="ghost" data-act="add">Add your first bill</button>' +
      '</div></div>';
  }
  const list = billsFor(UI.y, UI.m);
  let out = summaryHTML(list) + filtersHTML();
  if(!list.length){
    return out + '<div class="empty"><b>Nothing due</b>No bills fall in ' +
      MONTHS[UI.m] + ' ' + UI.y + ' with these filters.</div>';
  }
  out += viewbarHTML(list.length);
  if(S.viewMode === "tiles") return out + tilesHTML(list);
  const pk = periodKey(UI.y, UI.m);
  const byDay = new Map();
  for(const b of list){
    const d = Math.min(b.dueDay, daysIn(UI.y, UI.m));
    if(!byDay.has(d)) byDay.set(d, []);
    byDay.get(d).push(b);
  }

      if(st === "paid")    stat = '<span class="stat paid">Paid ' + shortDate(p.date) + '</span>';
      if(st === "skipped") stat = '<span class="stat skipped">Skipped</span>';

    out += '</div></section>';

  return out;
}
function shortDate(isoStr){
  if(!isoStr) return "";
  const [y,m,d] = isoStr.split("-").map(Number);
  return MON3[m-1] + " " + d;
}

function historyHTML(){
  const ps = S.payments
    .filter(p => {

      if(UI.src !== "all" && p.sourceId !== UI.src) return false;

    })

  }

/* ── mutations ──────────────────────────────────────────────────── */
function setStatus(billId, pk, status){
  const b = billOf(billId);
  const [y,m] = pk.split("-").map(Number);
  const existing = payFor(billId, pk);
  if(status === null){
    if(existing) S.payments.splice(S.payments.indexOf(existing), 1);
    save(); return;
  }
  // default the date: today if we're in the live month, else the due date
  const inLiveMonth = (y === now.getFullYear() && (m-1) === now.getMonth());
  const d = inLiveMonth ? todayISO : iso(dueDate(b, y, m-1));
  if(existing){
    existing.status = status;
    existing.updatedAt = new Date().toISOString();
  }else{
    S.payments.push({
      id:uid(), billId, period:pk, status,
      date:d, amount:status === "paid" ? (b.amount || 0) : 0,
      sourceId:b.sourceId, note:"",
      loggedAt:new Date().toISOString(), updatedAt:new Date().toISOString()
    });
  }
  save();
}

/* ── calendar reminders ─────────────────────────────────────────────
   One recurring all-day event per bill, with an alarm. iOS Calendar then
   does the reminding — no service worker, no push server, and it rides
   iCloud to every device on its own.                                   */
const icsEsc = s => String(s == null ? "" : s)
  .replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\r?\n/g, "\\n");
/** RFC 5545 caps lines at 75 octets; continuations start with one space. */
function icsFold(line){
  const bytes = new TextEncoder().encode(line);
  if(bytes.length <= 73) return line;
  const out = [];
  let cur = "";
  for(const ch of line){                       // iterate code points, never split one
    if(new TextEncoder().encode(cur + ch).length > 72){ out.push(cur); cur = " " + ch; }
    else cur += ch;
  }
  if(cur) out.push(cur);
  return out.join("\r\n");
}
function icsRule(b){
  const d = b.dueDay;
  if(b.freq === "once")      return null;
  if(b.freq === "yearly")    return "FREQ=YEARLY;BYMONTH=" + (b.anchorM + 1) + ";BYMONTHDAY=" + d;
  const step = {monthly:1, quarterly:3, half:6}[b.freq] || 1;
  return "FREQ=MONTHLY" + (step > 1 ? ";INTERVAL=" + step : "") + ";BYMONTHDAY=" + d;
}
function buildICS(daysBefore){
  const now = new Date();
  const stamp = now.toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, "");
  // alarm fires at 09:00 local, `daysBefore` days ahead of the all-day start
  const offsetH = daysBefore * 24 - 9;
  const trigger = offsetH === 0 ? "PT0S" : (offsetH > 0 ? "-PT" + offsetH + "H" : "PT" + (-offsetH) + "H");

  const L = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Bill Ledger//EN",
             "CALSCALE:GREGORIAN", "METHOD:PUBLISH",
             "X-WR-CALNAME:Bill Ledger", "X-WR-TIMEZONE:" + (Intl.DateTimeFormat().resolvedOptions().timeZone || "UTC")];

  const bills = S.bills.filter(b => !b.archived);
  for(const b of bills){
    const first = dueDate(b, b.anchorY, b.anchorM);
    const dt = first.getFullYear() + pad(first.getMonth() + 1) + pad(first.getDate());
    const next = new Date(first); next.setDate(next.getDate() + 1);
    const dtEnd = next.getFullYear() + pad(next.getMonth() + 1) + pad(next.getDate());
    const src = srcOf(b.sourceId).name;
    const amt = b.amount ? money(b.amount, b.currency) : "amount varies";
    const rule = icsRule(b);
    // RFC 5545: DTSTART is a DATE value here, so UNTIL must be a DATE too —
    // a date-time UNTIL against a DATE start is rejected by strict parsers.
    const until = b.endYear ? ";UNTIL=" + b.endYear + "1231" : "";

    L.push("BEGIN:VEVENT");
    L.push("UID:bill-" + b.id + "@bill-ledger");
    L.push("DTSTAMP:" + stamp);
    L.push("DTSTART;VALUE=DATE:" + dt);
    L.push("DTEND;VALUE=DATE:" + dtEnd);
    if(rule) L.push("RRULE:" + rule + until);
    L.push(icsFold("SUMMARY:" + icsEsc(b.name + " — " + amt)));
    L.push(icsFold("DESCRIPTION:" + icsEsc(
      "Pay from " + src + "." + (b.note ? " " + b.note : "") +
      "\n" + FREQ[b.freq].label + " · added by Bill Ledger")));
    L.push("TRANSP:TRANSPARENT");
    L.push("BEGIN:VALARM");
    L.push("ACTION:DISPLAY");
    L.push(icsFold("DESCRIPTION:" + icsEsc(b.name + " — " + amt + " from " + src)));
    L.push("TRIGGER;RELATED=START:" + trigger);
    L.push("END:VALARM");
    L.push("END:VEVENT");
  }
  L.push("END:VCALENDAR");
  return {text: L.join("\r\n") + "\r\n", count: bills.length};
}
async function doCalendar(){
  const sel = $("#remWhen");
  const daysBefore = sel ? parseInt(sel.value, 10) : 1;
  const {text, count} = buildICS(daysBefore);
  if(!count) return toast("No bills to remind you about yet");
  const name = "bill-ledger-reminders.ics";
  const file = new File([text], name, {type:"text/calendar"});
  try{
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:"Bill Ledger reminders"});
      return toast("Choose Calendar to add " + count + " reminders", 3600);
    }
  }catch(err){
    if(err && err.name === "AbortError") return;
  }
  try{
    const url = URL.createObjectURL(new Blob([text], {type:"text/calendar"}));
    const a = document.createElement("a");
    a.href = url; a.download = name; a.rel = "noopener";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    toast(count + " reminders saved — open the file to add them", 3600);
  }catch(e){ toast("Could not create the calendar file here"); }
}

/* ── GitHub sync ────────────────────────────────────────────────────
   Writes the ledger back to one file in a PRIVATE repo on every change.
   The token is held under its own key, never inside S, so it can never
   end up inside an exported or synced backup.                          */
const TOKEN_KEY = "billLedger.token";
const getToken = () => { try{ return localStorage.getItem(TOKEN_KEY) || ""; }catch(e){ return ""; } };
const setToken = t => {
  try{ t ? localStorage.setItem(TOKEN_KEY, t) : localStorage.removeItem(TOKEN_KEY); }catch(e){}
};

function b64enc(str){
  const bytes = new TextEncoder().encode(str);
  let bin = "";
  for(let i = 0; i < bytes.length; i += 0x8000)
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
const b64dec = b =>
  new TextDecoder().decode(Uint8Array.from(atob(String(b).replace(/\s/g, "")), c => c.charCodeAt(0)));

function syncCfg(){
  return S.sync || (S.sync = {on:false, owner:"", repo:"", path:"bill-ledger.json",
                              sha:null, at:null, err:null});
}
const syncReady = () => {
  const c = syncCfg();
  return !!(c.on && c.owner && c.repo && getToken());
};
/** What actually gets written — no sync config, no token, ever. */
function payload(){
  const {sync, ...rest} = S;
  return JSON.stringify({...rest, exportedAt:new Date().toISOString()}, null, 2);
}
function ghErr(status){
  if(status === 401) return "Token rejected — it may have expired";
  if(status === 403) return "Token lacks Contents write access to that repo";
  if(status === 404) return "Repo or file path not found — check owner/repo";
  if(status === 409) return "The file changed on GitHub — tap Sync now";
  if(status === 422) return "GitHub rejected the update";
  return "GitHub error " + status;
}
async function ghReq(method, body){
  const c = syncCfg();
  const url = "https://api.github.com/repos/" + encodeURIComponent(c.owner) + "/" +
              encodeURIComponent(c.repo) + "/contents/" +
              c.path.split("/").map(encodeURIComponent).join("/");
  const headers = {
    "Authorization": "Bearer " + getToken(),
    "Accept": "application/vnd.github+json",
    "X-GitHub-Api-Version": "2022-11-28"
  };
  if(body) headers["Content-Type"] = "application/json";
  try{
    return await fetch(url, {method, headers, body: body ? JSON.stringify(body) : undefined});
  }catch(e){
    throw new Error(navigator.onLine === false
      ? "Offline — changes are saved here and will sync later"
      : "Can't reach GitHub from this page");
  }
}
async function syncPull(){
  const res = await ghReq("GET");
  if(res.status === 404) return {empty:true};
  if(!res.ok) throw new Error(ghErr(res.status));
  const j = await res.json();
  syncCfg().sha = j.sha;
  return {data: JSON.parse(b64dec(j.content))};
}
async function syncPush(){
  const c = syncCfg();
  const body = {
    message: "Ledger update — " + new Date().toISOString().slice(0, 16).replace("T", " "),
    content: b64enc(payload())
  };
  if(c.sha) body.sha = c.sha;
  let res = await ghReq("PUT", body);
  if(res.status === 409 || res.status === 422){
    const cur = await ghReq("GET");                 // stale sha — re-read, retry once
    if(cur.ok){ body.sha = c.sha = (await cur.json()).sha; res = await ghReq("PUT", body); }
  }
  if(!res.ok) throw new Error(ghErr(res.status));
  const j = await res.json();
  c.sha = j.content.sha;
  c.at  = new Date().toISOString();
  c.err = null;
  S.lastBackup = {at:c.at, sig:signature()};
}
/** After the data underneath changes, drop filters that no longer resolve —
    otherwise the month reads "Nothing due" for no visible reason. */
function resetStaleFilters(){
  if(UI.src !== "all" && !S.sources.some(s => s.id === UI.src)) UI.src = "all";
  if(UI.cur !== "all" && !S.bills.some(b => b.currency === UI.cur)) UI.cur = "all";
}

function adopt(d){
  const c = sanitize(d);              // remote data is untrusted
  Object.assign(S, {
    version:1,
    sources: c.sources, bills: c.bills, payments: c.payments,
    startPeriod: c.startPeriod, viewMode: c.viewMode,
    theme: c.theme, updatedAt: c.updatedAt
  });
  resetStaleFilters();
  applyTheme();
}

let syncTimer = null, syncing = false;
function scheduleSync(){
  if(!syncReady()) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(() => runSync(true), 2500);
}
async function runSync(quiet){
  if(syncing || !syncReady()) return;
  syncing = true; render();
  try{ await syncPush(); }
  catch(e){ syncCfg().err = e.message; if(!quiet) toast(e.message, 3600); }
  syncing = false;
  saveLocal(); render();
  if($("#sheet").classList.contains("on") && !UI.billId) openData();
}
/** On open: whichever side is newer wins. */
async function syncBoot(){
  if(!syncReady()) return;
  syncing = true; render();
  try{
    const r = await syncPull();
    if(r.empty){ await syncPush(); }
    else{
      const remoteAt = r.data.updatedAt || 0, localAt = S.updatedAt || 0;
      if(remoteAt > localAt){
        adopt(r.data);
        S.lastBackup = {at:new Date().toISOString(), sig:signature()};
      }else if(localAt > remoteAt){
        await syncPush();
      }else{
        S.lastBackup = {at:new Date().toISOString(), sig:signature()};
      }
    }
    syncCfg().err = null;
  }catch(e){ syncCfg().err = e.message; }
  syncing = false;
  saveLocal(); render();
}

/* ── sheet ──────────────────────────────────────────────────────── */
function openSheet(billId, period){
  UI.billId = billId;

function closeSheet(){
  if(UI.draft){

            '<input type="month" id="bAnchor" value="' + esc(b.anchorY + '-' + pad(b.anchorM+1)) + '"></div>' +
          '<div class="field"><label for="bEnd">Last year</label>' +
            '<input type="number" inputmode="numeric" id="bEnd" placeholder="never" value="' + (b.endYear || "") + '"></div>' +
        '</div>' +
        '<div class="hint">' + FREQ[b.freq].label.toLowerCase() + ' from ' +
          MON3[b.anchorM] + ' ' + b.anchorY + (b.endYear ? ' through ' + b.endYear : '') + '</div>') +
        '<div class="field"><label for="bNote">Note</label>' +
          '<input type="text" id="bNote" placeholder="optional" value="' + esc(b.note) + '"></div>' +
      '</div>' +
    '</div>' +

    /* ── history ── */
    '<div class="sec"><span class="eyebrow">Payment history</span>' + spark + histRows + '</div>' +

    /* ── actions ── */
    '<div class="sec">' +
      '<button class="ghost" id="archBtn">' + (b.archived ? "Restore this bill" : "Archive (hide from months)") + '</button>' +
      '<button class="danger" id="delBtn">Delete bill and its history</button>' +
    '</div>';

  wireSheet(b, pk);
}

function wireSheet(b, pk){
  const body = $("#sheetBody");
  const reflow = () => { renderSheet(); render(); };
  const patch  = () => { save(); render(); };

  body.querySelectorAll("#segStatus button").forEach(btn => {
    btn.onclick = () => {
      const v = btn.dataset.v;
      setStatus(b.id, pk, v === "due" ? null : v);
      reflow();
    };
  });

  const p = payFor(b.id, pk);
  const on = (id, ev, fn) => { const el = body.querySelector(id); if(el) el[ev] = fn; };

  if(p){
    on("#pDate","onchange", e => { p.date = e.target.value || p.date; p.updatedAt = new Date().toISOString(); patch(); });
    on("#pAmt", "onchange", e => { p.amount = parseFloat(e.target.value) || 0; p.updatedAt = new Date().toISOString(); patch(); });
    on("#pSrc", "onchange", e => { p.sourceId = e.target.value; p.updatedAt = new Date().toISOString(); patch(); });
    on("#pNote","onchange", e => { p.note = e.target.value.trim(); p.updatedAt = new Date().toISOString(); patch(); });
  }

  on("#bName","onchange", e => { b.name = e.target.value.trim(); $("#sheetTitle").textContent = b.name || "New bill"; UI.draft = false; patch(); });
  on("#bAmt", "onchange", e => { b.amount = parseFloat(e.target.value) || 0; patch(); });
  on("#bCur", "onchange", e => { b.currency = e.target.value; patch(); });
  on("#bSrc", "onchange", e => { b.sourceId = e.target.value; patch(); });
  on("#bDay", "onchange", e => { b.dueDay = parseInt(e.target.value,10) || 1; patch(); });
  on("#bNote","onchange", e => { b.note = e.target.value.trim(); patch(); });
  on("#bFreq","onchange", e => {
    b.freq = e.target.value;
    if(b.freq !== "monthly" && b.anchorM === 0 && b.anchorY === 2026){
      b.anchorY = UI.y; b.anchorM = UI.m;   // anchor to the month being viewed
    }
    reflow();
  });
  on("#bAnchor","onchange", e => {
    const [y,m] = (e.target.value || "").split("-").map(Number);
    if(y && m){ b.anchorY = y; b.anchorM = m-1; }
    reflow();
  });
  on("#bEnd","onchange", e => {
    const v = parseInt(e.target.value,10);
    b.endYear = v && v > 1900 ? v : null; reflow();
  });

  on("#archBtn","onclick", () => { b.archived = !b.archived; save(); toast(b.archived ? "Archived" : "Restored"); closeSheet(); });
  on("#delBtn","onclick", () => {
    if(!confirm('Delete "' + (b.name || "this bill") + '" and all ' +
       S.payments.filter(x => x.billId === b.id).length + ' recorded payments?')) return;
    S.bills.splice(S.bills.indexOf(b), 1);
    S.payments = S.payments.filter(x => x.billId !== b.id);
    UI.draft = false; save(); toast("Deleted"); closeSheet();
  });
}

/* ── data sheet: sync section ───────────────────────────────────── */
function syncAgo(){
  const c = syncCfg();
  if(!c.at) return "not synced yet";
  const mins = Math.round((Date.now() - new Date(c.at).getTime()) / 60000);
  if(mins < 1)  return "synced just now";
  if(mins < 60) return "synced " + mins + " min ago";
  const hrs = Math.round(mins / 60);
  if(hrs < 24)  return "synced " + hrs + " hour" + (hrs===1?"":"s") + " ago";
  return "synced " + Math.round(hrs / 24) + " day" + (Math.round(hrs/24)===1?"":"s") + " ago";
}

  return '<div class="sec"><span class="eyebrow">Automatic sync</span>' +
    '<div class="hint" style="margin-bottom:11px">Connect a <b>private</b> GitHub repo and the ledger saves itself back to one file on every change — no manual backups, and it follows you across devices.</div>' +
    '<div class="fields">' +
      '<div class="two">' +
        '<div class="field"><label for="syOwner">GitHub username</label>' +

        '<div class="field"><label for="syRepo">Private repo</label>' +
          '<input type="text" id="syRepo" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="bill-ledger-data" value="' + esc(c.repo) + '"></div>' +
      '</div>' +
      '<div class="field"><label for="syTok">Access token</label>' +
        '<input type="password" id="syTok" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="github_pat_…"></div>' +
      '<div class="hint">Stored only on this device, and never written into a backup or the synced file.</div>' +
    '</div>' +
    '<button class="primary" id="syncOn" style="margin-top:11px">Connect and sync</button>' +
    '<details class="howto"><summary>How to set this up (2 minutes)</summary>' +
      '<p><b>Open this link in a browser</b> — it goes straight to the right page:<br>' +
        '<a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener noreferrer">' +
        'github.com/settings/personal-access-tokens/new</a></p>' +
      '<ol>' +
        '<li>First make sure you have a <b>private</b> empty repo to sync into — <code>bill-ledger-data</code></li>' +
        '<li>On that page, give the token a name and an <b>expiry</b></li>' +
        '<li><b>Repository access</b> → <b>Only select repositories</b> → choose that one repo</li>' +
        '<li>Under <b>Permissions</b>, click <b>Repository permissions</b> to <b>expand it</b> — it starts collapsed, which is why the setting looks missing</li>' +
        '<li>The list is alphabetical. Scroll to <b>Contents</b>, and change the dropdown <b>on its right</b> from <i>No access</i> to <b>Read and write</b>. Leave every other row alone</li>' +
        '<li><b>Generate token</b>, copy it, and paste it above</li>' +
      '</ol>' +
      '<p><b>No “Read and write” anywhere?</b> You’re most likely on the <i>classic</i> token page, which shows tick-boxes (<code>repo</code>, <code>workflow</code>, <code>gist</code>) instead of dropdowns. Use the link above for the fine-grained page. A classic token with <code>repo</code> ticked does also work here — but it grants access to <i>all</i> your repositories rather than just this one.</p>' +
      '<p><b>Can’t find it by menu?</b> Developer settings lives at the very bottom of the sidebar under your <i>profile</i> settings — not under a repository’s settings — and the GitHub <i>mobile app</i> doesn’t show it at all. Use the link above in Safari instead.</p>' +
      '<p>That token can only touch that one repo’s files — it cannot read your other repos or act on your account. Revoke it any time from the same page.</p>' +
      '<p>Because the repo is private, the data is genuinely protected by GitHub auth, and every change becomes a commit, so you get a full version history for free.</p>' +
    '</details>' +
  '</div>';
}

/* ── data sheet (backup / sources) ──────────────────────────────── */

  $("#sheetBody").innerHTML =

      '<div class="hint" style="margin-bottom:11px">Add every bill to your calendar as a repeating event with an alert, so your phone reminds you. Recurring bills repeat on their own — you only need to do this again if you add or change bills.</div>' +
      '<div class="field"><label for="remWhen">Alert me at 9am</label>' +
        '<select id="remWhen">' +
          '<option value="0">On the due date</option>' +
          '<option value="1" selected>1 day before</option>' +
          '<option value="3">3 days before</option>' +
          '<option value="7">1 week before</option>' +
        '</select></div>' +
      '<button class="ghost" id="calBtn" style="margin-top:10px">Add ' +
        S.bills.filter(b => !b.archived).length + ' reminders to Calendar</button>' +
      '<div class="hint" style="margin-top:9px">Adding them again replaces the old ones rather than duplicating, as long as you keep them in the same calendar.</div>' +
    '</div>' +
    syncSectionHTML() +
    '<div class="sec"><span class="eyebrow">Manual backup</span>' +

        '<i class="dot" style="background:' + (isDirty() ? "var(--warn)" : "var(--ok)") + '"></i>' +
        '<span>' + (isDirty() ? "Unsaved changes &middot; " : "Up to date &middot; ") + sinceBackup() + '</span></div>' +
      '<button class="primary" id="expBtn">Back up to Files / iCloud Drive</button>' +
      '<button class="ghost" id="impBtn">Restore from a file</button>' +
      '<div class="hint" style="margin-top:10px">' + S.bills.length + ' bills &middot; ' + counts +
        ' payment' + (counts===1?'':'s') + ' &middot; saves as one JSON file.</div>' +
      '<details class="howto"><summary>Make every backup land in iCloud automatically</summary>' +
        '<ol><li>iPhone <b>Settings</b> &rarr; <b>Apps</b> &rarr; <b>Safari</b> &rarr; <b>Downloads</b></li>' +
        '<li>Choose <b>iCloud Drive</b> instead of On My iPhone</li>' +
        '<li>Now <b>Back up</b> writes straight into iCloud Drive &rarr; Downloads, and syncs to every device</li></ol>' +
        '<p>To restore on a new phone, open this page, tap <b>Restore from a file</b> and pick the newest <code>bill-ledger-….json</code> from iCloud Drive.</p>' +
      '</details>' +
    '</div>' +
    '<div class="sec"><span class="eyebrow">Payment sources</span>' +
      '<div class="mini">' + S.sources.map(s =>
        '<div class="mini-row"><i class="dot" style="background:' + esc(s.color) + '"></i>' +
        '<span>' + esc(s.name) + '</span>' +
        '<span class="a num" style="font-weight:500;color:var(--muted)">' +
          S.bills.filter(b => !b.archived && b.sourceId === s.id).length + ' bills</span>' +
        '<button class="icon-btn" data-delsrc="' + esc(s.id) + '" aria-label="Remove ' + esc(s.name) + '" style="width:30px;height:30px">' +
          '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>').join("") +
      '</div>' +
      '<div class="fields"><div class="two">' +
        '<div class="field"><label for="nsName">New source</label>' +
          '<input type="text" id="nsName" placeholder="e.g. HDFC"></div>' +
        '<div class="field"><label for="nsColor">Colour</label>' +
          '<input type="color" id="nsColor" value="#4B7BA8" style="padding:5px;height:44px"></div>' +
      '</div></div>' +
      '<button class="ghost" id="addSrc" style="margin-top:10px">Add source</button>' +
    '</div>' +
    '<div class="sec"><span class="eyebrow">Archived bills</span>' +
      (S.bills.filter(b => b.archived).length
        ? '<div class="mini">' + S.bills.filter(b => b.archived).map(b =>
            '<div class="mini-row"><span>' + esc(b.name) + '</span>' +
            '<button class="a" data-unarch="' + esc(b.id) + '" style="color:var(--accent);font-weight:600">Restore</button></div>').join("") + '</div>'
        : '<div class="hint">None.</div>') +
    '</div>' +
    '<div class="sec"><span class="eyebrow">Reset</span>' +
      '<button class="danger" id="resetBtn">Erase everything and reload the starter list</button></div>';

  const body = $("#sheetBody");
  const q = id => body.querySelector(id);

  if(q("#syncOn")) q("#syncOn").onclick = async () => {
    const owner = q("#syOwner").value.trim().replace(/^@/, "");
    const repo  = q("#syRepo").value.trim();
    const tok   = q("#syTok").value.trim();
    if(!owner || !repo) return toast("Enter your username and repo name");
    if(!tok) return toast("Paste an access token");
    const c = syncCfg();
    Object.assign(c, {on:true, owner, repo, sha:null, err:null});
    setToken(tok);
    saveLocal();
    toast("Connecting…");
    await syncBoot();
    openData();
    toast(syncCfg().err ? syncCfg().err : "Sync is on", syncCfg().err ? 4000 : 2000);
  };
  if(q("#syncNow")) q("#syncNow").onclick = () => runSync(false);
  if(q("#syncOff")) q("#syncOff").onclick = () => {
    if(!confirm("Turn off sync? The file already on GitHub is kept, and this device keeps its own copy.")) return;
    Object.assign(syncCfg(), {on:false, sha:null, at:null, err:null});
    setToken("");
    saveLocal(); openData(); render(); toast("Sync off");

  if(q("#calBtn")) q("#calBtn").onclick = doCalendar;
  body.querySelector("#expBtn").onclick = doExport;
  body.querySelector("#impBtn").onclick = () => $("#importFile").click();

  });

  });
  body.querySelector("#resetBtn").onclick = () => {
    if(!confirm("Erase all bills and payment history, and reload the starter list?")) return;
    Object.assign(S, seed()); save(); closeSheet(); toast("Reset");
  };

  $("#sheet").classList.add("on");

function markBackedUp(){
  S.lastBackup = {at:new Date().toISOString(), sig:signature()};
  save(); render();
  if($("#sheet").classList.contains("on") && !UI.billId) openData();
}
async function doExport(){
  const name = "bill-ledger.json";     // stable name so Files can replace the old one
  const data = payload();
  // Share sheet first on iOS: it's the only route that offers "Save to Files"
  // onto an existing file rather than piling up bill-ledger 2.json, 3.json…
  try{
    const file = new File([data], name, {type:"application/json"});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:"Bill Ledger backup"});
      markBackedUp(); return toast("Shared — choose Save to Files", 3200);
    }
  }catch(err){
    if(err && err.name === "AbortError") return;   // user dismissed the sheet
    /* otherwise fall through to the download paths */
  }
  if(window.claude && window.claude.downloads){
    try{
      await window.claude.downloads.save({filename:name, data});
      markBackedUp(); return toast("Backed up · save it to iCloud Drive");
    }catch(err){
      const code = err && err.code;
      if(code === "declined") return;
      if(code === "rate_limited") return toast("A save prompt is already open");
      if(code === "too_large")   return toast("Backup is too large to save here");
      /* anything else: fall through to the ordinary download path */
    }
  }
  try{
    const url = URL.createObjectURL(new Blob([data], {type:"application/json"}));
    const a = document.createElement("a");
    a.href = url; a.download = name; a.rel = "noopener";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    markBackedUp(); toast("Backed up · choose iCloud Drive when saving", 3200);
  }catch(e){ toast("Could not save the backup from this browser"); }
}

$("#importFile").onchange = e => {
  const f = e.target.files && e.target.files[0];
  if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const raw = JSON.parse(r.result);
      if(!Array.isArray(raw.bills) || !Array.isArray(raw.sources)) throw new Error("shape");
      const d = sanitize(raw);          // file is untrusted, whoever sent it
      const when = d.exportedAt ? "\n\nBacked up " + new Date(d.exportedAt).toLocaleString() : "";
      if(!confirm("Replace everything on this device with " + d.bills.length + " bills and " +
        d.payments.length + " payments from this file?" + when)) return;
      Object.assign(S, {
        version:1, sources:d.sources, bills:d.bills, payments:d.payments,
        startPeriod:d.startPeriod, viewMode:d.viewMode, theme:d.theme
      });
      S.lastBackup = {at:d.exportedAt || new Date().toISOString(), sig:signature()};
      resetStaleFilters();
      applyTheme(); save(); closeSheet(); toast("Restored from backup");
    }catch(err){ toast("That file isn't a Bill Ledger backup"); }
  };
  r.readAsText(f);
  e.target.value = "";
};

/* ── events ─────────────────────────────────────────────────────── */
$("#main").addEventListener("click", e => {
  const act = e.target.closest("[data-act]");
  if(act){
    if(act.dataset.act === "restore") $("#importFile").click();
    if(act.dataset.act === "add") $("#addBtn").click();
    return;
  }
  const mode = e.target.closest("[data-mode]");
  if(mode){ S.viewMode = mode.dataset.mode; save(); render(); return; }
  const tick = e.target.closest("[data-tick]");
  if(tick){
    const id = tick.dataset.tick, pk = periodKey(UI.y, UI.m);
    const cur = payFor(id, pk);
    setStatus(id, pk, cur && cur.status === "paid" ? null : "paid");
    render();
    return;
  }
  const open = e.target.closest("[data-open]");
  if(open) openSheet(open.dataset.open, open.dataset.period);
});

document.querySelectorAll(".tab").forEach(t => t.onclick = () => { UI.view = t.dataset.view; render(); });
$("#prevM").onclick = () => { if(--UI.m < 0){ UI.m = 11; UI.y--; } render(); };
$("#nextM").onclick = () => { if(++UI.m > 11){ UI.m = 0; UI.y++; } render(); };
$("#mLabel").onclick = () => { UI.y = now.getFullYear(); UI.m = now.getMonth(); render(); };

document.addEventListener("click", e => {
  const chip = e.target.closest(".chip[data-f]");
  if(!chip) return;
  const {f, v} = chip.dataset;
  if(f === "cur") UI.cur = v;
  if(f === "src") UI.src = (UI.src === v ? "all" : v);
  render();
});

$("#addBtn").onclick = () => {
  const b = {
    id:uid(), name:"", amount:0, currency:UI.cur === "INR" ? "INR" : "USD",
    sourceId:S.sources[0] ? S.sources[0].id : "", dueDay:1, freq:"monthly",
    anchorY:UI.y, anchorM:UI.m, endYear:null, note:"", archived:false
  };
  S.bills.push(b); UI.draft = true; save();
  openSheet(b.id);
  setTimeout(() => { const el = $("#bName"); if(el) el.focus(); }, 280);
};
$("#dataBtn").onclick = openData;
$("#sheetDone").onclick = closeSheet;
$("#scrim").onclick = closeSheet;
document.addEventListener("keydown", e => { if(e.key === "Escape" && $("#sheet").classList.contains("on")) closeSheet(); });

/* theme */
function applyTheme(){
  if(S.theme) document.documentElement.setAttribute("data-theme", S.theme);
  else document.documentElement.removeAttribute("data-theme");
}
$("#themeBtn").onclick = () => {
  const dark = matchMedia("(prefers-color-scheme: dark)").matches;
  const cur = S.theme || (dark ? "dark" : "light");
  S.theme = cur === "dark" ? "light" : "dark";
  applyTheme(); save();
};

applyTheme();
saveLocal();   // persist the starter list on first open
render();
syncBoot();    // no-op unless GitHub sync is switched on
})();
